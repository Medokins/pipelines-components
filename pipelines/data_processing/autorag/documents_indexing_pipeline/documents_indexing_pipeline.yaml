# PIPELINE DEFINITION
# Name: autorag-documents-indexing-pipeline
# Description: AutoRAG pipeline for preparing a high-quality knowledge base for accurate RAG retrieval. It transforms unstructured documents into optimized vector indexes for semantic search and downstream RAG workflows. Delivers production-grade embeddings, flexible indexing controls, and a reliable foundation for scalable RAG applications.
# Inputs:
#    batch_size: int [Default: 20.0]
#    chunk_overlap: int [Default: 0.0]
#    chunk_size: int [Default: 1024.0]
#    chunking_method: str [Default: 'recursive']
#    collection_name: str
#    distance_metric: str [Default: 'cosine']
#    do_ocr: bool [Default: False]
#    embedding_model_id: str
#    embedding_params: dict
#    input_data_bucket_name: str
#    input_data_key: str
#    input_data_secret_name: str
#    ocr_lang: str
#    ogx_secret_name: str
#    vector_io_provider_id: str
components:
  comp-documents-discovery:
    executorLabel: exec-documents-discovery
    inputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Optional input artifact containing test data for sampling.
          isOptional: true
      parameters:
        input_data_bucket_name:
          description: S3 (or compatible) bucket containing input data.
          parameterType: STRING
        input_data_path:
          defaultValue: ''
          description: Path to folder with input documents within the bucket.
          isOptional: true
          parameterType: STRING
        sampling_enabled:
          defaultValue: true
          description: Whether to enable sampling or not.
          isOptional: true
          parameterType: BOOLEAN
        sampling_max_size:
          defaultValue: 1.0
          description: Maximum size of sampled documents (in gigabytes).
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        discovered_documents:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-documents-indexing:
    executorLabel: exec-documents-indexing
    inputDefinitions:
      artifacts:
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact (folder) containing DoclingDocument JSON

            files from text extraction.'
      parameters:
        batch_size:
          defaultValue: 20.0
          description: Number of documents per batch; 0 means process all in one batch.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunk_overlap:
          defaultValue: 0.0
          description: Chunk overlap in characters.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunk_size:
          defaultValue: 1024.0
          description: Chunk size in characters.
          isOptional: true
          parameterType: NUMBER_INTEGER
        chunking_method:
          defaultValue: recursive
          description: Chunking method.
          isOptional: true
          parameterType: STRING
        collection_name:
          description: Optional name of the collection to reuse; omit to create a
            new one.
          isOptional: true
          parameterType: STRING
        distance_metric:
          defaultValue: cosine
          description: Vector distance metric (e.g. "cosine").
          isOptional: true
          parameterType: STRING
        embedding_model_id:
          description: Embedding model ID used for the vector store.
          parameterType: STRING
        embedding_params:
          description: Optional embedding parameters.
          isOptional: true
          parameterType: STRUCT
        vector_io_provider_id:
          description: OGX provider ID for the vector database.
          parameterType: STRING
  comp-text-extraction:
    executorLabel: exec-text-extraction
    inputDefinitions:
      artifacts:
        documents_descriptor:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact containing

            documents_descriptor.json with bucket, prefix, and documents list.'
      parameters:
        do_ocr:
          defaultValue: false
          description: Enable RapidOCR via Docling for scanned PDFs / images. Off
            by default.
          isOptional: true
          parameterType: BOOLEAN
        error_tolerance:
          description: 'Fraction of documents (0.0-1.0) allowed to fail without

            raising an error. None (the default) means zero tolerance.'
          isOptional: true
          parameterType: NUMBER_DOUBLE
        max_extraction_workers:
          description: 'Number of parallel worker processes used for text

            extraction. Defaults to 4. Set to None to use all available CPU cores.'
          isOptional: true
          parameterType: NUMBER_INTEGER
        ocr_cls_model_path:
          description: Optional local path to a custom RapidOCR classification ONNX
            model.
          isOptional: true
          parameterType: STRING
        ocr_det_model_path:
          description: Optional local path to a custom RapidOCR detection ONNX model.
          isOptional: true
          parameterType: STRING
        ocr_lang:
          description: 'RapidOCR language (e.g. ``"english"`` or ``"chinese"``). When
            None,

            ai4rag defaults to English.'
          isOptional: true
          parameterType: STRING
        ocr_rec_keys_path:
          description: Optional local path to a custom RapidOCR recognition keys file.
          isOptional: true
          parameterType: STRING
        ocr_rec_model_path:
          description: Optional local path to a custom RapidOCR recognition ONNX model.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-documents-discovery:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - documents_discovery
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef documents_discovery(\n    input_data_bucket_name:\
          \ str,\n    input_data_path: str = \"\",\n    test_data: dsl.Input[dsl.Artifact]\
          \ = None,\n    sampling_enabled: bool = True,\n    sampling_max_size: float\
          \ = 1,\n    discovered_documents: dsl.Output[dsl.Artifact] = None,\n   \
          \ component_status: dsl.Output[dsl.Artifact] = None,\n    embedded_artifact:\
          \ dsl.EmbeddedInput[dsl.Dataset] = None,\n):\n    \"\"\"Documents discovery\
          \ component.\n\n    Thin wrapper that delegates to ``ai4rag.components.data.documents_discovery.discover_documents``.\n\
          \n    Args:\n        input_data_bucket_name: S3 (or compatible) bucket containing\
          \ input data.\n        input_data_path: Path to folder with input documents\
          \ within the bucket.\n        test_data: Optional input artifact containing\
          \ test data for sampling.\n        sampling_enabled: Whether to enable sampling\
          \ or not.\n        sampling_max_size: Maximum size of sampled documents\
          \ (in gigabytes).\n        discovered_documents: Output artifact containing\
          \ the documents descriptor JSON file.\n        component_status: Output\
          \ artifact containing stage-level progress tracking.\n        embedded_artifact:\
          \ Embedded ``autorag.shared`` helpers injected by KFP at runtime.\n\n  \
          \  Environment variables (required when run with pipeline secret injection):\n\
          \        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT.\n  \
          \      AWS_DEFAULT_REGION is optional.\n    \"\"\"\n    import importlib.util\n\
          \    import json\n    import logging\n    from pathlib import Path\n\n \
          \   from ai4rag.components.data.documents_discovery import discover_documents\n\
          \    from ai4rag.components.utils.s3 import create_s3_client\n\n    logging.basicConfig(level=logging.INFO)\n\
          \n    if component_status is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _embedded_path = Path(embedded_artifact.path)\n        _module_path\
          \ = _embedded_path if _embedded_path.is_file() else _embedded_path / \"\
          component_status.py\"\n        _spec = importlib.util.spec_from_file_location(\"\
          _autorag_component_status\", _module_path)\n        if _spec is None or\
          \ _spec.loader is None:\n            raise ValueError(f\"Cannot load embedded\
          \ module from {_module_path}\")\n        _status_module = importlib.util.module_from_spec(_spec)\n\
          \        _spec.loader.exec_module(_status_module)\n        status = _status_module.bootstrap_status_tracker(embedded_artifact,\
          \ component_status, \"documents_discovery\")\n    with status:\n       \
          \ if component_status is not None:\n            status.set_metadata(display_name=\"\
          Documents Discovery Status\")\n            component_status.metadata[\"\
          display_name\"] = \"Documents Discovery Status\"\n        with status.stage(\"\
          discover_documents\"):\n            test_data_doc_names = None\n       \
          \     if test_data:\n                with open(test_data.path, \"r\", encoding=\"\
          utf-8\") as f:\n                    records = json.load(f)\n           \
          \     test_data_doc_names = list(\n                    {doc_id for r in\
          \ records for doc_id in r.get(\"correct_answer_document_ids\", [])}\n  \
          \              )\n\n            s3_client = create_s3_client()\n\n     \
          \       result = discover_documents(\n                bucket_name=input_data_bucket_name,\n\
          \                prefix=input_data_path,\n                test_data_doc_names=test_data_doc_names,\n\
          \                sampling_enabled=sampling_enabled,\n                sampling_max_size_gb=sampling_max_size,\n\
          \                s3_client=s3_client,\n            )\n\n            output_dir\
          \ = Path(discovered_documents.path)\n            output_dir.mkdir(parents=True,\
          \ exist_ok=True)\n            result.save(path=output_dir, filename=\"documents_descriptor.json\"\
          )\n\n"
        image: quay.io/opendatahub/odh-autorag:odh-stable
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
    exec-documents-indexing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - documents_indexing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef documents_indexing(\n    embedding_model_id: str,\n    extracted_text:\
          \ dsl.Input[dsl.Artifact],\n    vector_io_provider_id: str,\n    embedding_params:\
          \ Optional[dict] = None,\n    distance_metric: str = \"cosine\",\n    chunking_method:\
          \ str = \"recursive\",\n    chunk_size: int = 1024,\n    chunk_overlap:\
          \ int = 0,\n    batch_size: int = 20,\n    collection_name: Optional[str]\
          \ = None,\n):\n    \"\"\"Index extracted text into a vector store with optional\
          \ batch processing.\n\n    Thin wrapper that delegates to ``ai4rag.components.data.indexing.index_documents``.\n\
          \n    Args:\n        embedding_model_id: Embedding model ID used for the\
          \ vector store.\n        extracted_text: Input artifact (folder) containing\
          \ DoclingDocument JSON\n            files from text extraction.\n      \
          \  vector_io_provider_id: OGX provider ID for the vector database.\n   \
          \     embedding_params: Optional embedding parameters.\n        distance_metric:\
          \ Vector distance metric (e.g. \"cosine\").\n        chunking_method: Chunking\
          \ method.\n        chunk_size: Chunk size in characters.\n        chunk_overlap:\
          \ Chunk overlap in characters.\n        batch_size: Number of documents\
          \ per batch; 0 means process all in one batch.\n        collection_name:\
          \ Optional name of the collection to reuse; omit to create a new one.\n\
          \    \"\"\"\n    import logging\n    import os\n\n    from ai4rag.components.data.indexing\
          \ import index_documents\n    from ai4rag.components.utils.ogx_client import\
          \ create_ogx_client\n\n    logging.basicConfig(level=logging.INFO)\n\n \
          \   ogx_client = create_ogx_client(\n        base_url=os.environ[\"OGX_CLIENT_BASE_URL\"\
          ],\n        api_key=os.environ[\"OGX_CLIENT_API_KEY\"],\n    )\n\n    index_documents(\n\
          \        extracted_text_dir=extracted_text.path,\n        embedding_model_id=embedding_model_id,\n\
          \        vector_io_provider_id=vector_io_provider_id,\n        ogx_client=ogx_client,\n\
          \        embedding_params=embedding_params,\n        distance_metric=distance_metric,\n\
          \        chunking_method=chunking_method,\n        chunk_size=chunk_size,\n\
          \        chunk_overlap=chunk_overlap,\n        batch_size=batch_size,\n\
          \        collection_name=collection_name,\n    )\n\n"
        image: quay.io/opendatahub/odh-autorag:odh-stable
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
    exec-text-extraction:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - text_extraction
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef text_extraction(\n    documents_descriptor:\
          \ dsl.Input[dsl.Artifact],\n    extracted_text: dsl.Output[dsl.Artifact],\n\
          \    component_status: dsl.Output[dsl.Artifact] = None,\n    embedded_artifact:\
          \ dsl.EmbeddedInput[dsl.Dataset] = None,\n    error_tolerance: Optional[float]\
          \ = None,\n    max_extraction_workers: Optional[int] = None,\n    do_ocr:\
          \ bool = False,\n    ocr_lang: Optional[str] = None,\n    ocr_det_model_path:\
          \ Optional[str] = None,\n    ocr_cls_model_path: Optional[str] = None,\n\
          \    ocr_rec_model_path: Optional[str] = None,\n    ocr_rec_keys_path: Optional[str]\
          \ = None,\n):\n    \"\"\"Text Extraction component.\n\n    Thin wrapper\
          \ that delegates to ``ai4rag.components.data.text_extraction.extract_text``.\n\
          \n    Args:\n        documents_descriptor: Input artifact containing\n \
          \           documents_descriptor.json with bucket, prefix, and documents\
          \ list.\n        extracted_text: Output artifact directory where DoclingDocument\
          \ JSON files\n            will be written.\n        component_status: Output\
          \ artifact containing stage-level progress tracking.\n        embedded_artifact:\
          \ Embedded ``autorag.shared`` helpers injected by KFP at runtime.\n    \
          \    error_tolerance: Fraction of documents (0.0-1.0) allowed to fail without\n\
          \            raising an error. None (the default) means zero tolerance.\n\
          \        max_extraction_workers: Number of parallel worker processes used\
          \ for text\n            extraction. Defaults to 4. Set to None to use all\
          \ available CPU cores.\n        do_ocr: Enable RapidOCR via Docling for\
          \ scanned PDFs / images. Off by default.\n        ocr_lang: RapidOCR language\
          \ (e.g. ``\"english\"`` or ``\"chinese\"``). When None,\n            ai4rag\
          \ defaults to English.\n        ocr_det_model_path: Optional local path\
          \ to a custom RapidOCR detection ONNX model.\n        ocr_cls_model_path:\
          \ Optional local path to a custom RapidOCR classification ONNX model.\n\
          \        ocr_rec_model_path: Optional local path to a custom RapidOCR recognition\
          \ ONNX model.\n        ocr_rec_keys_path: Optional local path to a custom\
          \ RapidOCR recognition keys file.\n    \"\"\"\n    import importlib.util\n\
          \    import json\n    import logging\n    import os\n    from pathlib import\
          \ Path\n\n    from ai4rag.components.data.text_extraction import extract_text\n\
          \n    logging.basicConfig(level=logging.INFO)\n\n    if component_status\
          \ is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _embedded_path = Path(embedded_artifact.path)\n        _module_path\
          \ = _embedded_path if _embedded_path.is_file() else _embedded_path / \"\
          component_status.py\"\n        _spec = importlib.util.spec_from_file_location(\"\
          _autorag_component_status\", _module_path)\n        if _spec is None or\
          \ _spec.loader is None:\n            raise ValueError(f\"Cannot load embedded\
          \ module from {_module_path}\")\n        _status_module = importlib.util.module_from_spec(_spec)\n\
          \        _spec.loader.exec_module(_status_module)\n        status = _status_module.bootstrap_status_tracker(embedded_artifact,\
          \ component_status, \"text_extraction\")\n    with status:\n        if component_status\
          \ is not None:\n            status.set_metadata(display_name=\"Text Extraction\
          \ Status\")\n            component_status.metadata[\"display_name\"] = \"\
          Text Extraction Status\"\n        with status.stage(\"extract_documents\"\
          ):\n            descriptor_path = Path(documents_descriptor.path) / \"documents_descriptor.json\"\
          \n            with open(descriptor_path, \"r\", encoding=\"utf-8\") as f:\n\
          \                descriptor = json.load(f)\n\n            output_dir = Path(extracted_text.path)\n\
          \            output_dir.mkdir(parents=True, exist_ok=True)\n\n         \
          \   extract_text(\n                documents=descriptor[\"documents\"],\n\
          \                bucket=descriptor[\"bucket\"],\n                output_dir=output_dir,\n\
          \                s3_endpoint=os.environ.get(\"AWS_S3_ENDPOINT\"),\n    \
          \            s3_access_key=os.environ.get(\"AWS_ACCESS_KEY_ID\"),\n    \
          \            s3_secret_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\"),\n\
          \                s3_region=os.environ.get(\"AWS_DEFAULT_REGION\"),\n   \
          \             error_tolerance=error_tolerance,\n                max_extraction_workers=max_extraction_workers,\n\
          \                docling_artifacts_path=os.environ.get(\"DOCLING_ARTIFACTS_PATH\"\
          ),\n                do_ocr=do_ocr,\n                ocr_lang=ocr_lang,\n\
          \                ocr_det_model_path=ocr_det_model_path,\n              \
          \  ocr_cls_model_path=ocr_cls_model_path,\n                ocr_rec_model_path=ocr_rec_model_path,\n\
          \                ocr_rec_keys_path=ocr_rec_keys_path,\n            )\n\n"
        image: quay.io/opendatahub/odh-autorag:odh-stable
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
pipelineInfo:
  description: AutoRAG pipeline for preparing a high-quality knowledge base for accurate
    RAG retrieval. It transforms unstructured documents into optimized vector indexes
    for semantic search and downstream RAG workflows. Delivers production-grade embeddings,
    flexible indexing controls, and a reliable foundation for scalable RAG applications.
  name: autorag-documents-indexing-pipeline
root:
  dag:
    tasks:
      documents-discovery:
        cachingOptions: {}
        componentRef:
          name: comp-documents-discovery
        inputs:
          parameters:
            input_data_bucket_name:
              componentInputParameter: input_data_bucket_name
            input_data_path:
              componentInputParameter: input_data_key
        taskInfo:
          name: documents-discovery
      documents-indexing:
        cachingOptions: {}
        componentRef:
          name: comp-documents-indexing
        dependentTasks:
        - text-extraction
        inputs:
          artifacts:
            extracted_text:
              taskOutputArtifact:
                outputArtifactKey: extracted_text
                producerTask: text-extraction
          parameters:
            batch_size:
              componentInputParameter: batch_size
            chunk_overlap:
              componentInputParameter: chunk_overlap
            chunk_size:
              componentInputParameter: chunk_size
            chunking_method:
              componentInputParameter: chunking_method
            collection_name:
              componentInputParameter: collection_name
            distance_metric:
              componentInputParameter: distance_metric
            embedding_model_id:
              componentInputParameter: embedding_model_id
            embedding_params:
              componentInputParameter: embedding_params
            vector_io_provider_id:
              componentInputParameter: vector_io_provider_id
        taskInfo:
          name: documents-indexing
      text-extraction:
        cachingOptions: {}
        componentRef:
          name: comp-text-extraction
        dependentTasks:
        - documents-discovery
        inputs:
          artifacts:
            documents_descriptor:
              taskOutputArtifact:
                outputArtifactKey: discovered_documents
                producerTask: documents-discovery
          parameters:
            do_ocr:
              componentInputParameter: do_ocr
            ocr_lang:
              componentInputParameter: ocr_lang
        taskInfo:
          name: text-extraction
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 20.0
        description: Number of documents per batch (0 = process all at once).
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunk_overlap:
        defaultValue: 0.0
        description: Chunk overlap in characters.
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunk_size:
        defaultValue: 1024.0
        description: Chunk size in characters.
        isOptional: true
        parameterType: NUMBER_INTEGER
      chunking_method:
        defaultValue: recursive
        description: Chunking method (e.g. "recursive").
        isOptional: true
        parameterType: STRING
      collection_name:
        description: Optional name of the collection to reuse; omit to create a new
          one.
        isOptional: true
        parameterType: STRING
      distance_metric:
        defaultValue: cosine
        description: Vector distance metric (e.g. "cosine").
        isOptional: true
        parameterType: STRING
      do_ocr:
        defaultValue: false
        description: Enable RapidOCR during text extraction (scanned PDFs / images).
          Off by default.
        isOptional: true
        parameterType: BOOLEAN
      embedding_model_id:
        description: Embedding model ID for the vector store.
        parameterType: STRING
      embedding_params:
        description: 'Dict passed to OGXEmbeddingParams (default: {}).'
        isOptional: true
        parameterType: STRUCT
      input_data_bucket_name:
        description: Name of the S3 bucket containing input data.
        parameterType: STRING
      input_data_key:
        description: Path to folder with input documents within bucket.
        isOptional: true
        parameterType: STRING
      input_data_secret_name:
        description: 'Name of the secret with S3 credentials for input data

          ("AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_S3_ENDPOINT", "AWS_DEFAULT_REGION").'
        parameterType: STRING
      ocr_lang:
        description: RapidOCR language (e.g. ``"english"``). When None, ai4rag defaults
          to English.
        isOptional: true
        parameterType: STRING
      ogx_secret_name:
        description: 'Name of the secret with OGX credentials

          ("OGX_CLIENT_BASE_URL", "OGX_CLIENT_API_KEY").'
        parameterType: STRING
      vector_io_provider_id:
        description: Optional OGX provider ID.
        parameterType: STRING
