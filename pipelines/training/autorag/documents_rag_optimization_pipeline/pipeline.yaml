          \ in one batch after search() returns.\n            event_handler = _mlflow_tracking.MlflowPatternEventHandler(KFPEventHandler(),\
          \ run_logger)\n\n            rag_exp = AI4RAGExperiment(\n             \
          \   event_handler=event_handler,\n                optimizer_settings=optimizer_settings,\n\
          \                search_space=search_space,\n                benchmark_data=benchmark_data,\n\
          \                vector_store_config=vector_store_config,\n            \
          \    documents=documents,\n                optimization_metric=optimization_metric,\n\
          \                inference_max_threads=inference_max_threads,\n        \
          \        evaluators=evaluators,\n            )\n\n            # --- Run\
          \ the optimization loop ---\n            rag_exp.search()\n\n          \
          \  # --- Generate output artefacts ---\n            output_dir = Path(output_dir)\n\
          \            output_dir.mkdir(parents=True, exist_ok=True)\n\n         \
          \   patterns = _generate_output_artifacts(\n                patterns_raw=event_handler.patterns,\n\
          \                output_dir=output_dir,\n                input_data_key=input_data_keys[0]\
          \ if input_data_keys else \"\",\n                test_data_key=test_data_key,\n\
          \                indexing_pipeline_params=indexing_pipeline_params,\n  \
          \          )\n\n            status.record(\n                \"optimize_templates\"\
          ,\n                \"completed\",\n                metrics={\n         \
          \           \"max_rag_patterns\": len(patterns),\n                    \"\
          selected_patterns\": [p.get(\"name\", \"\") for p in patterns],\n      \
          \          },\n            )\n\n            rag_patterns.metadata[\"name\"\
          ] = \"rag_patterns_artifact\"\n            rag_patterns.metadata[\"uri\"\
          ] = rag_patterns.uri\n            rag_patterns.metadata[\"metadata\"] =\
          \ {\"patterns\": patterns}\n\n        with status.stage(\"build_leaderboard\"\
          ):\n            html_content = build_leaderboard_html(\n               \
          \ patterns_dir=output_dir,\n                optimization_metric=optimization_metric.name,\n\
          \                optimization_metric_evaluator=optimization_metric.evaluator,\n\
          \            )\n\n            Path(leaderboard.path).parent.mkdir(parents=True,\
          \ exist_ok=True)\n            with open(leaderboard.path, \"w\", encoding=\"\
          utf-8\") as f:\n                f.write(html_content)\n            leaderboard.metadata[\"\
          display_name\"] = \"autorag_leaderboard\"\n\n        with status.stage(\"\
          log_mlflow_results\"):\n            # Child runs were already written live\
          \ during search(); this closes out the\n            # parent with the job-level\
