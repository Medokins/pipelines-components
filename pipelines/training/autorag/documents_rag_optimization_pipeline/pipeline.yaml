          \ exist_ok=True)\n\n            pattern_data = pattern.get(\"payload\")\n\
          \            if indexing_pipeline_params:\n                settings = pattern_data[\"\
          settings\"]\n                vector_store_binding = settings[\"vector_store_binding\"\
          ]\n                pattern_data[\"indexing\"] = {\n                    \"\
          pipeline_spec\": {\n                        \"pipeline_name\": indexing_pipeline_params.get(\"\
          pipeline_name\", \"documents_indexing_pipeline\"),\n                   \
          \     \"parameters\": {\n                            \"maas_secret_name\"\
          : indexing_pipeline_params.get(\"maas_secret_name\"),\n                \
          \            \"vector_db_secret_name\": indexing_pipeline_params.get(\"\
          vector_db_secret_name\"),\n                            \"input_data_secret_name\"\
          : indexing_pipeline_params.get(\"input_data_secret_name\"),\n          \
          \                  \"input_data_bucket_name\": indexing_pipeline_params.get(\"\
          input_data_bucket_name\"),\n                            \"input_data_keys\"\
          : indexing_pipeline_params.get(\"input_data_keys\"),\n                 \
          \           \"batch_size\": indexing_pipeline_params.get(\"batch_size\"\
          ),\n                            \"provider_type\": vector_store_binding[\"\
          provider_type\"],\n                            \"collection_name\": vector_store_binding[\"\
          collection_name\"],\n                            \"embedding_model_id\"\
          : settings[\"embedding\"][\"model_id\"],\n                            \"\
          embedding_params\": settings[\"embedding\"][\"embedding_params\"],\n   \
          \                         \"chunking_method\": settings[\"chunking\"][\"\
          method\"],\n                            \"chunk_size\": settings[\"chunking\"\
          ][\"chunk_size\"],\n                            \"chunk_overlap\": settings[\"\
          chunking\"][\"chunk_overlap\"],\n                        },\n          \
          \              \"overrides_allowed\": [\n                            \"\
          input_data_secret_name\",\n                            \"input_data_bucket_name\"\
          ,\n                            \"input_data_keys\",\n                  \
          \          \"collection_name\",\n                            \"batch_size\"\
          ,\n                        ],\n                    }\n                }\n\
          \n            generate_notebook_from_template(\n                \"maas_indexing\"\
          ,\n                pattern_data,\n                patt_dir / \"indexing.ipynb\"\
          ,\n                input_data_key=input_data_key,\n            )\n     \
          \       generate_notebook_from_template(\n                \"maas_inference\"\
          ,\n                pattern_data,\n                patt_dir / \"inference.ipynb\"\
          ,\n                test_data_key=test_data_key,\n            )\n\n     \
          \       with (patt_dir / \"pattern.json\").open(\"w\", encoding=\"utf-8\"\
          ) as f:\n                json.dump(pattern_data, f, indent=2, ensure_ascii=False)\n\
          \n            with (patt_dir / \"evaluation_results.json\").open(\"w\",\
          \ encoding=\"utf-8\") as f:\n                json.dump(pattern.get(\"evaluation_results\"\
          , []), f, indent=2, ensure_ascii=False)\n\n            patterns.append(pattern_data)\n\
          \n        return patterns\n\n    def _validate_optimization_settings(optimization_settings:\
          \ dict | None) -> dict:\n        \"\"\"Validate and normalize optimization\
          \ settings.\n\n        Returns:\n            Validated settings dictionary\
          \ (empty dict when input is ``None``).\n\n        Raises:\n            TypeError:\
          \ If settings or ``max_number_of_rag_patterns`` have\n                wrong\
          \ types.\n            ValueError: If ``max_number_of_rag_patterns`` is out\
          \ of the\n                allowed range or cannot be parsed as an integer.\n\
          \        \"\"\"\n        if optimization_settings is None:\n           \
          \ return {}\n\n        if not isinstance(optimization_settings, dict):\n\
          \            raise TypeError(\"optimization_settings must be a dictionary.\"\
          )\n\n        max_rag_patterns = optimization_settings.get(\"max_number_of_rag_patterns\"\
          , DEFAULT_MAX_RAG_PATTERNS)\n        if isinstance(max_rag_patterns, str):\n\
          \            try:\n                max_rag_patterns = int(max_rag_patterns.strip())\n\
          \            except ValueError as exc:\n                raise ValueError(\n\
          \                    \"optimization_settings.max_number_of_rag_patterns\
          \ must be a valid integer \"\n                    f\"(e.g. from the pipeline\
          \ UI); got {max_rag_patterns!r}.\"\n                ) from exc\n\n     \
          \   if not isinstance(max_rag_patterns, int):\n            raise TypeError(\"\
          optimization_settings.max_number_of_rag_patterns must be an integer.\")\n\
          \n        if not MIN_MAX_RAG_PATTERNS_RANGE[0] <= max_rag_patterns <= MIN_MAX_RAG_PATTERNS_RANGE[1]:\n\
          \            raise ValueError(\n                f\"optimization_settings.max_number_of_rag_patterns\
          \ must be in range \"\n                f\"{MIN_MAX_RAG_PATTERNS_RANGE[0]}\
          \ to {MIN_MAX_RAG_PATTERNS_RANGE[1]}.\"\n            )\n\n        return\
          \ optimization_settings\n\n    def _get_optimization_metric(metric_id: str\
          \ | None, *, active_evaluators: frozenset[str]) -> RAGMetric:\n        \"\
          \"\"Resolve a preset-supported ``evaluator:metric`` ID to a ``RAGMetric``.\n\
          \n        Args:\n            metric_id: Metric requested via ``optimization_settings.metric``.\n\
          \                Qualified IDs (for example, ``\"unitxt:faithfulness\"``)\
          \ avoid\n                ambiguity between evaluator metric names. Unqualified\
