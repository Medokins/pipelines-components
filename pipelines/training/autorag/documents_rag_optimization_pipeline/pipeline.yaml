          `` when\n                RAGAS is enabled, and otherwise require one enabled\
          \ metric.\n            active_evaluators: Evaluators enabled by the selected\
          \ preset.\n\n        Returns:\n            The resolved metric.\n\n    \
          \    Raises:\n            ValueError: If the metric is unknown, unsupported\
          \ by the selected\n                preset, or ambiguous without an evaluator\
          \ prefix.\n        \"\"\"\n        if metric_id is not None and not isinstance(metric_id,\
          \ str):\n            raise TypeError(\"optimization_settings.metric must\
          \ be a string.\")\n        metric_id = metric_id or DEFAULT_METRIC\n   \
          \     evaluator, separator, metric_name = metric_id.partition(\":\")\n \
          \       if not separator:\n            metric_name = evaluator\n       \
          \ candidates = [m for m in Metrics if m.name == metric_name and (not separator\
          \ or m.evaluator == evaluator)]\n        if not candidates:\n          \
          \  raise ValueError(\n                f\"Optimization metric {metric_id!r}\
          \ is not supported. \"\n                f\"Select one of {sorted(f'{m.evaluator}:{m.name}'\
          \ for m in Metrics)}.\"\n            )\n\n        available = [m for m in\
          \ candidates if m.evaluator in active_evaluators]\n        if not available:\n\
          \            raise ValueError(\n                f\"Optimization metric {metric_id!r}\
          \ is unavailable for this preset. \"\n                f\"It requires evaluator(s)\
          \ {sorted({m.evaluator for m in candidates})}, \"\n                f\"but\
          \ this preset enables {sorted(active_evaluators)}.\"\n            )\n  \
          \      if len(available) > 1:\n            preferred_evaluator = LEGACY_METRIC_PREFERENCES.get(metric_name)\n\
          \            preferred_metric = next((m for m in available if m.evaluator\
          \ == preferred_evaluator), None)\n            if preferred_metric is not\
          \ None:\n                return preferred_metric\n            raise ValueError(\n\
          \                f\"Optimization metric {metric_id!r} is ambiguous. Select\
          \ one of \"\n                f\"{sorted(f'{m.evaluator}:{m.name}' for m\
          \ in available)}.\"\n            )\n\n        return available[0]\n\n  \
          \  # -------------------------------------------------------------------------\n\
          \    # Component logic starts here\n    # -------------------------------------------------------------------------\n\
          \n    if preset not in VALID_PRESETS:\n        raise ValueError(f\"preset\
          \ must be one of {VALID_PRESETS}; got {preset!r}.\")\n\n    active_evaluators\
          \ = PRESET_EVALUATORS[preset]\n    inference_max_threads = PRESET_INFERENCE_MAX_THREADS[preset]\n\
          \    logging.info(\"Preset %r: inference_max_threads=%d\", preset, inference_max_threads)\n\
          \n    def _load_embedded_module(module_filename: str, module_alias: str)\
          \ -> Any:\n        \"\"\"Load one module from the embedded ``autorag.shared``\
          \ package.\n\n        KFP mounts the embedded artifact as a directory. A\
          \ single-file mount is also\n        tolerated, for compatibility with embeds\
          \ carrying only ``component_status.py``.\n        \"\"\"\n        embedded_root\
          \ = Path(embedded_artifact.path)\n        if embedded_root.is_file():\n\
          \            if embedded_root.name != module_filename:\n               \
          \ raise FileNotFoundError(f\"Embedded artifact {embedded_root} does not\
          \ provide {module_filename}.\")\n            module_path = embedded_root\n\
          \        else:\n            module_path = embedded_root / module_filename\n\
          \        spec = importlib.util.spec_from_file_location(module_alias, module_path)\n\
          \        if spec is None or spec.loader is None:\n            raise ValueError(f\"\
          Cannot load embedded module from {module_path}\")\n        module = importlib.util.module_from_spec(spec)\n\
          \        # Register before exec_module: @dataclass resolves string annotations\
          \ (these\n        # modules use `from __future__ import annotations`) through\
          \ sys.modules[__module__],\n        # which raises AttributeError if the\
          \ module is not there yet.\n        sys.modules[module_alias] = module\n\
          \        spec.loader.exec_module(module)\n        return module\n\n    if\
          \ embedded_artifact is None:\n        from kfp_components.components.training.autorag.shared\
          \ import (  # pyright: ignore[reportMissingImports]\n            mlflow_tracking\
          \ as _mlflow_tracking,\n        )\n    else:\n        _mlflow_tracking =\
          \ _load_embedded_module(\"mlflow_tracking.py\", \"_autorag_mlflow_tracking\"\
          )\n\n    if component_status is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _status_module = _load_embedded_module(\"component_status.py\"\
          , \"_autorag_component_status\")\n        status = _status_module.bootstrap_status_tracker(\n\
          \            embedded_artifact, component_status, \"rag_templates_optimization\"\
          \n        )\n\n    # MLflow logging is best-effort and self-disabling: when\
