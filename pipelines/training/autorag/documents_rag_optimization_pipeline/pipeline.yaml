          \    patterns_raw: list[dict],\n        output_dir: Path,\n        input_data_key:\
          \ str,\n        test_data_key: str,\n        indexing_pipeline_params: dict\
          \ | None,\n    ) -> list[dict]:\n        \"\"\"Write per-pattern artefacts\
