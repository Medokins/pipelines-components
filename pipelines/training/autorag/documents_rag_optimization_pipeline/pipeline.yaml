          \      _mlflow_tracking.experiment_run_logger(\n            run_name=run_name\
          \ or pipeline_name,\n            log_evaluation_artifacts=log_evaluation_artifacts,\n\
          \        ) as run_logger,\n    ):\n        if component_status is not None:\n\
          \            status.set_metadata(display_name=\"RAG Templates Optimization\
          \ Status\")\n            component_status.metadata[\"display_name\"] = \"\
          RAG Templates Optimization Status\"\n        with status.stage(\"optimize_templates\"\
          ):\n            maas_client = create_maas_client(\n                base_url=os.environ[\"\
          MAAS_BASE_URL\"],\n                api_key=os.environ[\"MAAS_API_KEY\"],\n\
          \            )\n\n            if any(k.startswith(\"MILVUS\") for k in os.environ):\n\
          \                provider = \"milvus\"\n            elif any(k.startswith(\"\
          PGVECTOR\") for k in os.environ):\n                provider = \"pgvector\"\
          \n            else:\n                raise ValueError(\n               \
          \     \"No vector database configuration found. Expected MILVUS_* or PGVECTOR_*\
          \ \"\n                    \"environment variables injected from vector_db_secret_name.\"\
          \n                )\n            vector_store_config = get_vector_store_config(provider)\n\
          \            logging.info(\"Detected %s database provider from secret.\"\
          , provider)\n\n            output_dir = Path(rag_patterns.path)\n      \
          \      output_dir.mkdir(parents=True, exist_ok=True)\n\n            # Deployment\
          \ blueprint stamped into every pattern.json so the indexing\n          \
          \  # pipeline can be reproduced. provider_type/collection_name are added\n\
          \            # by ai4rag from each pattern's vector_store_binding.\n   \
          \         indexing_pipeline_params = {\n                \"pipeline_name\"\
          : \"documents-indexing-pipeline\",\n                \"maas_secret_name\"\
          : maas_secret_name,\n                \"vector_db_secret_name\": vector_db_secret_name,\n\
          \                \"input_data_secret_name\": input_data_secret_name,\n \
          \               \"input_data_bucket_name\": input_data_bucket_name,\n  \
          \              \"input_data_keys\": input_data_keys or [],\n           \
          \     \"batch_size\": 20,\n            }\n\n            if (\n         \
          \       not isinstance(test_data_key, str)\n                or not test_data_key.strip()\n\
          \                or not test_data_key.lower().endswith(\".json\")\n    \
          \        ):\n                raise ValueError(\"test_data_key must point\
          \ to a JSON file.\")\n\n            settings = _validate_optimization_settings(optimization_settings)\n\
          \            optimization_metric = _get_optimization_metric(settings.get(\"\
          metric\"), active_evaluators=active_evaluators)\n\n            documents\
          \ = load_docling_documents(extracted_text)\n            benchmark_data =\
          \ pd.read_json(Path(test_data))\n\n            # --- Reconstruct search\
          \ space from report ---\n            with open(search_space_mps_report,\
          \ \"r\", encoding=\"utf-8\") as f:\n                search_space_raw: dict[str,\
          \ Any] = json.load(f)\n\n            foundation_models: list[OpenAIFoundationModel]\
          \ = get_foundation_models(\n                maas_client, search_space_raw.get(\"\
          foundation_model\", []), validate=False\n            )\n            embedding_models:\
          \ list[OpenAIEmbeddingModel] = get_embedding_models(\n                maas_client,\
          \ search_space_raw.get(\"embedding_model\", []), validate=False\n      \
          \      )\n\n            params: list[Parameter] = []\n            for param_name,\
          \ values in search_space_raw.items():\n                if param_name ==\
          \ \"foundation_model\":\n                    values = foundation_models\n\
          \                elif param_name == \"embedding_model\":\n             \
          \       values = embedding_models\n                params.append(Parameter(param_name,\
          \ \"C\", values=values))\n\n            search_space = AI4RAGSearchSpace(params=params)\n\
          \n            evaluators = _build_evaluators(\n                foundation_models=foundation_models,\n\
          \                embedding_models=embedding_models,\n                active_evaluators=active_evaluators,\n\
          \            )\n\n            # --- Configure experiment ---\n         \
          \   max_rag_patterns = settings.get(\"max_number_of_rag_patterns\", DEFAULT_MAX_RAG_PATTERNS)\n\
          \            if isinstance(max_rag_patterns, str):\n                max_rag_patterns\
          \ = int(max_rag_patterns.strip())\n            optimizer_settings = GAMOptSettings(max_evals=max_rag_patterns)\n\
          \n            run_logger.log_header(\n                pipeline_name=pipeline_name,\n\
          \                kfp_run_id=run_id,\n                kfp_run_name=run_name,\n\
          \                preset=preset,\n                optimization_metric=f\"\
          {optimization_metric.evaluator}:{optimization_metric.name}\",\n        \
          \        max_rag_patterns=max_rag_patterns,\n                active_evaluators=active_evaluators,\n\
          \                embedding_models=search_space_raw.get(\"embedding_model\"\
          , []),\n                generation_models=search_space_raw.get(\"foundation_model\"\
          , []),\n                test_data_key=test_data_key,\n                input_data_bucket_name=input_data_bucket_name,\n\
          \                input_data_keys=input_data_keys or [],\n            )\n\
          \n            # Wrapped so every evaluated pattern is mirrored into a nested\
