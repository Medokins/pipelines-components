# PIPELINE DEFINITION
# Name: documents-rag-optimization-pipeline
# Description: AutoRAG pipeline for building high-quality RAG applications from your documents with minimal configuration. Powered by ai4rag, it explores and optimizes retrieval and generation design choices against your quality goals. Delivers ranked, production-ready patterns, deployment-ready settings, and a leaderboard of the best configurations.
# Inputs:
#    embedding_models: list
#    generation_models: list
#    input_data_bucket_name: str
#    input_data_keys: list [Default: []]
#    input_data_secret_name: str
#    log_evaluation_artifacts: bool [Default: False]
#    maas_secret_name: str
#    optimization_max_rag_patterns: int [Default: 8.0]
#    optimization_metric: str [Default: 'overall_score']
#    preset: str [Default: 'speed']
#    test_data_bucket_name: str
#    test_data_key: str
#    test_data_secret_name: str
#    vector_db_secret_name: str
components:
  comp-documents-discovery:
    executorLabel: exec-documents-discovery
    inputDefinitions:
      parameters:
        benchmark_sample_size:
          defaultValue: 25.0
          description: 'Maximum number of benchmark records to keep.

            When the dataset exceeds this limit, a reproducible random sample is

            drawn (seed 42). Set to 0 to disable sampling.'
          isOptional: true
          parameterType: NUMBER_INTEGER
        input_data_bucket_name:
          description: S3 (or compatible) bucket containing input documents.
          parameterType: STRING
        input_data_keys:
          defaultValue: []
          description: 'Paths to folders with input documents within the bucket.  Only
            the

            first entry is used; the remaining ones are ignored until multi-folder
            discovery

            is supported.  Leave empty to discover the whole bucket.'
          isOptional: true
          parameterType: LIST
        sampling_enabled:
          defaultValue: true
          description: Whether to enable document size-based sampling.
          isOptional: true
          parameterType: BOOLEAN
        sampling_max_size:
          defaultValue: 1.0
          description: Maximum size of sampled documents (in gigabytes).
          isOptional: true
          parameterType: NUMBER_DOUBLE
        test_data_bucket_name:
          defaultValue: ''
          description: 'S3 bucket containing the test data file.  Leave empty

            to skip test data loading (e.g. for the indexing pipeline).'
          isOptional: true
          parameterType: STRING
        test_data_path_key:
          defaultValue: ''
          description: S3 object key to the JSON test data file.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        discovered_documents:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-models-pre-selector:
    executorLabel: exec-models-pre-selector
    inputDefinitions:
      artifacts:
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact with extracted text documents. Only read

            when pre-selection actually runs.'
        search_space_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact with the full search space report

            produced by ``search_space_preparation``.'
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact with benchmark questions and expected answers.

            Only read when pre-selection actually runs.'
      parameters:
        preset:
          defaultValue: speed
          description: 'Pipeline quality tier. "speed" (default) uses 10 benchmark
            query

            threads during pre-selection; "balanced" uses 4 (reduced due to

            larger per-request context).'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        search_space_mps_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-publish-component-stage-map:
    executorLabel: exec-publish-component-stage-map
    inputDefinitions:
      parameters:
        pipeline_id:
          description: 'Pipeline identifier matching the template filename

            (e.g. ``documents-rag-optimization-pipeline``).'
          parameterType: STRING
        run_id:
          description: KFP run ID for tracking (from ``dsl.PIPELINE_JOB_ID_PLACEHOLDER``).
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_stage_map:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-rag-templates-optimization:
    executorLabel: exec-rag-templates-optimization
    inputDefinitions:
      artifacts:
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Path to extracted text documents.
        search_space_mps_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Path to the JSON search space report.
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Path to benchmark test data JSON.
      parameters:
        input_data_bucket_name:
          description: S3 bucket containing input documents.
          parameterType: STRING
        input_data_keys:
          description: 'Paths to documents dirs within bucket. Only the first entry
            is

            used for the generated indexing notebook; the full list is propagated
            to the

            indexing pipeline blueprint.'
          isOptional: true
          parameterType: LIST
        input_data_secret_name:
          description: 'Name of the K8s secret with S3 credentials for

            input data.'
          parameterType: STRING
        log_evaluation_artifacts:
          defaultValue: false
          description: 'Upload each pattern''s per-question evaluation

            records to its MLflow child run. Off by default: those records contain

            verbatim questions, generated answers, and retrieved chunk text from the

            source documents, which may be sensitive. Aggregate scores are always

            logged as metrics regardless of this flag.'
          isOptional: true
          parameterType: BOOLEAN
        maas_secret_name:
          description: 'Name of the K8s secret with MaaS inference credentials

            ("MAAS_BASE_URL", "MAAS_API_KEY"). Propagated into each generated

            ``pattern.json`` indexing spec for downstream deployment.'
          parameterType: STRING
        optimization_settings:
          description: Additional experiment settings.
          isOptional: true
          parameterType: STRUCT
        pipeline_name:
          defaultValue: ''
          description: Pipeline identifier, logged to MLflow as a param and tag.
          isOptional: true
          parameterType: STRING
        preset:
          defaultValue: speed
          description: 'Pipeline quality tier. "speed" (default) uses 10 benchmark
            query

            threads. "balanced" uses 4 threads (reduced due to larger per-request

            context).'
          isOptional: true
          parameterType: STRING
        run_id:
          defaultValue: ''
          description: KFP run ID (``dsl.PIPELINE_JOB_ID_PLACEHOLDER``), logged to
            MLflow.
          isOptional: true
          parameterType: STRING
        run_name:
          defaultValue: ''
          description: 'KFP run name (``dsl.PIPELINE_JOB_NAME_PLACEHOLDER``). Logged
            to

            MLflow, and used to name the fallback experiment/run when the platform

            supplies no parent run.'
          isOptional: true
          parameterType: STRING
        test_data_key:
          description: Path to benchmark JSON in object storage.
          parameterType: STRING
        vector_db_secret_name:
          description: 'Name of the K8s secret holding the vector database

            configuration. Its keys select the backend: ``MILVUS_*`` keys use

            Milvus, ``PGVECTOR_*`` keys use PGVector. Propagated into each

            generated ``pattern.json`` indexing spec.'
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        leaderboard:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        rag_patterns:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-search-space-preparation:
    executorLabel: exec-search-space-preparation
    inputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact with benchmark questions and expected answers.

            Used for language detection during search-space preparation.'
      parameters:
        embedding_models:
          description: List of embedding model identifiers to try.
          parameterType: LIST
        generation_models:
          description: List of generation model identifiers to try.
          parameterType: LIST
        preset:
          defaultValue: speed
          description: 'Pipeline quality tier. "speed" (default) uses recursive chunking

            without contextual enrichment. "balanced" uses hybrid chunking with

            LLM contextual enrichment in the search space.'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        search_space_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        detected_ocr_lang:
          description: 'ISO 639-1 code of the language AutoRAG detected from the

            benchmark questions, or an empty string when detection did not run or

            failed. Intended as the ``ocr_lang`` input of text extraction.'
          parameterType: STRING
  comp-text-extraction:
    executorLabel: exec-text-extraction
    inputDefinitions:
      artifacts:
        documents_descriptor:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: 'Input artifact containing

            documents_descriptor.json with bucket, prefix, and documents list.

            Each document entry''s ``key`` also names the extracted document,

            so the prefix is not passed on separately.'
      parameters:
        error_tolerance:
          description: 'Fraction of documents (0.0-1.0) allowed to fail without

            raising an error. None (the default) means zero tolerance.'
          isOptional: true
          parameterType: NUMBER_DOUBLE
        max_extraction_workers:
          description: 'Number of parallel worker processes used for text

            extraction. Defaults to 4. Set to None to use all available CPU cores.'
          isOptional: true
          parameterType: NUMBER_INTEGER
        ocr_lang:
          description: 'Language of the document text, used only to pick the RapidOCR
            model

            bundle. Accepts a language name or ISO 639-1 code. Chinese ("chinese",
            "zh",

            "ch") selects the Chinese bundle; everything else, including None (the

            default), selects the English bundle, which covers all Latin-script

            languages. In the optimization pipeline this is filled from the language

            AutoRAG detects; for the indexing pipeline pass ``pattern.json``

            ``settings.generation.language.code``.'
          isOptional: true
          parameterType: STRING
        preset:
          defaultValue: speed
          description: 'Pipeline quality tier. "speed" (default) disables Docling
            table

            structure parsing. "balanced" enables TableFormer table reconstruction.'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        extracted_text:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-documents-discovery:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - documents_discovery
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef documents_discovery(\n    input_data_bucket_name:\
          \ str,\n    input_data_keys: list[str] = [],\n    test_data_bucket_name:\
          \ str = \"\",\n    test_data_path_key: str = \"\",\n    benchmark_sample_size:\
          \ int = 25,\n    sampling_enabled: bool = True,\n    sampling_max_size:\
          \ float = 1,\n    discovered_documents: dsl.Output[dsl.Artifact] = None,\n\
          \    test_data: dsl.Output[dsl.Artifact] = None,\n    component_status:\
          \ dsl.Output[dsl.Artifact] = None,\n    embedded_artifact: dsl.EmbeddedInput[dsl.Dataset]\
          \ = None,\n):\n    \"\"\"Documents discovery component with optional benchmark\
          \ test data loading.\n\n    Discovers input documents in S3 and optionally\
          \ downloads benchmark test data\n    for document-prioritised sampling.\
          \  When ``test_data_bucket_name`` is provided,\n    the component first\
          \ downloads and samples the benchmark JSON, then uses the\n    referenced\
          \ document IDs to prioritise discovery.\n\n    Args:\n        input_data_bucket_name:\
          \ S3 (or compatible) bucket containing input documents.\n        input_data_keys:\
          \ Paths to folders with input documents within the bucket.  Only the\n \
          \           first entry is used; the remaining ones are ignored until multi-folder\
          \ discovery\n            is supported.  Leave empty to discover the whole\
          \ bucket.\n        test_data_bucket_name: S3 bucket containing the test\
          \ data file.  Leave empty\n            to skip test data loading (e.g. for\
          \ the indexing pipeline).\n        test_data_path_key: S3 object key to\
          \ the JSON test data file.\n        benchmark_sample_size: Maximum number\
          \ of benchmark records to keep.\n            When the dataset exceeds this\
          \ limit, a reproducible random sample is\n            drawn (seed 42). Set\
          \ to 0 to disable sampling.\n        sampling_enabled: Whether to enable\
          \ document size-based sampling.\n        sampling_max_size: Maximum size\
          \ of sampled documents (in gigabytes).\n        discovered_documents: Output\
          \ artifact containing the documents descriptor JSON file.\n        test_data:\
          \ Output artifact containing the (possibly sampled) test data JSON.\n  \
          \          Empty when test data loading is skipped.\n        component_status:\
          \ Output artifact containing stage-level progress tracking.\n        embedded_artifact:\
          \ Embedded ``autorag.shared`` helpers injected by KFP at runtime.\n\n  \
          \  Environment variables (required when run with pipeline secret injection):\n\
          \        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT for input\
          \ documents\n        (or INPUT_DATA_AWS_* prefixed variants when both secrets\
          \ are injected).\n        TEST_DATA_AWS_ACCESS_KEY_ID, TEST_DATA_AWS_SECRET_ACCESS_KEY,\n\
          \        TEST_DATA_AWS_S3_ENDPOINT for test data (only when test_data_bucket_name\
          \ is set).\n        AWS_DEFAULT_REGION / *_DEFAULT_REGION variants are optional.\n\
          \    \"\"\"\n    import importlib.util\n    import json\n    import logging\n\
          \    import os\n    from pathlib import Path\n\n    from ai4rag.utils.clients.s3\
          \ import create_s3_client\n    from ai4rag.utils.data import discover_documents\n\
          \n    logging.basicConfig(level=logging.INFO)\n\n    if component_status\
          \ is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _embedded_path = Path(embedded_artifact.path)\n        _module_path\
          \ = _embedded_path if _embedded_path.is_file() else _embedded_path / \"\
          component_status.py\"\n        _spec = importlib.util.spec_from_file_location(\"\
          _autorag_component_status\", _module_path)\n        if _spec is None or\
          \ _spec.loader is None:\n            raise ValueError(f\"Cannot load embedded\
          \ module from {_module_path}\")\n        _status_module = importlib.util.module_from_spec(_spec)\n\
          \        _spec.loader.exec_module(_status_module)\n        status = _status_module.bootstrap_status_tracker(embedded_artifact,\
          \ component_status, \"documents_discovery\")\n    with status:\n       \
          \ if component_status is not None:\n            status.set_metadata(display_name=\"\
          Documents Discovery Status\")\n            component_status.metadata[\"\
          display_name\"] = \"Documents Discovery Status\"\n\n        test_data_doc_names\
          \ = None\n        load_benchmark = bool(test_data_bucket_name and test_data_path_key)\n\
          \n        if load_benchmark:\n            from ai4rag.utils.data import\
          \ load_test_data\n\n            with status.stage(\"load_benchmark\"):\n\
          \                test_data_s3_client = create_s3_client(\n             \
          \       endpoint_url=os.environ.get(\"TEST_DATA_AWS_S3_ENDPOINT\"),\n  \
          \                  access_key_id=os.environ.get(\"TEST_DATA_AWS_ACCESS_KEY_ID\"\
          ),\n                    secret_access_key=os.environ.get(\"TEST_DATA_AWS_SECRET_ACCESS_KEY\"\
          ),\n                    region_name=os.environ.get(\"TEST_DATA_AWS_DEFAULT_REGION\"\
          ),\n                )\n\n                test_data_result = load_test_data(\n\
          \                    bucket_name=test_data_bucket_name,\n              \
          \      key=test_data_path_key,\n                    benchmark_sample_size=benchmark_sample_size,\n\
          \                    s3_client=test_data_s3_client,\n                )\n\
          \n                with open(test_data.path, \"w\", encoding=\"utf-8\") as\
          \ f:\n                    json.dump(test_data_result.data, f, indent=2,\
          \ ensure_ascii=False)\n\n                test_data_doc_names = list(\n \
          \                   {doc_key for r in test_data_result.data for doc_key\
          \ in r.get(\"correct_answer_document_keys\", [])}\n                )\n\n\
          \        with status.stage(\"discover_documents\"):\n            input_endpoint\
          \ = os.environ.get(\"INPUT_DATA_AWS_S3_ENDPOINT\")\n            if input_endpoint:\n\
          \                input_s3_client = create_s3_client(\n                 \
          \   endpoint_url=input_endpoint,\n                    access_key_id=os.environ.get(\"\
          INPUT_DATA_AWS_ACCESS_KEY_ID\"),\n                    secret_access_key=os.environ.get(\"\
          INPUT_DATA_AWS_SECRET_ACCESS_KEY\"),\n                    region_name=os.environ.get(\"\
          INPUT_DATA_AWS_DEFAULT_REGION\"),\n                )\n            else:\n\
          \                input_s3_client = create_s3_client()\n\n            # Discovery\
          \ accepts a single prefix, so only the first key is honoured.\n        \
          \    input_data_prefix = input_data_keys[0] if input_data_keys else \"\"\
          \n            if input_data_keys and len(input_data_keys) > 1:\n       \
          \         logging.warning(\n                    \"Received %d input data\
          \ keys; only the first one (%s) is used for discovery.\",\n            \
          \        len(input_data_keys),\n                    input_data_prefix,\n\
          \                )\n\n            result = discover_documents(\n       \
          \         bucket_name=input_data_bucket_name,\n                prefix=input_data_prefix,\n\
          \                test_data_doc_names=test_data_doc_names,\n            \
          \    sampling_enabled=sampling_enabled,\n                sampling_max_size_gb=sampling_max_size,\n\
          \                s3_client=input_s3_client,\n            )\n\n         \
          \   output_dir = Path(discovered_documents.path)\n            output_dir.mkdir(parents=True,\
          \ exist_ok=True)\n            result.save(path=output_dir, filename=\"documents_descriptor.json\"\
          )\n\n"
        image: quay.io/nszwast/autorag-dev:dev1
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
    exec-models-pre-selector:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - models_pre_selector
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef models_pre_selector(\n    search_space_report:\
          \ dsl.Input[dsl.Artifact],\n    extracted_text: dsl.Input[dsl.Artifact],\n\
          \    test_data: dsl.Input[dsl.Artifact],\n    search_space_mps_report: dsl.Output[dsl.Artifact],\n\
          \    embedded_artifact: dsl.EmbeddedInput[dsl.Dataset] = None,\n    component_status:\
          \ dsl.Output[dsl.Artifact] = None,\n    preset: str = \"speed\",\n):\n \
          \   \"\"\"Model pre-selection for AutoRAG experiments.\n\n    Trims the\
          \ candidate model set when the search space carries more models than\n \
          \   the optimizer should explore. This component **always runs** and decides\n\
          \    internally: when the report holds more than ``DEFAULT_N_FOUNDATION_MODELS``\n\
          \    foundation models or more than ``DEFAULT_N_EMBEDDING_MODELS`` embedding\n\
          \    models, it runs ``ai4rag.core.experiment.mps.ModelsPreSelector`` over\
          \ a\n    benchmark sample and writes a *limited* report; otherwise it passes\
          \ the full\n    report through unchanged (a cheap copy \u2014 no MaaS calls,\
          \ no document loading).\n\n    Running as a distinct step keeps the (potentially\
          \ expensive) pre-selection\n    evaluation observable in the pipeline and\
          \ produces the reduced search-space\n    report consumed by ``rag_templates_optimization``.\n\
          \n    Args:\n        search_space_report: Input artifact with the full search\
          \ space report\n            produced by ``search_space_preparation``.\n\
          \        extracted_text: Input artifact with extracted text documents. Only\
          \ read\n            when pre-selection actually runs.\n        test_data:\
          \ Input artifact with benchmark questions and expected answers.\n      \
          \      Only read when pre-selection actually runs.\n        search_space_mps_report:\
          \ Output artifact for the (possibly reduced) JSON\n            search space\
          \ report.\n        embedded_artifact: Embedded ``autorag.shared`` helpers\
          \ injected by KFP at runtime.\n        component_status: Output artifact\
          \ containing stage-level progress tracking.\n        preset: Pipeline quality\
          \ tier. \"speed\" (default) uses 10 benchmark query\n            threads\
          \ during pre-selection; \"balanced\" uses 4 (reduced due to\n          \
          \  larger per-request context).\n\n    Environment variables (required only\
          \ when pre-selection runs):\n        MAAS_BASE_URL, MAAS_API_KEY.\n    \"\
          \"\"\n    import importlib.util\n    import json\n    import logging\n \
