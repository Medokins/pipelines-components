          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef search_space_preparation(\n    test_data:\
          \ dsl.Input[dsl.Artifact],\n    search_space_report: dsl.Output[dsl.Artifact],\n\
          \    embedding_models: List[str],\n    generation_models: List[str],\n \
          \   embedded_artifact: dsl.EmbeddedInput[dsl.Dataset] = None,\n    component_status:\
          \ dsl.Output[dsl.Artifact] = None,\n    preset: str = \"speed\",\n) -> NamedTuple(\"\
          SearchSpacePreparationOutputs\", [(\"detected_ocr_lang\", str)]):\n    \"\
          \"\"Search space preparation and validation for AutoRAG experiments.\n\n\
          \    Resolves and validates the requested MaaS models, builds the AutoRAG\
          \ search\n    space, and writes it as a JSON report. This step runs *before*\
          \ text\n    extraction so that unresponsive or misconfigured models fail\
          \ the experiment\n    fast, before any heavy document processing is performed.\n\
          \n    It also surfaces the language AutoRAG detects from the benchmark questions,\
          \ so\n    text extraction can pick the matching OCR model bundle.\n\n  \
          \  Args:\n        test_data: Input artifact with benchmark questions and\
          \ expected answers.\n            Used for language detection during search-space\
          \ preparation.\n        search_space_report: Output artifact for the JSON\
          \ search space report.\n        embedding_models: List of embedding model\
          \ identifiers to try.\n        generation_models: List of generation model\
          \ identifiers to try.\n        embedded_artifact: Embedded ``autorag.shared``\
          \ helpers injected by KFP at runtime.\n        component_status: Output\
          \ artifact containing stage-level progress tracking.\n        preset: Pipeline\
          \ quality tier. \"speed\" (default) uses recursive chunking\n          \
          \  without contextual enrichment. \"balanced\" uses hybrid chunking with\n\
          \            LLM contextual enrichment in the search space.\n\n    Returns:\n\
          \        detected_ocr_lang: ISO 639-1 code of the language AutoRAG detected\
          \ from the\n            benchmark questions, or an empty string when detection\
          \ did not run or\n            failed. Intended as the ``ocr_lang`` input\
          \ of text extraction.\n\n    Environment variables (required):\n       \
          \ MAAS_BASE_URL, MAAS_API_KEY.\n    \"\"\"\n    import importlib.util\n\
          \    import logging\n    import os\n    from collections import namedtuple\n\
          \    from pathlib import Path\n\n    import pandas as pd\n    from ai4rag.search_space.prepare\
          \ import build_search_space_report, prepare_search_space_with_maas\n   \
          \ from ai4rag.utils.clients import create_maas_client\n\n    logging.basicConfig(level=logging.INFO)\n\
          \n    VALID_PRESETS = {\"speed\", \"balanced\"}\n    PRESET_CHUNKING_METHODS\
          \ = {\"speed\": [\"recursive\"], \"balanced\": [\"recursive\", \"hybrid\"\
          ]}\n    PRESET_CHUNK_SIZES = {\"speed\": [128, 256, 512], \"balanced\":\
          \ [512, 1024, 2048]}\n    PRESET_CHUNK_OVERLAPS = {\"speed\": [32, 64],\
          \ \"balanced\": [0, 128, 256]}\n\n    if preset not in VALID_PRESETS:\n\
          \        raise ValueError(f\"preset must be one of {VALID_PRESETS}; got\
          \ {preset!r}.\")\n\n    for name, models in ((\"generation_models\", generation_models),\
          \ (\"embedding_models\", embedding_models)):\n        if not isinstance(models,\
          \ list) or not models or any(not m for m in models):\n            raise\
          \ ValueError(f\"{name} must be a non-empty list of non-empty model identifiers.\"\
          )\n\n    chunking_methods = PRESET_CHUNKING_METHODS[preset]\n    chunk_sizes\
          \ = PRESET_CHUNK_SIZES[preset]\n    chunk_overlaps = PRESET_CHUNK_OVERLAPS[preset]\n\
          \n    logging.info(\n        \"Preset %r: chunking_methods=%s, chunk_sizes=%s,\
          \ chunk_overlaps=%s\",\n        preset,\n        chunking_methods,\n   \
          \     chunk_sizes,\n        chunk_overlaps,\n    )\n\n    if component_status\
          \ is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _embedded_path = Path(embedded_artifact.path)\n        _module_path\
          \ = _embedded_path if _embedded_path.is_file() else _embedded_path / \"\
          component_status.py\"\n        _spec = importlib.util.spec_from_file_location(\"\
          _autorag_component_status\", _module_path)\n        if _spec is None or\
          \ _spec.loader is None:\n            raise ValueError(f\"Cannot load embedded\
          \ module from {_module_path}\")\n        _status_module = importlib.util.module_from_spec(_spec)\n\
          \        _spec.loader.exec_module(_status_module)\n        status = _status_module.bootstrap_status_tracker(\n\
          \            embedded_artifact, component_status, \"search_space_preparation\"\
          \n        )\n    with status:\n        if component_status is not None:\n\
          \            status.set_metadata(display_name=\"Search Space Preparation\
          \ Status\")\n            component_status.metadata[\"display_name\"] = \"\
          Search Space Preparation Status\"\n        with status.stage(\"prepare_search_space\"\
          ):\n            maas_client = create_maas_client(\n                base_url=os.environ[\"\
          MAAS_BASE_URL\"],\n                api_key=os.environ[\"MAAS_API_KEY\"],\n\
          \            )\n\n            payload = {\n                \"foundation_models\"\
          : [{\"model_id\": gm} for gm in generation_models],\n                \"\
          embedding_models\": [{\"model_id\": em} for em in embedding_models],\n \
          \               \"chunking_methods\": chunking_methods,\n              \
          \  \"chunk_sizes\": chunk_sizes,\n                \"chunk_overlaps\": chunk_overlaps,\n\
          \            }\n\n            benchmark_df = pd.read_json(test_data.path)\n\
          \n            search_space = prepare_search_space_with_maas(\n         \
          \       payload,\n                client=maas_client,\n                benchmark_data=benchmark_df,\n\
          \            )\n\n            build_search_space_report(search_space).save_json(search_space_report.path)\n\
          \n            # ai4rag detects the language per foundation model from the\
          \ same benchmark\n            # questions, so the values normally agree;\
          \ pick the first and warn otherwise.\n            detected_codes = []\n\
          \            for model in search_space[\"foundation_model\"].values:\n \
          \               code = getattr(getattr(model, \"language\", None), \"code\"\
          , \"\")\n                # Normalize before the emptiness check: a whitespace-only\
          \ code is\n                # truthy but normalizes to \"\", which would\
          \ sort ahead of a real\n                # code below and silently downgrade\
          \ detection to English.\n                normalized = code.strip().lower()\
          \ if code else \"\"\n                if normalized:\n                  \
          \  detected_codes.append(normalized)\n\n            distinct_codes = sorted(set(detected_codes))\n\
          \            if len(distinct_codes) > 1:\n                logging.warning(\n\
          \                    \"Foundation models disagree on the detected language\
          \ (%s); using %r.\",\n                    \", \".join(distinct_codes),\n\
          \                    distinct_codes[0],\n                )\n           \
          \ detected_ocr_lang = distinct_codes[0] if distinct_codes else \"\"\n  \
          \          logging.info(\"Detected language for OCR: %r\", detected_ocr_lang)\n\
          \n    outputs = namedtuple(\"SearchSpacePreparationOutputs\", [\"detected_ocr_lang\"\
          ])\n    return outputs(detected_ocr_lang)\n\n"
        image: quay.io/nszwast/autorag-dev:dev1
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
    exec-text-extraction:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - text_extraction
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n__KFP_EMBEDDED_ASSET_FILE = __kfp_os.path.join(__KFP_EMBEDDED_ASSET_DIR,\
          \ 'component_status.py')\n\n\n\n\ndef text_extraction(\n    documents_descriptor:\
          \ dsl.Input[dsl.Artifact],\n    extracted_text: dsl.Output[dsl.Artifact],\n\
          \    component_status: dsl.Output[dsl.Artifact] = None,\n    embedded_artifact:\
          \ dsl.EmbeddedInput[dsl.Dataset] = None,\n    error_tolerance: Optional[float]\
          \ = None,\n    max_extraction_workers: Optional[int] = None,\n    preset:\
          \ str = \"speed\",\n    ocr_lang: Optional[str] = None,\n):\n    \"\"\"\
          Text Extraction component.\n\n    Thin wrapper that delegates to ``ai4rag.utils.data.text_extraction.extract_text``.\n\
          \n    OCR is always enabled. Docling runs RapidOCR only on pages it flags\
          \ as needing it,\n    so pages carrying a text layer are read directly and\
          \ scanned or image-only pages are\n    OCR'd.\n\n    The four RapidOCR model\
          \ paths are pinned explicitly from ``$DOCLING_ARTIFACTS_PATH``\n    rather\
          \ than left to Docling. Docling resolves an unpinned language to PP-OCRv6\
          \ and\n    looks for flat filenames directly under ``RapidOcr/``, but the\
          \ AutoRAG image ships the\n    PP-OCRv4 bundle in its nested ``RapidOcr/onnx/PP-OCRv4/...``\
          \ layout, so leaving the\n    paths unset fails with ``FileNotFoundError``\
          \ at conversion time. Pinning them makes\n    Docling skip resolution and\
          \ use the models that are actually present.\n\n    Args:\n        documents_descriptor:\
          \ Input artifact containing\n            documents_descriptor.json with\
          \ bucket, prefix, and documents list.\n            Each document entry's\
          \ ``key`` also names the extracted document,\n            so the prefix\
          \ is not passed on separately.\n        extracted_text: Output artifact\
          \ directory where DoclingDocument JSON files\n            will be written.\n\
          \        component_status: Output artifact containing stage-level progress\
          \ tracking.\n        embedded_artifact: Embedded ``autorag.shared`` helpers\
          \ injected by KFP at runtime.\n        error_tolerance: Fraction of documents\
          \ (0.0-1.0) allowed to fail without\n            raising an error. None\
          \ (the default) means zero tolerance.\n        max_extraction_workers: Number\
          \ of parallel worker processes used for text\n            extraction. Defaults\
          \ to 4. Set to None to use all available CPU cores.\n        preset: Pipeline\
          \ quality tier. \"speed\" (default) disables Docling table\n           \
          \ structure parsing. \"balanced\" enables TableFormer table reconstruction.\n\
          \        ocr_lang: Language of the document text, used only to pick the\
          \ RapidOCR model\n            bundle. Accepts a language name or ISO 639-1\
          \ code. Chinese (\"chinese\", \"zh\",\n            \"ch\") selects the Chinese\
          \ bundle; everything else, including None (the\n            default), selects\
          \ the English bundle, which covers all Latin-script\n            languages.\
          \ In the optimization pipeline this is filled from the language\n      \
          \      AutoRAG detects; for the indexing pipeline pass ``pattern.json``\n\
          \            ``settings.generation.language.code``.\n    \"\"\"\n    import\
          \ importlib.util\n    import json\n    import logging\n    import os\n \
          \   from pathlib import Path\n\n    from ai4rag.utils.data.text_extraction\
          \ import DoclingExtractionConfig, extract_text\n\n    logging.basicConfig(level=logging.INFO)\n\
          \n    VALID_PRESETS = {\"speed\", \"balanced\"}\n    PRESET_DO_TABLE_STRUCTURE\
          \ = {\"speed\": False, \"balanced\": True}\n\n    if preset not in VALID_PRESETS:\n\
          \        raise ValueError(f\"preset must be one of {VALID_PRESETS}; got\
          \ {preset!r}.\")\n\n    do_table_structure = PRESET_DO_TABLE_STRUCTURE[preset]\n\
          \    logging.info(\"Preset %r: do_table_structure=%s\", preset, do_table_structure)\n\
          \n    # Paths are relative to $DOCLING_ARTIFACTS_PATH/RapidOcr/ and mirror\
          \ the on-disk\n    # layout of the RHAI OGX modelcar baked into the AutoRAG\
          \ image. The classifier is\n    # script-agnostic, so both bundles share\
          \ it.\n    RAPIDOCR_BUNDLES = {\n        \"english\": {\n            \"\
          ocr_det_model_path\": \"onnx/PP-OCRv4/det/en_PP-OCRv3_det_mobile.onnx\"\
          ,\n            \"ocr_cls_model_path\": \"onnx/PP-OCRv4/cls/ch_ppocr_mobile_v2.0_cls_mobile.onnx\"\
          ,\n            \"ocr_rec_model_path\": \"onnx/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile.onnx\"\
          ,\n            \"ocr_rec_keys_path\": \"paddle/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile/en_dict.txt\"\
          ,\n        },\n        \"chinese\": {\n            \"ocr_det_model_path\"\
          : \"onnx/PP-OCRv4/det/ch_PP-OCRv4_det_mobile.onnx\",\n            \"ocr_cls_model_path\"\
          : \"onnx/PP-OCRv4/cls/ch_ppocr_mobile_v2.0_cls_mobile.onnx\",\n        \
          \    \"ocr_rec_model_path\": \"onnx/PP-OCRv4/rec/ch_PP-OCRv4_rec_mobile.onnx\"\
          ,\n            \"ocr_rec_keys_path\": \"paddle/PP-OCRv4/rec/ch_PP-OCRv4_rec_mobile/ppocr_keys_v1.txt\"\
          ,\n        },\n    }\n    CHINESE_ALIASES = {\"chinese\", \"ch\", \"zh\"\
          , \"zho\", \"chi\", \"zh-cn\", \"zh-tw\"}\n\n    # Only Chinese has a dedicated\
          \ bundle; every other language, detected or not, is\n    # served by the\
          \ English models, which cover all Latin scripts. Anything unrecognised\n\
          \    # therefore degrades to English rather than failing the run.\n    bundle_name\
          \ = \"chinese\" if (ocr_lang or \"\").strip().lower() in CHINESE_ALIASES\
          \ else \"english\"\n    logging.info(\"OCR language %r resolved to the %s\
          \ RapidOCR bundle\", ocr_lang, bundle_name)\n\n    ocr_model_paths = {}\n\
          \    docling_artifacts_path = os.environ.get(\"DOCLING_ARTIFACTS_PATH\"\
          )\n    if docling_artifacts_path:\n        ocr_root = Path(docling_artifacts_path)\
          \ / \"RapidOcr\"\n        resolved = {key: ocr_root / rel for key, rel in\
          \ RAPIDOCR_BUNDLES[bundle_name].items()}\n        missing = sorted(str(path)\
          \ for path in resolved.values() if not path.is_file())\n        if missing:\n\
          \            raise FileNotFoundError(\n                f\"RapidOCR {bundle_name}\
          \ models are missing under {ocr_root}:\\n  - \" + \"\\n  - \".join(missing)\n\
          \            )\n        ocr_model_paths = {key: str(path) for key, path\
          \ in resolved.items()}\n    else:\n        # No baked-in artifacts (e.g.\
          \ a dev image): let ai4rag and Docling resolve and\n        # download the\
          \ models themselves.\n        logging.warning(\"DOCLING_ARTIFACTS_PATH is\
          \ unset; RapidOCR models will be resolved at runtime.\")\n\n    if component_status\
          \ is None:\n        from kfp_components.components.training.autorag.shared.component_status\
          \ import (  # pyright: ignore[reportMissingImports]\n            null_component_status_tracker,\n\
          \        )\n\n        status = null_component_status_tracker()\n    else:\n\
          \        _embedded_path = Path(embedded_artifact.path)\n        _module_path\
          \ = _embedded_path if _embedded_path.is_file() else _embedded_path / \"\
          component_status.py\"\n        _spec = importlib.util.spec_from_file_location(\"\
          _autorag_component_status\", _module_path)\n        if _spec is None or\
          \ _spec.loader is None:\n            raise ValueError(f\"Cannot load embedded\
          \ module from {_module_path}\")\n        _status_module = importlib.util.module_from_spec(_spec)\n\
          \        _spec.loader.exec_module(_status_module)\n        status = _status_module.bootstrap_status_tracker(embedded_artifact,\
          \ component_status, \"text_extraction\")\n    with status:\n        if component_status\
          \ is not None:\n            status.set_metadata(display_name=\"Text Extraction\
          \ Status\")\n            component_status.metadata[\"display_name\"] = \"\
          Text Extraction Status\"\n        with status.stage(\"extract_documents\"\
          ):\n            descriptor_path = Path(documents_descriptor.path) / \"documents_descriptor.json\"\
          \n            with open(descriptor_path, \"r\", encoding=\"utf-8\") as f:\n\
          \                descriptor = json.load(f)\n\n            output_dir = Path(extracted_text.path)\n\
          \            output_dir.mkdir(parents=True, exist_ok=True)\n\n         \
          \   docling_config = DoclingExtractionConfig(\n                do_table_structure=do_table_structure,\n\
          \                do_ocr=True,\n                ocr_lang=bundle_name,\n \
          \               **ocr_model_paths,\n            )\n\n            extract_text(\n\
          \                documents=descriptor[\"documents\"],\n                bucket=descriptor[\"\
          bucket\"],\n                output_dir=output_dir,\n                s3_endpoint=os.environ.get(\"\
          AWS_S3_ENDPOINT\"),\n                s3_access_key=os.environ.get(\"AWS_ACCESS_KEY_ID\"\
          ),\n                s3_secret_key=os.environ.get(\"AWS_SECRET_ACCESS_KEY\"\
          ),\n                s3_region=os.environ.get(\"AWS_DEFAULT_REGION\"),\n\
          \                error_tolerance=error_tolerance,\n                max_extraction_workers=max_extraction_workers,\n\
          \                docling_artifacts_path=os.environ.get(\"DOCLING_ARTIFACTS_PATH\"\
          ),\n                docling_config=docling_config,\n            )\n\n"
        image: quay.io/nszwast/autorag-dev:dev1
        resources:
          cpuLimit: 32.0
          cpuRequest: 4.0
          memoryLimit: 68.719476736
          memoryRequest: 17.179869184
          resourceCpuLimit: '32'
          resourceCpuRequest: '4'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 16Gi
pipelineInfo:
  description: AutoRAG pipeline for building high-quality RAG applications from your
    documents with minimal configuration. Powered by ai4rag, it explores and optimizes
    retrieval and generation design choices against your quality goals. Delivers ranked,
    production-ready patterns, deployment-ready settings, and a leaderboard of the
    best configurations.
  name: documents-rag-optimization-pipeline
root:
  dag:
    tasks:
      documents-discovery:
        cachingOptions: {}
        componentRef:
          name: comp-documents-discovery
        dependentTasks:
        - publish-component-stage-map
        inputs:
          parameters:
            input_data_bucket_name:
              componentInputParameter: input_data_bucket_name
            input_data_keys:
              componentInputParameter: input_data_keys
            test_data_bucket_name:
              componentInputParameter: test_data_bucket_name
            test_data_path_key:
              componentInputParameter: test_data_key
        taskInfo:
          name: documents-discovery
      models-pre-selector:
        cachingOptions: {}
        componentRef:
          name: comp-models-pre-selector
        dependentTasks:
        - documents-discovery
        - search-space-preparation
        - text-extraction
        inputs:
          artifacts:
            extracted_text:
              taskOutputArtifact:
                outputArtifactKey: extracted_text
                producerTask: text-extraction
            search_space_report:
              taskOutputArtifact:
                outputArtifactKey: search_space_report
                producerTask: search-space-preparation
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: documents-discovery
          parameters:
            preset:
              componentInputParameter: preset
        taskInfo:
          name: models-pre-selector
      publish-component-stage-map:
        cachingOptions: {}
        componentRef:
          name: comp-publish-component-stage-map
        inputs:
          parameters:
            pipeline_id:
              runtimeValue:
                constant: documents-rag-optimization-pipeline
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: publish-component-stage-map
      rag-templates-optimization:
        cachingOptions: {}
        componentRef:
          name: comp-rag-templates-optimization
        dependentTasks:
        - documents-discovery
        - models-pre-selector
        - text-extraction
        inputs:
          artifacts:
            extracted_text:
              taskOutputArtifact:
                outputArtifactKey: extracted_text
                producerTask: text-extraction
            search_space_mps_report:
              taskOutputArtifact:
                outputArtifactKey: search_space_mps_report
                producerTask: models-pre-selector
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: documents-discovery
          parameters:
            input_data_bucket_name:
              componentInputParameter: input_data_bucket_name
            input_data_keys:
              componentInputParameter: input_data_keys
            input_data_secret_name:
              componentInputParameter: input_data_secret_name
            log_evaluation_artifacts:
              componentInputParameter: log_evaluation_artifacts
            maas_secret_name:
              componentInputParameter: maas_secret_name
            optimization_settings:
              runtimeValue:
                constant:
                  max_number_of_rag_patterns: '{{$.inputs.parameters[''pipelinechannel--optimization_max_rag_patterns'']}}'
                  metric: '{{$.inputs.parameters[''pipelinechannel--optimization_metric'']}}'
            pipeline_name:
              runtimeValue:
                constant: documents-rag-optimization-pipeline
            pipelinechannel--optimization_max_rag_patterns:
              componentInputParameter: optimization_max_rag_patterns
            pipelinechannel--optimization_metric:
              componentInputParameter: optimization_metric
            preset:
              componentInputParameter: preset
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            run_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            test_data_key:
              componentInputParameter: test_data_key
            vector_db_secret_name:
              componentInputParameter: vector_db_secret_name
        taskInfo:
          name: rag-templates-optimization
      search-space-preparation:
        cachingOptions: {}
        componentRef:
          name: comp-search-space-preparation
        dependentTasks:
        - documents-discovery
        inputs:
          artifacts:
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: documents-discovery
          parameters:
            embedding_models:
              componentInputParameter: embedding_models
            generation_models:
              componentInputParameter: generation_models
            preset:
              componentInputParameter: preset
        taskInfo:
          name: search-space-preparation
      text-extraction:
        cachingOptions: {}
        componentRef:
          name: comp-text-extraction
        dependentTasks:
        - documents-discovery
        - search-space-preparation
        inputs:
          artifacts:
            documents_descriptor:
              taskOutputArtifact:
                outputArtifactKey: discovered_documents
                producerTask: documents-discovery
          parameters:
            ocr_lang:
              taskOutputParameter:
                outputParameterKey: detected_ocr_lang
                producerTask: search-space-preparation
            preset:
              componentInputParameter: preset
        taskInfo:
          name: text-extraction
  inputDefinitions:
    parameters:
      embedding_models:
        description: 'List of embedding model identifiers to use in the search space.

          Required: MaaS exposes no metadata to distinguish model types, so embedding

          models can no longer be inferred and must be declared explicitly.'
        parameterType: LIST
      generation_models:
        description: 'List of foundation/generation model identifiers to use in the

          search space. Required: MaaS exposes no metadata to distinguish model types,
          so

          generation models can no longer be inferred and must be declared explicitly.'
        parameterType: LIST
      input_data_bucket_name:
        description: S3 (or compatible) bucket name for the input documents.
        parameterType: STRING
      input_data_keys:
        defaultValue: []
        description: 'Object keys (paths) of the input documents in the input data
          bucket.

          Only the first entry is used by document discovery.'
        isOptional: true
        parameterType: LIST
      input_data_secret_name:
        description: 'Name of the Kubernetes secret holding S3-compatible credentials

          for input document data access. The following environment variables are
          required:

          AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT.

          AWS_DEFAULT_REGION is optional.'
        parameterType: STRING
      log_evaluation_artifacts:
        defaultValue: false
        description: 'Upload each RAG pattern''s per-question evaluation

          records to its MLflow child run. Off by default: those records contain

          verbatim questions, generated answers, and retrieved chunk text from your

          source documents, which may be sensitive. Aggregate scores are always

          logged as metrics regardless of this flag. Has no effect when MLflow

          tracking is not enabled on the cluster.'
        isOptional: true
        parameterType: BOOLEAN
      maas_secret_name:
        description: 'Name of the Kubernetes secret for the MaaS inference connection.

          The secret must define: MAAS_BASE_URL, MAAS_API_KEY.'
        parameterType: STRING
      optimization_max_rag_patterns:
        defaultValue: 8.0
        description: 'Maximum number of RAG patterns to generate. Passed to ai4rag

          (max_number_of_rag_patterns). Defaults to 8.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      optimization_metric:
        defaultValue: overall_score
        description: 'Quality metric used to rank RAG patterns. Use an

          evaluator-qualified value such as ``"unitxt:faithfulness"``,

          ``"ragas:context_precision"``, or ``"custom:overall_score"`` (default).

          The ``speed`` preset supports Unitxt and custom metrics; ``balanced`` also

          supports RAGAS metrics. ``custom:overall_score`` aggregates Unitxt outputs

          for ``speed`` and Unitxt plus RAGAS outputs for ``balanced``.'
        isOptional: true
        parameterType: STRING
      preset:
        defaultValue: speed
        description: 'Pipeline quality tier. "speed" (default) uses recursive chunking,

          no table structure parsing, and no contextual enrichment. "balanced"

          enables Docling table layout parsing, hybrid chunking, and LLM

          contextual enrichment. Both presets use the same resource tier.'
        isOptional: true
        parameterType: STRING
      test_data_bucket_name:
        description: S3 (or compatible) bucket name for the test data file.
        parameterType: STRING
      test_data_key:
        description: Object key (path) of the test data JSON file in the test data
          bucket.
        parameterType: STRING
      test_data_secret_name:
        description: 'Name of the Kubernetes secret holding S3-compatible credentials
          for

          test data access. The following environment variables are required:

          AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT.

          AWS_DEFAULT_REGION is optional.'
        parameterType: STRING
      vector_db_secret_name:
