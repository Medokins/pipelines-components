          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef automl_data_loader(  # noqa: D417\n    file_key: str,\n    bucket_name:\
          \ str,\n    workspace_path: str,\n    label_column: str,\n    sampled_test_dataset:\
          \ dsl.Output[dsl.Dataset],\n    component_status: dsl.Output[dsl.Artifact],\n\
          \    sampling_method: Optional[str] = None,\n    task_type: str = \"regression\"\
          ,\n    split_config: Optional[dict] = None,\n    selection_train_size: float\
          \ = 0.3,\n) -> NamedTuple(\n    \"outputs\",\n    sample_config=dict,\n\
          \    split_config=dict,\n    sample_row=str,\n    models_selection_train_data_path=str,\n\
          \    extra_train_data_path=str,\n):\n    \"\"\"Automl Data Loader component.\n\
          \n    Loads tabular (CSV) data from S3 in batches, sampling up to 100 MB\
          \ of data,\n    then splits the sampled data into test, selection-train,\
          \ and extra-train sets.\n\n    The component reads data in chunks to efficiently\
          \ handle large files without\n    loading the entire dataset into memory\
          \ at once. After sampling, it performs\n    a two-stage split:\n\n    1.\
          \ **Primary split** (default 80/20): separates a *test set* (20%, written\
          \ to\n       the ``sampled_test_dataset`` S3 artifact) from the *train portion*\
          \ (80%).\n\n    2. **Secondary split** (default 30/70 of the train portion):\
          \ produces\n       ``models_selection_train_dataset.csv`` (30%, used for\
          \ model selection) and\n       ``extra_train_dataset.csv`` (70%, passed\
          \ to ``refit_full`` as extra data).\n       Both are written to the PVC\
          \ workspace under ``{workspace_path}/datasets/``.\n\n    For **regression**\
          \ tasks the split is random; for **binary** and **multiclass**\n    tasks\
          \ the split is **stratified** by the label column by default.\n\n    Rows\
          \ with a missing label (NaN / empty in ``label_column``) are dropped after\
          \ load\n    and before splitting, so regression runs do not propagate null\
          \ targets into splits\n    or the ``sample_row`` JSON (stratified sampling\
          \ already dropped per chunk; this\n    applies the same rule to random and\
          \ first-n-rows paths).\n\n    After cleansing (infinity replacement, duplicate\
          \ removal, and label drop), at least\n    **100** valid records must remain;\
          \ otherwise the component fails with a clear error\n    so downstream AutoML\
          \ training does not run on datasets too small to split reliably.\n\n   \
          \ After sampling, **+/- infinity** values in the frame are replaced with\
          \ **NaN** (same\n    idea as AutoAI ``loadXy``), then **full-row duplicates**\
          \ are dropped before the\n    label drop and train/test split.\n\n    Authentication\
          \ uses AWS-style credentials provided via environment variables\n    (e.g.\
          \ from a Kubernetes secret).\n\n    Args:\n        file_key: S3 object key\
          \ of the CSV file.\n        bucket_name: S3 bucket name containing the file.\n\
          \        workspace_path: PVC workspace directory where train CSVs will be\
          \ written.\n        label_column: Name of the label/target column in the\
          \ dataset.\n        sampled_test_dataset: Output dataset artifact for the\
          \ test split.\n        component_status: Output artifact containing stage-level\
          \ progress tracking for this component.\n        sampling_method: \"first_n_rows\"\
          , \"stratified\", or \"random\"; if None, derived from task_type.\n    \
          \    task_type: \"binary\", \"multiclass\", or \"regression\" (default);\
          \ used when sampling_method is None.\n        split_config: Split configuration\
          \ dictionary. Available keys: \"test_size\" (float), \"random_state\" (int),\
          \ \"stratify\" (bool).\n        selection_train_size: Fraction of the train\
          \ portion used for model selection (default 0.3).\n\n    Raises:\n     \
          \   ValueError: If sampling_method or task_type is invalid, if required\
          \ parameters are missing,\n            or if fewer than 100 valid records\
          \ remain after data cleansing.\n\n    Returns:\n        NamedTuple: Contains\
          \ sample config, split config, a sample row, and paths to selection-train\
          \ and extra-train CSVs.\n    \"\"\"  # noqa: E501\n    import io\n    import\
          \ logging\n    import math\n    import os\n\n    import boto3\n    import\
          \ pandas as pd\n\n    logger = logging.getLogger(__name__)\n\n    MAX_SIZE_BYTES\
          \ = 100 * 1024 * 1024  # 100 MB limit in bytes\n    MIN_VALID_RECORDS_AFTER_CLEANSING\
          \ = 100\n    PANDAS_CHUNK_SIZE = 10000  # Rows per batch for streaming read\n\
          \    DEFAULT_RANDOM_STATE = 42\n    VALID_SAMPLING_METHODS = {\"first_n_rows\"\
          , \"stratified\", \"random\"}\n    VALID_TASK_TYPES = {\"binary\", \"multiclass\"\
          , \"regression\"}\n\n    # Input validation\n    for param, value in (\n\
          \        (\"bucket_name\", bucket_name),\n        (\"file_key\", file_key),\n\
          \        (\"workspace_path\", workspace_path),\n        (\"label_column\"\
          , label_column),\n    ):\n        if not isinstance(value, str) or not value.strip():\n\
          \            raise TypeError(f\"{param} must be a non-empty string.\")\n\
          \n    if task_type not in VALID_TASK_TYPES:\n        raise ValueError(f\"\
          task_type must be one of {VALID_TASK_TYPES}; got {task_type!r}.\")\n   \
          \ if split_config is not None and not isinstance(split_config, dict):\n\
          \        raise TypeError(\"split_config must be a dictionary with possible\
          \ keys test_size, random_state, stratify.\")\n    if isinstance(split_config,\
          \ dict):\n        test_size = split_config.get(\"test_size\")\n        if\
          \ test_size is not None and (not isinstance(test_size, (int, float)) or\
          \ test_size <= 0 or test_size >= 1):\n            raise TypeError(\"split_config['test_size']\
          \ must be a number in (0, 1) when provided.\")\n        random_state = split_config.get(\"\
          random_state\")\n        if random_state is not None and (not isinstance(random_state,\
          \ int)):\n            raise TypeError(\"split_config['random_state'] must\
          \ be an integer when provided.\")\n        stratify = split_config.get(\"\
          stratify\")\n        if stratify is not None and not isinstance(stratify,\
          \ bool):\n            raise TypeError(\"split_config['stratify'] must be\
          \ a boolean when provided.\")\n    if not isinstance(selection_train_size,\
          \ (int, float)):\n        raise TypeError(\"selection_train_size must be\
          \ a numerical value.\")\n    elif selection_train_size <= 0 or selection_train_size\
          \ >= 1:\n        raise ValueError(\"selection_train_size must be in a range\
          \ 0 to 1.\")\n\n    from kfp_components.components.training.automl.shared.component_status\
          \ import ComponentStatusTracker\n\n    # Initialize status tracker\n   \
          \ status = ComponentStatusTracker(component_status.path, \"automl_data_loader\"\
          )\n    with status:\n        status.set_metadata(display_name=\"Data Loader\
          \ Status\")\n        component_status.metadata[\"display_name\"] = \"Data\
          \ Loader Status\"\n        status.record(\"prepare_data\", \"started\")\n\
          \n        if sampling_method is None:\n            if task_type in (\"binary\"\
          , \"multiclass\"):\n                sampling_method = \"stratified\"\n \
          \           else:\n                sampling_method = \"random\"\n      \
          \      logger.info(\"Sampling method derived from task_type=%s: using %s\"\
          , task_type, sampling_method)\n        else:\n            if sampling_method\
          \ not in VALID_SAMPLING_METHODS:\n                raise ValueError(\n  \
          \                  f\"sampling_method must be one of {VALID_SAMPLING_METHODS}\
          \ or None; got {sampling_method!r}.\"\n                )\n            if\
          \ sampling_method == \"stratified\" and task_type not in (\"binary\", \"\
          multiclass\"):\n                raise ValueError(\n                    \"\
          Stratified sampling is only available when task_type is \"\n           \
          \         \"'binary' or 'multiclass' (classification tasks). \"\n      \
          \              f\"Got task_type='{task_type}'.\"\n                )\n  \
          \          logger.info(\"Performing sampling: method=%s\", sampling_method)\n\
          \n        def get_s3_client(verify=True):\n            \"\"\"Create and\
          \ return an S3 client using credentials from environment variables.\"\"\"\
          \n            access_key = os.environ.get(\"AWS_ACCESS_KEY_ID\")\n     \
          \       secret_key = os.environ.get(\"AWS_SECRET_ACCESS_KEY\")\n       \
          \     endpoint_url = os.environ.get(\"AWS_S3_ENDPOINT\")\n            region_name\
          \ = os.environ.get(\"AWS_DEFAULT_REGION\")\n\n            if (access_key\
          \ and not secret_key) or (secret_key and not access_key):\n            \
          \    raise ValueError(\n                    \"S3 credentials misconfigured:\
          \ AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must either \"\n         \
          \           \"both be set and non-empty, or both be unset. \"\n        \
          \            \"Check the Kubernetes secret or environment configuration.\"\
          \n                )\n            if not access_key and not secret_key:\n\
          \                raise ValueError(\n                    \"S3 credentials\
          \ missing: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be provided\
          \ via \"\n                    \"a Kubernetes secret or environment configuration\
          \ when using s3:// dataset URIs.\"\n                )\n\n            if\
          \ not endpoint_url:\n                raise ValueError(\n               \
          \     \"S3 credentials missing: AWS_S3_ENDPOINT must be provided via \"\n\
          \                    \"a Kubernetes secret or environment configuration.\"\
          \n                )\n\n            return boto3.client(\n              \
          \  \"s3\",\n                endpoint_url=endpoint_url,\n               \
          \ region_name=region_name,\n                aws_access_key_id=access_key,\n\
          \                aws_secret_access_key=secret_key,\n                verify=verify,\n\
          \            )\n\n        def _sample_first_n_rows(text_stream, chunk_size,\
          \ max_size_bytes):\n            \"\"\"Take rows from the start of the stream\
          \ until the size limit is reached.\"\"\"\n            chunk_list = []\n\
          \            accumulated_size = 0\n\n            try:\n                for\
          \ chunk_df in pd.read_csv(text_stream, chunksize=chunk_size):\n        \
          \            chunk_memory = chunk_df.memory_usage(deep=True).sum()\n\n \
          \                   if accumulated_size + chunk_memory > max_size_bytes:\n\
          \                        remaining_bytes = max_size_bytes - accumulated_size\n\
          \                        if remaining_bytes <= 0:\n                    \
          \        # No remaining budget; do not take any more rows\n            \
          \                break\n                        bytes_per_row = chunk_memory\
          \ / len(chunk_df) if len(chunk_df) > 0 else 0\n                        if\
          \ bytes_per_row > 0:\n                            rows_to_take = int(remaining_bytes\
          \ / bytes_per_row)\n                            if rows_to_take > 0:\n \
          \                               chunk_df = chunk_df.head(rows_to_take)\n\
          \                                chunk_list.append(chunk_df)\n         \
          \               break\n\n                    chunk_list.append(chunk_df)\n\
          \                    accumulated_size += chunk_memory\n\n              \
          \      if accumulated_size >= max_size_bytes:\n                        break\n\
          \            except Exception as e:\n                if not chunk_list:\n\
          \                    raise ValueError(f\"Error reading CSV from S3: {str(e)}\"\
          ) from e\n\n            return pd.concat(chunk_list, ignore_index=True)\
          \ if chunk_list else pd.DataFrame()\n\n        def _sample_stratified(text_stream,\
          \ chunk_size, max_size_bytes, label_column):\n            \"\"\"Merge batches\
          \ and subsample proportionally by target column to stay under the size limit.\"\
          \"\"\n            subsampled_data = None\n\n            try:\n         \
          \       for chunk_df in pd.read_csv(text_stream, chunksize=chunk_size):\n\
          \                    if label_column not in chunk_df.columns:\n        \
          \                raise ValueError(\n                            f\"Target\
          \ column '{label_column}' not found in the dataset. \"\n               \
          \             f\"Available columns: {list(chunk_df.columns)}\"\n       \
          \                 )\n                    chunk_df = chunk_df.dropna(subset=[label_column])\n\
          \                    if chunk_df.empty:\n                        continue\n\
          \n                    combined_data = (\n                        pd.concat([subsampled_data,\
          \ chunk_df], ignore_index=True)\n                        if subsampled_data\
          \ is not None\n                        else chunk_df\n                 \
          \   )\n                    combined_memory = combined_data.memory_usage(deep=True).sum()\n\
          \n                    if combined_memory <= max_size_bytes:\n          \
          \              subsampled_data = combined_data\n                    else:\n\
          \                        sampling_frac = max_size_bytes / combined_memory\n\
          \                        subsampled_data = (\n                         \
          \   combined_data.groupby(label_column, group_keys=False)\n            \
          \                .apply(lambda x: x.sample(frac=sampling_frac, random_state=DEFAULT_RANDOM_STATE))\n\
          \                            .reset_index(drop=True)\n                 \
          \       )\n\n            except Exception as e:\n                logger.debug(\"\
          Error reading CSV and stratified sampling: %s\", e, exc_info=True)\n   \
          \             if subsampled_data is None or subsampled_data.empty:\n   \
          \                 raise ValueError(f\"Error reading CSV from S3: {str(e)}\"\
          ) from e\n\n            if subsampled_data is None:\n                return\
          \ pd.DataFrame()\n            return subsampled_data.sample(frac=1, random_state=DEFAULT_RANDOM_STATE).reset_index(drop=True)\n\
          \n        def _sample_random(text_stream, chunk_size, max_size_bytes):\n\
          \            \"\"\"Iterate all batches, merge with accumulated data, randomly\
          \ subsample when over the limit.\"\"\"\n            subsampled_data = None\n\
          \n            try:\n                for chunk_df in pd.read_csv(text_stream,\
          \ chunksize=chunk_size):\n                    data = (\n               \
          \         pd.concat([subsampled_data, chunk_df], ignore_index=True)\n  \
          \                      if subsampled_data is not None\n                \
          \        else chunk_df\n                    )\n                    combined_memory\
          \ = data.memory_usage(deep=True).sum()\n\n                    if combined_memory\
          \ <= max_size_bytes:\n                        subsampled_data = data\n \
          \                   else:\n                        sampling_frac = max_size_bytes\
          \ / combined_memory\n                        subsampled_data = data.sample(\n\
          \                            frac=sampling_frac, random_state=DEFAULT_RANDOM_STATE\n\
          \                        ).reset_index(drop=True)\n\n                return\
          \ subsampled_data if subsampled_data is not None else pd.DataFrame()\n\n\
          \            except Exception as e:\n                if subsampled_data\
          \ is None or subsampled_data.empty:\n                    raise ValueError(f\"\
          Error reading CSV from S3: {str(e)}\") from e\n                return subsampled_data\n\
          \n        def load_data_in_batches(\n            s3_client,\n          \
          \  bucket_name,\n            file_key,\n            max_size_bytes,\n  \
          \          sampling_method,\n            label_column,\n        ):\n   \
          \         \"\"\"Load CSV from S3 in batches and return a sampled dataframe\
          \ using the chosen strategy.\"\"\"\n            from botocore.exceptions\
          \ import SSLError\n\n            if sampling_method == \"stratified\" and\
          \ label_column is None:\n                raise ValueError(\"label_column\
          \ must be provided when sampling_method='stratified'\")\n\n            try:\n\
          \                response = s3_client.get_object(Bucket=bucket_name, Key=file_key)\n\
          \            except SSLError:\n                logger.warning(\n       \
          \             \"SSL error when downloading s3://%s/%s, retrying with verify=False\"\
          ,\n                    bucket_name,\n                    file_key,\n   \
          \             )\n                no_verify_client = get_s3_client(verify=False)\n\
          \                response = no_verify_client.get_object(Bucket=bucket_name,\
          \ Key=file_key)\n            text_stream = io.TextIOWrapper(response[\"\
          Body\"], encoding=\"utf-8\")\n\n            if sampling_method == \"stratified\"\
          :\n                return _sample_stratified(text_stream, PANDAS_CHUNK_SIZE,\
          \ max_size_bytes, label_column)\n            if sampling_method == \"random\"\
          :\n                return _sample_random(text_stream, PANDAS_CHUNK_SIZE,\
          \ max_size_bytes)\n            return _sample_first_n_rows(text_stream,\
          \ PANDAS_CHUNK_SIZE, max_size_bytes)\n\n        status.record(\n       \
          \     \"prepare_data\",\n            \"running\",\n            sampling_method=sampling_method,\n\
          \            source=f\"s3://{bucket_name}/{file_key}\",\n        )\n   \
          \     s3_client = get_s3_client()\n        sampled_dataframe = load_data_in_batches(\n\
          \            s3_client,\n            bucket_name,\n            file_key,\n\
          \            max_size_bytes=MAX_SIZE_BYTES,\n            sampling_method=sampling_method,\n\
          \            label_column=label_column,\n        )\n\n        if label_column\
          \ not in sampled_dataframe.columns:\n            raise ValueError(\n   \
          \             f\"Label column {label_column!r} not found in the dataset.\
          \ \"\n                f\"Available columns: {list(sampled_dataframe.columns)}\"\
          \n            )\n\n        sampled_dataframe.replace([math.inf, -math.inf],\
          \ float(\"nan\"), inplace=True)\n\n        n_before_dedup = len(sampled_dataframe)\n\
          \        sampled_dataframe.drop_duplicates(inplace=True)\n        n_dup_dropped\
          \ = n_before_dedup - len(sampled_dataframe)\n        if n_dup_dropped:\n\
          \            logger.info(\"Dropped %s full-row duplicate(s) (%s rows remaining).\"\
          , n_dup_dropped, len(sampled_dataframe))\n\n        if sampled_dataframe.empty:\n\
          \            raise ValueError(\n                \"No valid data rows remain\
          \ after replacing infinite values and dropping duplicates. \"\n        \
          \        \"The source CSV may contain only infinite/NaN values or duplicate\
          \ rows.\"\n            )\n\n        n_before_drop = len(sampled_dataframe)\n\
          \        sampled_dataframe = sampled_dataframe.dropna(subset=[label_column])\n\
          \        n_dropped = n_before_drop - len(sampled_dataframe)\n        if\
          \ n_dropped:\n            logger.info(\n                \"Dropped %s row(s)\
          \ with missing label in column %r before splitting (loaded %s rows, %s remaining).\"\
          ,\n                n_dropped,\n                label_column,\n         \
          \       n_before_drop,\n                len(sampled_dataframe),\n      \
          \      )\n        if sampled_dataframe.empty:\n            raise ValueError(\n\
          \                f\"No rows remain after removing missing values in label\
          \ column {label_column!r}. \"\n                \"Ensure the dataset has\
          \ at least one row with a non-null label (e.g. empty cells in the target\
          \ column).\"\n            )\n\n        n_valid = len(sampled_dataframe)\n\
          \        if n_valid < MIN_VALID_RECORDS_AFTER_CLEANSING:\n            raise\
          \ ValueError(\n                f\"After data cleansing, only {n_valid} valid\
          \ record(s) remain; \"\n                f\"at least {MIN_VALID_RECORDS_AFTER_CLEANSING}\
          \ are required for AutoML training. \"\n                \"Provide a larger\
          \ dataset or reduce missing labels, duplicates, and invalid values.\"\n\
          \            )\n\n        n_samples = n_valid\n        logger.info(\n  \
          \          \"Read %d rows from s3://%s/%s (sampling_method=%s)\",\n    \
          \        n_samples,\n            bucket_name,\n            file_key,\n \
          \           sampling_method,\n        )\n        status.record(\n      \
          \      \"prepare_data\",\n            \"completed\",\n            rows=n_samples,\n\
          \            duplicates_dropped=n_dup_dropped,\n            labels_dropped=n_dropped,\n\
          \        )\n\n        status.record(\"split_and_export\", \"started\")\n\
          \n        # --- Train/test split ---\n        from pathlib import Path\n\
          \n        from sklearn.model_selection import train_test_split\n\n     \
          \   DEFAULT_TEST_SIZE = 0.2\n        DEFAULT_SPLIT_RANDOM_STATE = 42\n\n\
          \        split_config = split_config or {}\n        test_size = split_config.get(\"\
          test_size\", DEFAULT_TEST_SIZE)\n        random_state = split_config.get(\"\
          random_state\", DEFAULT_SPLIT_RANDOM_STATE)\n\n        if not sampled_test_dataset.uri\
          \ or not sampled_test_dataset.uri.endswith(\".csv\"):\n            sampled_test_dataset.uri\
          \ = (sampled_test_dataset.uri or \"sampled_test_dataset\") + \".csv\"\n\n\
          \        # Features and target\n        X = sampled_dataframe.drop(columns=[label_column],\
          \ inplace=False)\n        y = sampled_dataframe[label_column]\n\n      \
          \  stratify_effective = task_type != \"regression\" and split_config.get(\"\
          stratify\", True)\n\n        # Primary split: train vs test\n        X_train,\
          \ X_test, y_train, y_test = train_test_split(\n            X,\n        \
          \    y,\n            test_size=test_size,\n            stratify=(y if stratify_effective\
          \ else None),\n            random_state=random_state,\n        )\n\n   \
          \     # Secondary split: selection train vs extra train\n        X_sel,\
          \ X_extra, y_sel, y_extra = train_test_split(\n            X_train,\n  \
          \          y_train,\n            test_size=(1 - selection_train_size),\n\
          \            stratify=(y_train if stratify_effective else None),\n     \
          \       random_state=random_state,\n        )\n\n        X_y_sel = pd.concat([X_sel,\
          \ y_sel], axis=1)\n        X_y_extra = pd.concat([X_extra, y_extra], axis=1)\n\
          \        X_y_test = pd.concat([X_test, y_test], axis=1)\n\n        # Write\
          \ selection train and extra train to PVC workspace\n        datasets_dir\
          \ = Path(workspace_path) / \"datasets\"\n        datasets_dir.mkdir(parents=True,\
          \ exist_ok=True)\n        models_selection_train_data_path = str(datasets_dir\
          \ / \"models_selection_train_dataset.csv\")\n        extra_train_data_path\
          \ = str(datasets_dir / \"extra_train_dataset.csv\")\n        X_y_sel.to_csv(models_selection_train_data_path,\
          \ index=False)\n        X_y_extra.to_csv(extra_train_data_path, index=False)\n\
          \n        # Write test to S3 artifact\n        X_y_test.to_csv(sampled_test_dataset.path,\
          \ index=False)\n\n        status.record(\n            \"split_and_export\"\
          ,\n            \"completed\",\n            test_size=test_size,\n      \
          \      selection_train_size=selection_train_size,\n            stratify=stratify_effective,\n\
          \        )\n\n        # Sample row for downstream use (JSON string to avoid\
          \ NaN issues)\n        sample_row = X_y_test.head(1).to_json(orient=\"records\"\
          )\n\n        return NamedTuple(\n            \"outputs\",\n            sample_config=dict,\n\
          \            split_config=dict,\n            sample_row=str,\n         \
          \   models_selection_train_data_path=str,\n            extra_train_data_path=str,\n\
          \        )(\n            sample_config={\"n_samples\": n_samples},\n   \
          \         split_config={\n                \"test_size\": test_size,\n  \
          \              \"random_state\": random_state,\n                \"stratify\"\
          : stratify_effective,\n            },\n            sample_row=sample_row,\n\
          \            models_selection_train_data_path=models_selection_train_data_path,\n\
          \            extra_train_data_path=extra_train_data_path,\n        )\n\n"
