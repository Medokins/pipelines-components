          \  ``dsl.PIPELINE_JOB_NAME_PLACEHOLDER``) so the MLflow run matches the\
          \ OpenShift run\n            name. Falls back to ``pipeline_name`` when\
          \ empty.\n        preset: Training quality preset logged on the parent run.\n\
          \        top_n: Number of top models logged on the parent run.\n       \
          \ log_model_artifacts: When True, upload each model's predictor (model.pkl)\
          \ and notebook.\n        register_best_model: When True, register the best\
          \ model in the MLflow Model Registry.\n        model_registry_name: Registered-model\
          \ name to use when ``register_best_model`` is True.\n        target_stage:\
          \ Optional deployment-stage value set as a ``target_stage`` tag on the\n\
          \            registered best-model version.\n        embedded_artifact:\
          \ Embedded ``mlflow_tracking.py`` helper injected by KFP at compile time.\n\
          \n    Raises:\n        TypeError: If required string parameters are empty.\n\
          \        ValueError: If ``top_n`` is not positive.\n    \"\"\"\n    import\
          \ importlib.util\n    import logging\n    import os\n    import sys\n  \
          \  from pathlib import Path\n\n    from kfp_components.components.training.automl.shared.component_status\
          \ import ComponentStatusTracker\n\n    def _load_log_automl_results():\n\
          \        try:\n            from kfp_components.components.training.automl.shared.mlflow_tracking\
          \ import (\n                log_automl_results as _log_automl_results,\n\
          \            )\n\n            return _log_automl_results\n        except\
          \ ModuleNotFoundError:\n            if embedded_artifact is None:\n    \
          \            raise\n            embedded_path = Path(embedded_artifact.path)\n\
          \            module_path = embedded_path if embedded_path.is_file() else\
          \ embedded_path / \"mlflow_tracking.py\"\n            if not module_path.is_file():\n\
          \                raise ModuleNotFoundError(\n                    f\"mlflow_tracking\
          \ not found in image or embedded artifact at {module_path}\"\n         \
          \       ) from None\n            module_name = \"kfp_components_automl_embedded_mlflow_tracking\"\
          \n            spec = importlib.util.spec_from_file_location(module_name,\
          \ module_path)\n            if spec is None or spec.loader is None:\n  \
          \              raise ModuleNotFoundError(f\"Cannot load embedded mlflow_tracking\
          \ from {module_path}\") from None\n            module = importlib.util.module_from_spec(spec)\n\
          \            sys.modules[module_name] = module\n            spec.loader.exec_module(module)\n\
          \            return module.log_automl_results\n\n    log_automl_results\
          \ = _load_log_automl_results()\n\n    logger = logging.getLogger(__name__)\n\
          \    tracking_uri = os.getenv(\"MLFLOW_TRACKING_URI\", \"\").strip()\n \
          \   logger.info(\n        \"MLflow env: MLFLOW_TRACKING_URI=%s MLFLOW_RUN_ID=%s\
          \ MLFLOW_WORKSPACE=%s MLFLOW_EXPERIMENT_NAME=%s\",\n        \"set\" if tracking_uri\
          \ else \"unset\",\n        \"set\" if os.getenv(\"MLFLOW_RUN_ID\") else\
          \ \"unset\",\n        os.getenv(\"MLFLOW_WORKSPACE\", \"\") or \"(empty)\"\
          ,\n        os.getenv(\"MLFLOW_EXPERIMENT_NAME\", \"\") or \"(empty)\",\n\
          \    )\n    if not tracking_uri:\n        logger.warning(\n            \"\
          MLFLOW_TRACKING_URI is unset. Set pipeline parameter mlflow_connection_secret_name\
          \ \"\n            \"(for example mlflow-connection) when starting the run.\"\
          \n        )\n\n    if not isinstance(eval_metric, str) or not eval_metric.strip():\n\
          \        raise TypeError(\"eval_metric must be a non-empty string.\")\n\
          \    if not isinstance(pipeline_name, str) or not pipeline_name.strip():\n\
          \        raise TypeError(\"pipeline_name must be a non-empty string.\")\n\
          \    if not isinstance(run_id, str) or not run_id.strip():\n        raise\
          \ TypeError(\"run_id must be a non-empty string.\")\n    if not isinstance(task_type,\
          \ str) or not task_type.strip():\n        raise TypeError(\"task_type must\
          \ be a non-empty string.\")\n    if top_n <= 0:\n        raise ValueError(f\"\
          top_n must be a positive integer; got {top_n}.\")\n    if register_best_model\
          \ and not model_registry_name.strip():\n        raise ValueError(\"model_registry_name\
          \ must be set when register_best_model is True.\")\n\n    status = ComponentStatusTracker(component_status.path,\
          \ \"automl_mlflow_logger\")\n    with status:\n        status.record(\"\
          log_mlflow_results\", \"started\")\n\n        logged, tracking_info = log_automl_results(\n\
          \            models_artifact=models_artifact,\n            html_artifact_path=html_artifact.path,\n\
          \            eval_metric=eval_metric,\n            pipeline_name=pipeline_name,\n\
          \            kfp_run_id=run_id,\n            kfp_run_name=run_name or pipeline_name,\n\
          \            task_type=task_type,\n            preset=preset,\n        \
          \    top_n=top_n,\n            log_model_artifacts=log_model_artifacts,\n\
          \            register_best_model=register_best_model,\n            model_registry_name=model_registry_name,\n\
          \            target_stage=target_stage,\n        )\n\n        component_status.metadata[\"\
          display_name\"] = \"MLflow Logging Status\"\n        component_status.metadata[\"\
          tracking_enabled\"] = str(logged)\n        for key in (\n            \"\
          mlflow_run_id\",\n            \"mlflow_experiment_id\",\n            \"\
          tracking_mode\",\n            \"mlflow_child_run_count\",\n            \"\
          mlflow_child_run_ids\",\n            \"mlflow_child_run_errors\",\n    \
          \        \"mlflow_registered_model\",\n            \"mlflow_model_version\"\
          ,\n            \"mlflow_target_stage\",\n            \"mlflow_registry_error\"\
          ,\n        ):\n            if tracking_info.get(key):\n                component_status.metadata[key]\
          \ = tracking_info[key]\n        if tracking_info.get(\"error\"):\n     \
          \       component_status.metadata[\"mlflow_error\"] = tracking_info[\"error\"\
          ]\n        if tracking_uri:\n            component_status.metadata[\"mlflow_tracking_uri\"\
          ] = tracking_uri\n\n        if logged:\n            logger.info(\"MLflow\
          \ logging completed for pipeline run %s.\", run_id)\n            status.record(\n\
          \                \"log_mlflow_results\",\n                \"completed\"\
          ,\n                tracking_enabled=True,\n                tracking_mode=tracking_info.get(\"\
          tracking_mode\", \"\"),\n            )\n        else:\n            mlflow_error\
          \ = tracking_info.get(\"error\", \"\")\n            if mlflow_error:\n \
          \               logger.warning(\"MLflow logging failed for pipeline run\
          \ %s: %s\", run_id, mlflow_error)\n            else:\n                logger.info(\"\
          MLflow logging skipped for pipeline run %s.\", run_id)\n            status.record(\n\
          \                \"log_mlflow_results\",\n                \"completed\"\
          ,\n                tracking_enabled=False,\n                mlflow_error=mlflow_error\
          \ or None,\n            )\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 1.073741824
          memoryRequest: 0.536870912
          resourceCpuLimit: '1'
          resourceCpuRequest: '0.5'
          resourceMemoryLimit: 1Gi
          resourceMemoryRequest: 512Mi
    exec-publish-component-stage-map:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - publish_component_stage_map
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef publish_component_stage_map(\n    pipeline_id: str,\n    run_id:\
          \ str,\n    component_stage_map: dsl.Output[dsl.Artifact],\n) -> None:\n\
          \    \"\"\"Publish the component-to-stage-to-step map for dashboard consumption.\n\
          \n    Reads the static JSON template from the package (``run_status_templates/pipelines/``)\n\
          \    and publishes it as a KFP artifact. Dashboards use this map to show\
          \ expected\n    components, stages, and steps before pipeline execution\
          \ begins.\n\n    Args:\n        pipeline_id: Pipeline identifier matching\
          \ the template filename\n            (e.g. ``autogluon-tabular-training-pipeline``).\n\
          \        run_id: KFP run ID for tracking (from ``dsl.PIPELINE_JOB_ID_PLACEHOLDER``).\n\
          \        component_stage_map: Output artifact containing the component-to-stage-to-step\
          \ map.\n\n    Raises:\n        FileNotFoundError: If the template for ``pipeline_id``\
          \ is missing or empty.\n        ValueError: If ``pipeline_id`` or ``run_id``\
          \ is empty.\n\n    Example:\n        map_task = publish_component_stage_map(\n\
          \            pipeline_id=\"autogluon-tabular-training-pipeline\",\n    \
          \        run_id=dsl.PIPELINE_JOB_ID_PLACEHOLDER,\n        )\n    \"\"\"\n\
          \    import json\n    import os\n    from datetime import UTC, datetime\n\
          \    from pathlib import Path\n\n    from kfp_components.components.training.automl.shared.run_status\
          \ import (\n        load_pipeline_run_status_manifest,\n    )\n\n    def\
          \ _build_mlflow_stage_map_block() -> dict:\n        \"\"\"Build the ``mlflow``\
          \ block from pod env vars.\n\n        Inlined so the publisher does not\
          \ depend on ``shared/mlflow_tracking.py`` being\n        installed in the\
          \ runtime image (mirrors ``build_mlflow_stage_map_block`` there).\n    \
          \    \"\"\"\n        tracking_uri = os.getenv(\"MLFLOW_TRACKING_URI\", \"\
          \").strip()\n        if not tracking_uri:\n            return {\"tracking_enabled\"\
          : False}\n\n        block: dict = {\"tracking_enabled\": True, \"tracking_uri\"\
          : tracking_uri}\n        experiment_id = os.getenv(\"MLFLOW_EXPERIMENT_ID\"\
          , \"\").strip()\n        if experiment_id:\n            block[\"experiment_id\"\
          ] = experiment_id\n        parent_run_id = os.getenv(\"MLFLOW_RUN_ID\",\
          \ \"\").strip()\n        if parent_run_id:\n            block[\"run_id\"\
          ] = parent_run_id\n        workspace = os.getenv(\"MLFLOW_WORKSPACE\", \"\
          \").strip()\n        if workspace:\n            block[\"workspace\"] = workspace\n\
          \        if experiment_id and parent_run_id:\n            base = tracking_uri.rstrip(\"\
          /\")\n            block[\"run_url\"] = f\"{base}/#/experiments/{experiment_id}/runs/{parent_run_id}\"\
          \n        return block\n\n    if not isinstance(pipeline_id, str) or not\
          \ pipeline_id.strip():\n        raise ValueError(\"pipeline_id must be a\
          \ non-empty string\")\n    if not isinstance(run_id, str) or not run_id.strip():\n\
          \        raise ValueError(\"run_id must be a non-empty string\")\n\n   \
          \ stage_map = load_pipeline_run_status_manifest(pipeline_id)\n    # Legacy\
          \ templates may include an empty initial_document shell; not part of the\
          \ stage map.\n    stage_map.pop(\"initial_document\", None)\n    if not\
          \ stage_map.get(\"components\"):\n        raise FileNotFoundError(\n   \
          \         f\"Component stage map not found or empty for pipeline_id='{pipeline_id}'.\
          \ \"\n            \"Ensure run_status_templates/pipelines/<pipeline_id>.json\
          \ is packaged in the AutoML image.\"\n        )\n\n    stage_map[\"kfp_run_id\"\
          ] = run_id\n    stage_map[\"published_at\"] = datetime.now(UTC).isoformat().replace(\"\
          +00:00\", \"Z\")\n    stage_map[\"mlflow\"] = _build_mlflow_stage_map_block()\n\
          \n    output_path = Path(component_stage_map.path)\n    output_path.mkdir(parents=True,\
          \ exist_ok=True)\n\n    output_file = output_path / \"component_stage_map.json\"\
          \n    with output_file.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump(stage_map,\
          \ f, indent=2)\n\n    component_stage_map.metadata[\"display_name\"] = \"\
          Component Stage Map\"\n    component_stage_map.metadata[\"pipeline_id\"\
          ] = pipeline_id\n    component_stage_map.metadata[\"component_count\"] =\
          \ len(stage_map.get(\"components\", []))\n    mlflow_block = stage_map[\"\
          mlflow\"]\n    component_stage_map.metadata[\"mlflow_tracking_enabled\"\
          ] = str(mlflow_block.get(\"tracking_enabled\", False))\n\n    component_count\
          \ = len(stage_map.get(\"components\", []))\n    stage_count = sum(len(c.get(\"\
          stages\", [])) for c in stage_map.get(\"components\", []))\n    print(f\"\
          Published component stage map for pipeline_id='{pipeline_id}':\")\n    print(f\"\
          \  - Components: {component_count}\")\n    print(f\"  - Total stages: {stage_count}\"\
          )\n    print(f\"  - Published to: {output_file}\")\n    print(f\"  - MLflow\
          \ tracking enabled: {mlflow_block.get('tracking_enabled', False)}\")\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 1.073741824
          memoryRequest: 0.536870912
          resourceCpuLimit: '1'
          resourceCpuRequest: '0.5'
          resourceMemoryLimit: 1Gi
          resourceMemoryRequest: 512Mi
pipelineInfo:
  description: AutoML tabular training pipeline for building high-quality models on
    structured data with minimal effort. Powered by AutoGluon, it automates discovery,
    ensembling, and selection, then refits top candidates for maximum accuracy. Delivers
    production-ready predictors, clear metrics, and a ranked leaderboard to choose
    the best deployment option.
  name: autogluon-tabular-training-pipeline
root:
  dag:
    tasks:
      automl-data-loader:
        cachingOptions: {}
        componentRef:
          name: comp-automl-data-loader
        dependentTasks:
        - publish-component-stage-map
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: train_data_bucket_name
            file_key:
              componentInputParameter: train_data_file_key
            label_column:
              componentInputParameter: label_column
            task_type:
              componentInputParameter: task_type
            workspace_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
        taskInfo:
          name: automl-data-loader
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - automl-data-loader
        inputs:
          artifacts:
            pipelinechannel--automl-data-loader-sampled_test_dataset:
              taskOutputArtifact:
                outputArtifactKey: sampled_test_dataset
                producerTask: automl-data-loader
          parameters:
            pipelinechannel--automl-data-loader-extra_train_data_path:
              taskOutputParameter:
                outputParameterKey: extra_train_data_path
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-models_selection_train_data_path:
              taskOutputParameter:
                outputParameterKey: models_selection_train_data_path
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-sample_config:
              taskOutputParameter:
                outputParameterKey: sample_config
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-sample_row:
              taskOutputParameter:
                outputParameterKey: sample_row
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-split_config:
              taskOutputParameter:
                outputParameterKey: split_config
                producerTask: automl-data-loader
            pipelinechannel--eval_metric:
              componentInputParameter: eval_metric
            pipelinechannel--label_column:
              componentInputParameter: label_column
            pipelinechannel--mlflow_connection_secret_name:
              componentInputParameter: mlflow_connection_secret_name
            pipelinechannel--model_registry_name:
              componentInputParameter: model_registry_name
            pipelinechannel--positive_class:
              componentInputParameter: positive_class
            pipelinechannel--preset:
              componentInputParameter: preset
            pipelinechannel--register_best_model:
              componentInputParameter: register_best_model
            pipelinechannel--target_stage:
              componentInputParameter: target_stage
            pipelinechannel--task_type:
              componentInputParameter: task_type
            pipelinechannel--top_n:
              componentInputParameter: top_n
        taskInfo:
          name: condition-branches-1
      publish-component-stage-map:
        cachingOptions: {}
        componentRef:
          name: comp-publish-component-stage-map
        inputs:
          parameters:
            pipeline_id:
              runtimeValue:
                constant: autogluon-tabular-training-pipeline
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: publish-component-stage-map
  inputDefinitions:
    parameters:
      eval_metric:
        defaultValue: ''
        description: Metric used for model ranking. Empty string (default) is resolved
          by the component to "r2" for regression and "accuracy" for binary and multiclass
          classification.
        isOptional: true
        parameterType: STRING
      label_column:
        description: Name of the target/label column in the dataset.
        parameterType: STRING
      mlflow_connection_secret_name:
        defaultValue: ''
        description: Optional Kubernetes secret providing MLflow tracking env vars
          (MLFLOW_TRACKING_URI, etc.), mounted on the MLflow logger step only. Empty
          (default) disables MLflow logging; the step still succeeds.
        isOptional: true
        parameterType: STRING
      model_registry_name:
        defaultValue: ''
        description: Registered-model name to use when register_best_model is True.
        isOptional: true
        parameterType: STRING
      positive_class:
        defaultValue: ''
        description: Optional label value for the positive class in binary classification.
          Defaults to the second unique class after sorting label values.
        isOptional: true
        parameterType: STRING
      preset:
        defaultValue: speed
        description: Training quality tier. "speed" (default, 4 vCPU / 16 GiB) or
          "balanced" (may run more than 2x longer, 8 vCPU / 32 GiB).
        isOptional: true
        parameterType: STRING
      register_best_model:
        defaultValue: false
        description: When True, register the best model in the MLflow Model Registry
          (requires model_registry_name).
        isOptional: true
        parameterType: BOOLEAN
      target_stage:
        defaultValue: ''
        description: Optional deployment-stage value set as a "target_stage" tag on
          the registered best-model version.
        isOptional: true
        parameterType: STRING
      task_type:
        description: '"binary", "multiclass", or "regression"; drives metrics and
          model types.'
        parameterType: STRING
      top_n:
        defaultValue: 3.0
        description: 'Number of top models to select and refit (default: 3); positive
          integer from range [1, 10].'
        isOptional: true
        parameterType: NUMBER_INTEGER
      train_data_bucket_name:
        description: S3-compatible bucket name containing the tabular data file.
        parameterType: STRING
      train_data_file_key:
        description: S3 object key of the CSV file (features and target column).
        parameterType: STRING
      train_data_secret_name:
        description: Kubernetes secret name with S3 credentials (AWS_ACCESS_KEY_ID,
          AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_DEFAULT_REGION).
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-automl-data-loader:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: true
            secretNameParameter:
              componentInputParameter: train_data_secret_name
        exec-automl-mlflow-logger:
          secretAsEnv:
          - keyToEnv:
            - envVar: MLFLOW_TRACKING_URI
              secretKey: MLFLOW_TRACKING_URI
            - envVar: MLFLOW_TRACKING_AUTH
              secretKey: MLFLOW_TRACKING_AUTH
            - envVar: MLFLOW_WORKSPACE
              secretKey: MLFLOW_WORKSPACE
            - envVar: MLFLOW_EXPERIMENT_NAME
              secretKey: MLFLOW_EXPERIMENT_NAME
            - envVar: MLFLOW_TRACKING_TOKEN
              secretKey: MLFLOW_TRACKING_TOKEN
            - envVar: MLFLOW_TRACKING_INSECURE_TLS
              secretKey: MLFLOW_TRACKING_INSECURE_TLS
            optional: true
            secretNameParameter:
              componentInputParameter: pipelinechannel--mlflow_connection_secret_name
        exec-automl-mlflow-logger-2:
          secretAsEnv:
          - keyToEnv:
            - envVar: MLFLOW_TRACKING_URI
              secretKey: MLFLOW_TRACKING_URI
            - envVar: MLFLOW_TRACKING_AUTH
              secretKey: MLFLOW_TRACKING_AUTH
            - envVar: MLFLOW_WORKSPACE
              secretKey: MLFLOW_WORKSPACE
            - envVar: MLFLOW_EXPERIMENT_NAME
              secretKey: MLFLOW_EXPERIMENT_NAME
            - envVar: MLFLOW_TRACKING_TOKEN
              secretKey: MLFLOW_TRACKING_TOKEN
            - envVar: MLFLOW_TRACKING_INSECURE_TLS
              secretKey: MLFLOW_TRACKING_INSECURE_TLS
            optional: true
            secretNameParameter:
              componentInputParameter: pipelinechannel--mlflow_connection_secret_name
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteOnce
        size: 12Gi
