          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef autogluon_models_training(\n    label_column: str,\n    task_type:\
          \ str,\n    top_n: int,\n    train_data_path: str,\n    test_data: dsl.Input[dsl.Dataset],\n\
          \    workspace_path: str,\n    pipeline_name: str,\n    run_id: str,\n \
          \   sample_row: str,\n    models_artifact: dsl.Output[dsl.Model],\n    html_artifact:\
          \ dsl.Output[dsl.HTML],\n    component_status: dsl.Output[dsl.Artifact],\n\
          \    sampling_config: Optional[dict] = None,\n    split_config: Optional[dict]\
          \ = None,\n    extra_train_data_path: str = \"\",\n    positive_class: str\
          \ = \"\",\n    preset: str = \"speed\",\n    eval_metric: str = \"\",\n\
          ) -> NamedTuple(\"outputs\", eval_metric=str, best_model_name=str):\n  \
          \  \"\"\"Train AutoGluon models, select the top N, and refit each on the\
          \ full dataset.\n\n    Expects pre-cleaned CSV data from the tabular data\
          \ loader (infinite values replaced,\n    duplicates removed, missing labels\
          \ dropped). Reads train/test/extra-train CSVs and\n    validates that the\
          \ label column exists in each dataset.\n\n    This component combines the\
          \ model selection and full-refit stages into a single\n    step. It trains\
          \ a TabularPredictor on sampled data, ranks all models on the test\n   \
          \ set, then refits each of the top N models on the full training data in\
          \ a single\n    ``refit_full`` call. Post-refit work (predict, evaluate,\
          \ feature importance,\n    confusion matrix (via evaluate_predictions detailed_report),\
          \ classification curves,\n    notebook generation) runs concurrently across\
          \ all top-N models\n    via ``ThreadPoolExecutor``. The deployment clone\
          \ (``set_model_best`` +\n    ``clone_for_deployment``) is serialized afterward\
          \ because it mutates predictor\n    state. All artifacts are written under\
          \ a single output artifact so the pipeline\n    does not require a ParallelFor\
          \ loop. Each model directory contains a ``model.json``\n    file with model\
          \ metadata (name, location, metrics).\n\n    Args:\n        label_column:\
          \ Target/label column name in train and test datasets.\n        task_type:\
          \ ML task type: ``\"binary\"``, ``\"multiclass\"``, or ``\"regression\"\
          ``.\n        top_n: Number of top models to select and refit (1-10).\n \
          \       train_data_path: Path to the selection-train CSV on the PVC workspace.\n\
          \        test_data: Dataset artifact (CSV) used for leaderboard ranking\
          \ and evaluation.\n        workspace_path: PVC workspace directory; predictor\
          \ saved at ``workspace_path/autogluon_predictor``.\n        pipeline_name:\
          \ Pipeline run name; last dash-segment stripped for the notebook.\n    \
          \    run_id: Pipeline run ID written into the generated notebook.\n    \
          \    sample_row: JSON array of row dicts for the notebook example input;\
          \ label column is stripped.\n        models_artifact: Output Model artifact\
          \ containing all refitted model subdirectories.\n        html_artifact:\
          \ Output HTML artifact containing the ranked leaderboard page.\n       \
          \ component_status: Output artifact containing stage-level progress tracking\
          \ for this component.\n        sampling_config: Data sampling config stored\
          \ in artifact metadata.\n        split_config: Data split config stored\
          \ in artifact metadata.\n        extra_train_data_path: Optional path to\
          \ extra training CSV passed to ``refit_full``.\n        positive_class:\
          \ Label value for the positive class in **binary** classification\n    \
          \        (e.g. ``\"1\"`` or ``\"yes\"``). Passed to ``TabularPredictor``\
          \ when set.\n            Empty string (default) lets AutoGluon infer the\
          \ positive class when ``fit`` runs.\n            Ignored for ``multiclass``\
          \ and ``regression``.\n        preset: Training quality tier. ``\"speed\"\
          `` (default) or ``\"balanced\"``\n            (may run more than 2x longer).\n\
          \        eval_metric: Metric for model ranking (e.g. ``\"r2\"``, ``\"accuracy\"\
          ``). Defaults\n            to ``\"r2\"`` for regression and ``\"accuracy\"\
          `` otherwise.\n\n    Returns:\n        NamedTuple with ``eval_metric`` (the\
          \ metric used for ranking, e.g. ``\"r2\"`` or ``\"accuracy\"``)\n      \
          \  and ``best_model_name`` (name of the highest-ranked refitted model, e.g.\
          \ ``\"LightGBM_BAG_L1_FULL\"``).\n\n    Raises:\n        TypeError: If any\
          \ required string parameter is empty or configs have wrong types.\n    \
          \    ValueError: If ``task_type`` is invalid, ``top_n`` is out of range,\
          \ ``sample_row``\n            is not a JSON list, ``problem_type`` is unsupported\
          \ for notebook generation,\n            label column not found in CSV, or\
          \ train/test data is empty.\n        FileNotFoundError: If train/test data\
          \ or predictor paths cannot be found.\n    \"\"\"  # noqa: E501\n    import\
          \ json\n    import logging\n    import math\n    import shutil\n    from\
          \ concurrent.futures import ThreadPoolExecutor\n    from pathlib import\
          \ Path\n    from typing import (\n        Any,\n        NamedTuple,  # NamedTuple\
          \ must be imported inside the function body for KFP container execution\n\
          \    )\n\n    import numpy as np\n    import pandas as pd\n    from autogluon.core.metrics\
          \ import METRICS\n    from autogluon.tabular import TabularPredictor\n\n\
          \    VALID_TASK_TYPES = {\"binary\", \"multiclass\", \"regression\"}\n \
          \   VALID_PRESETS = {\"speed\", \"balanced\"}\n    PRESET_TIME_LIMITS =\
          \ {\"speed\": 45 * 60, \"balanced\": 90 * 60}\n    PRESET_AG_NAMES = {\"\
          speed\": \"good_quality\", \"balanced\": \"high_quality\"}\n    TOP_N_MAX\
          \ = 10\n\n    # Input parameters validation\n    if not isinstance(label_column,\
          \ str) or not label_column.strip():\n        raise TypeError(\"label_column\
          \ must be a non-empty string.\")\n    if task_type not in VALID_TASK_TYPES:\n\
          \        raise ValueError(f\"task_type must be one of {VALID_TASK_TYPES};\
          \ got {task_type!r}.\")\n    if preset not in VALID_PRESETS:\n        raise\
          \ ValueError(f\"preset must be one of {VALID_PRESETS}; got {preset!r}.\"\
          )\n    if not train_data_path or not isinstance(train_data_path, str) or\
          \ not train_data_path.strip():\n        raise TypeError(\"train_data_path\
