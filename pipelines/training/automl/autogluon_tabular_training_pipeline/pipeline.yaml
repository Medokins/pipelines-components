          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef automl_data_loader(  # noqa: D417\n    file_key: str,\n    bucket_name:\
          \ str,\n    workspace_path: str,\n    label_column: str,\n    sampled_test_dataset:\
          \ dsl.Output[dsl.Dataset],\n    component_status: dsl.Output[dsl.Artifact],\n\
          \    sampling_method: Optional[str] = None,\n    task_type: str = \"regression\"\
          ,\n    split_config: Optional[dict] = None,\n    selection_train_size: float\
          \ = 0.3,\n    test_data_bucket_name: str = \"\",\n    test_data_file_key:\
          \ str = \"\",\n    preset: str = \"speed\",\n) -> NamedTuple(\n    \"outputs\"\
          ,\n    sample_config=dict,\n    split_config=dict,\n    sample_row=str,\n\
          \    models_selection_train_data_path=str,\n    extra_train_data_path=str,\n\
          ):\n    \"\"\"AutoML Data Loader component.\n\n    Loads tabular (CSV) data\
          \ from S3 in batches, sampling up to a preset-dependent\n    size budget\
          \ (``\"speed\"``: 100 MB, ``\"balanced\"``: 1 GB), then splits the sampled\n\
          \    data into test, selection-train, and extra-train sets.\n\n    The component\
          \ reads data in chunks to efficiently handle large files without\n    loading\
          \ the entire dataset into memory at once. After sampling, it performs\n\
          \    a two-stage split:\n\n    1. **Primary split** (default 80/20): separates\
          \ a *test set* (20%, written to\n       the ``sampled_test_dataset`` S3\
          \ artifact) from the *train portion* (80%).\n\n    2. **Secondary split**\
          \ (default 30/70 of the train portion): produces\n       ``models_selection_train_dataset.csv``\
          \ (30%, used for model selection) and\n       ``extra_train_dataset.csv``\
          \ (70%, passed to ``refit_full`` as extra data).\n       Both are written\
          \ to the PVC workspace under ``{workspace_path}/datasets/``.\n\n    For\
          \ **regression** tasks the split is random; for **binary** and **multiclass**\n\
          \    tasks the split is **stratified** by the label column by default.\n\
          \n    Rows with a missing label (NaN / empty in ``label_column``) are dropped\
          \ after load\n    and before splitting, so regression runs do not propagate\
          \ null targets into splits\n    or the ``sample_row`` JSON (stratified sampling\
          \ already dropped per chunk; this\n    applies the same rule to random and\
          \ first-n-rows paths).\n\n    After cleansing (infinity replacement, duplicate\
          \ removal, and label drop), at least\n    **100** valid records must remain;\
          \ otherwise the component fails with a clear error\n    so downstream AutoML\
          \ training does not run on datasets too small to split reliably.\n\n   \
          \ After sampling, **+/- infinity** values in the frame are replaced with\
          \ **NaN** (same\n    idea as AutoAI ``loadXy``), then **full-row duplicates**\
          \ are dropped before the\n    label drop and train/test split.\n\n    Authentication\
          \ uses AWS-style credentials provided via environment variables\n    (e.g.\
          \ from a Kubernetes secret).\n\n    Args:\n        file_key: S3 object key\
          \ of the CSV file.\n        bucket_name: S3 bucket name containing the file.\n\
          \        workspace_path: PVC workspace directory where train CSVs will be\
          \ written.\n        label_column: Name of the label/target column in the\
          \ dataset.\n        sampled_test_dataset: Output dataset artifact for the\
          \ test split.\n        component_status: Output artifact containing stage-level\
          \ progress tracking for this component.\n        sampling_method: \"first_n_rows\"\
          , \"stratified\", or \"random\"; if None, derived from task_type.\n    \
          \    task_type: \"binary\", \"multiclass\", or \"regression\" (default);\
          \ used when sampling_method is None.\n        split_config: Split configuration\
          \ dictionary. Available keys: \"test_size\" (float), \"random_state\" (int),\
          \ \"stratify\" (bool).\n        selection_train_size: Fraction of the train\
          \ portion used for model selection (default 0.3).\n        test_data_bucket_name:\
          \ S3 bucket name for user-provided test dataset (default: empty string).\n\
          \        test_data_file_key: S3 object key of the user-provided test CSV\
          \ (default: empty string).\n        preset: Training quality tier controlling\
          \ the sampling size budget. ``\"speed\"``\n            (default) samples\
          \ up to 100 MB; ``\"balanced\"`` samples up to 1 GB. The cap for\n     \
          \       user-provided test datasets (50 MB) is unaffected by this setting.\n\
          \n    Raises:\n        ValueError: If sampling_method, task_type, or preset\
          \ is invalid, if required parameters are missing,\n            if only one\
          \ of the ``test_data_*`` pair is set or the test key is not a valid S3 object\
          \ key,\n            if the test dataset is empty or missing the label or\
          \ a training feature column, or if\n            fewer than 100 valid records\
          \ remain after data cleansing.\n\n    Returns:\n        NamedTuple: Contains\
          \ sample config, split config, a sample row, and paths to\n            selection-train\
          \ and extra-train CSVs.\n    \"\"\"  # noqa: E501\n    import io\n    import\
          \ logging\n    import math\n\n    import boto3\n    import pandas as pd\n\
          \    from kfp_components.components.training.automl.shared.component_status\
          \ import ComponentStatusTracker\n    from kfp_components.components.training.automl.shared.user_test_data\
          \ import (\n        raise_if_test_data_empty,\n        report_test_data_truncation,\n\
          \        resolve_s3_env_credentials,\n        test_data_load_error,\n  \
          \      test_data_source_uri,\n        validate_s3_env_credentials,\n   \
          \     validate_test_data_params,\n    )\n\n    logger = logging.getLogger(__name__)\n\
          \n    def _log_dataset_stats(name, df):\n        \"\"\"Log the size of a\
          \ dataframe: rows, columns, and in-memory bytes.\n\n        ``memory_usage(deep=True)``\
          \ reports the pandas in-memory footprint, which\n        differs from the\
          \ on-disk CSV size; it is the figure that matters for the\n        sampling\
          \ budget and the pod memory limit.\n        \"\"\"\n        try:\n     \
          \       n_rows = len(df)\n            n_cols = df.shape[1] if hasattr(df,\
          \ \"shape\") else len(df.columns)\n            n_bytes = int(df.memory_usage(deep=True).sum())\n\
          \            logger.info(\n                \"Dataset stats [%s]: rows=%s,\
          \ columns=%s, size=%s bytes (%.2f MB)\",\n                name,\n      \
          \          n_rows,\n                n_cols,\n                n_bytes,\n\
          \                n_bytes / (1024**2),\n            )\n        except Exception\
          \ as e:  # noqa: BLE001 - stats logging must never break the run\n     \
          \       logger.debug(\"Could not compute dataset stats for %s: %s\", name,\
          \ e)\n\n    VALID_PRESETS = {\"speed\", \"balanced\"}\n    # Sampling budget\
          \ per quality tier: \"speed\" stays small for fast runs,\n    # \"balanced\"\
          \ allows the full supported dataset size.\n    PRESET_MAX_SIZE_BYTES = {\n\
          \        \"speed\": 100 * 1024 * 1024,  # 100 MB\n        \"balanced\":\
          \ 1024 * 1024 * 1024,  # 1 GB\n    }\n    TEST_DATA_MAX_SIZE_BYTES = 50\
          \ * 1024 * 1024  # 50 MB \u2014 smaller cap for user-provided holdout sets\n\
          \    MIN_VALID_RECORDS_AFTER_CLEANSING = 100\n    PANDAS_CHUNK_SIZE = 10000\
          \  # Rows per batch for streaming read\n    DEFAULT_RANDOM_STATE = 42\n\
          \    VALID_SAMPLING_METHODS = {\"first_n_rows\", \"stratified\", \"random\"\
          }\n    VALID_TASK_TYPES = {\"binary\", \"multiclass\", \"regression\"}\n\
          \n    if preset not in VALID_PRESETS:\n        raise ValueError(f\"preset\
          \ must be one of {sorted(VALID_PRESETS)}; got {preset!r}.\")\n    MAX_SIZE_BYTES\
          \ = PRESET_MAX_SIZE_BYTES[preset]\n\n    # Input validation\n    for param,\
          \ value in (\n        (\"bucket_name\", bucket_name),\n        (\"file_key\"\
          , file_key),\n        (\"workspace_path\", workspace_path),\n        (\"\
          label_column\", label_column),\n    ):\n        if not isinstance(value,\
          \ str) or not value.strip():\n            raise ValueError(f\"{param} must\
          \ be a non-empty string.\")\n\n    if task_type not in VALID_TASK_TYPES:\n\
          \        raise ValueError(f\"task_type must be one of {VALID_TASK_TYPES};\
          \ got {task_type!r}.\")\n    if split_config is not None and not isinstance(split_config,\
          \ dict):\n        raise ValueError(\"split_config must be a dictionary with\
          \ possible keys test_size, random_state, stratify.\")\n    if isinstance(split_config,\
          \ dict):\n        test_size = split_config.get(\"test_size\")\n        if\
          \ test_size is not None and (not isinstance(test_size, (int, float)) or\
          \ test_size <= 0 or test_size >= 1):\n            raise ValueError(\"split_config['test_size']\
          \ must be a number in (0, 1) when provided.\")\n        random_state = split_config.get(\"\
          random_state\")\n        if random_state is not None and (not isinstance(random_state,\
          \ int)):\n            raise ValueError(\"split_config['random_state'] must\
          \ be an integer when provided.\")\n        stratify = split_config.get(\"\
          stratify\")\n        if stratify is not None and not isinstance(stratify,\
          \ bool):\n            raise ValueError(\"split_config['stratify'] must be\
          \ a boolean when provided.\")\n    if not isinstance(selection_train_size,\
          \ (int, float)):\n        raise ValueError(\"selection_train_size must be\
          \ a numerical value.\")\n    elif selection_train_size <= 0 or selection_train_size\
          \ >= 1:\n        raise ValueError(\"selection_train_size must be in a range\
          \ 0 to 1.\")\n\n    test_data_bucket_name, test_data_file_key = validate_test_data_params(test_data_bucket_name,\
          \ test_data_file_key)\n\n    # Initialize status tracker\n    status = ComponentStatusTracker(component_status.path,\
          \ \"automl_data_loader\")\n    with status:\n        status.set_metadata(display_name=\"\
          Data Loader Status\")\n        component_status.metadata[\"display_name\"\
          ] = \"Data Loader Status\"\n        status.record(\"prepare_data\", \"started\"\
          )\n\n        logger.info(\n            \"Sampling size budget: preset=%s,\
          \ max_size=%s bytes (%.0f MB)\",\n            preset,\n            MAX_SIZE_BYTES,\n\
          \            MAX_SIZE_BYTES / (1024**2),\n        )\n\n        if sampling_method\
          \ is None:\n            if task_type in (\"binary\", \"multiclass\"):\n\
          \                sampling_method = \"stratified\"\n            else:\n \
          \               sampling_method = \"random\"\n            logger.info(\"\
          Sampling method derived from task_type=%s: using %s\", task_type, sampling_method)\n\
          \        else:\n            if sampling_method not in VALID_SAMPLING_METHODS:\n\
          \                raise ValueError(\n                    f\"sampling_method\
          \ must be one of {VALID_SAMPLING_METHODS} or None; got {sampling_method!r}.\"\
          \n                )\n            if sampling_method == \"stratified\" and\
          \ task_type not in (\"binary\", \"multiclass\"):\n                raise\
          \ ValueError(\n                    \"Stratified sampling is only available\
          \ when task_type is \"\n                    \"'binary' or 'multiclass' (classification\
          \ tasks). \"\n                    f\"Got task_type='{task_type}'.\"\n  \
          \              )\n            logger.info(\"Performing sampling: method=%s\"\
          , sampling_method)\n\n        def get_s3_client(verify=True):\n        \
          \    \"\"\"Create and return an S3 client using credentials from environment\
          \ variables.\"\"\"\n            credentials = resolve_s3_env_credentials()\n\
          \            validate_s3_env_credentials(credentials)\n\n            return\
          \ boto3.client(\n                \"s3\",\n                endpoint_url=credentials[\"\
          endpoint_url\"],\n                region_name=credentials[\"region_name\"\
          ],\n                aws_access_key_id=credentials[\"access_key\"],\n   \
          \             aws_secret_access_key=credentials[\"secret_key\"],\n     \
          \           verify=verify,\n            )\n\n        def _sample_first_n_rows(\n\
          \            text_stream, chunk_size, max_size_bytes, truncation_report=None,\
          \ fail_on_partial_read=False\n        ):\n            \"\"\"Take rows from\
          \ the start of the stream until the size limit is reached.\n\n         \
          \   When ``truncation_report`` is a dict, its ``\"truncated\"`` key is set\
          \ to True if\n            the size limit stopped the read before the stream\
          \ was exhausted. The signal is\n            conservative: a stream whose\
          \ rows add up to exactly ``max_size_bytes`` is also\n            reported,\
          \ since the read stops without proving no rows follow.\n\n            ``fail_on_partial_read``\
          \ makes a mid-stream error fatal instead of returning the\n            rows\
          \ read so far. Test data must fail closed: a partial holdout set would be\n\
          \            scored as if it were complete.\n            \"\"\"\n      \
          \      chunk_list = []\n            accumulated_size = 0\n\n           \
          \ def _mark_truncated():\n                if truncation_report is not None:\n\
          \                    truncation_report[\"truncated\"] = True\n\n       \
          \     try:\n                for chunk_df in pd.read_csv(text_stream, chunksize=chunk_size):\n\
          \                    chunk_memory = chunk_df.memory_usage(deep=True).sum()\n\
          \n                    if accumulated_size + chunk_memory > max_size_bytes:\n\
          \                        _mark_truncated()\n                        remaining_bytes\
          \ = max_size_bytes - accumulated_size\n                        if remaining_bytes\
          \ <= 0:\n                            # No remaining budget; do not take\
          \ any more rows\n                            break\n                   \
          \     bytes_per_row = chunk_memory / len(chunk_df) if len(chunk_df) > 0\
          \ else 0\n                        if bytes_per_row > 0:\n              \
          \              rows_to_take = int(remaining_bytes / bytes_per_row)\n   \
          \                         if rows_to_take > 0:\n                       \
          \         chunk_df = chunk_df.head(rows_to_take)\n                     \
          \           chunk_list.append(chunk_df)\n                        break\n\
          \n                    chunk_list.append(chunk_df)\n                    accumulated_size\
          \ += chunk_memory\n\n                    if accumulated_size >= max_size_bytes:\n\
          \                        _mark_truncated()\n                        break\n\
          \            except Exception as e:\n                if not chunk_list or\
          \ fail_on_partial_read:\n                    raise ValueError(f\"Error reading\
          \ CSV from S3: {str(e)}\") from e\n                logger.warning(\"Partial\
          \ CSV read, keeping the %s chunk(s) read so far: %s\", len(chunk_list),\
          \ e)\n                _mark_truncated()\n\n            return pd.concat(chunk_list,\
          \ ignore_index=True) if chunk_list else pd.DataFrame()\n\n        def _sample_stratified(text_stream,\
          \ chunk_size, max_size_bytes, label_column):\n            \"\"\"Merge batches\
          \ and subsample proportionally by target column to stay under the size limit.\"\
          \"\"\n            subsampled_data = None\n\n            try:\n         \
          \       for chunk_df in pd.read_csv(text_stream, chunksize=chunk_size):\n\
          \                    if label_column not in chunk_df.columns:\n        \
          \                raise ValueError(\n                            f\"Target\
          \ column '{label_column}' not found in the dataset. \"\n               \
          \             f\"Available columns: {list(chunk_df.columns)}\"\n       \
          \                 )\n                    chunk_df = chunk_df.dropna(subset=[label_column])\n\
          \                    if chunk_df.empty:\n                        continue\n\
          \n                    combined_data = (\n                        pd.concat([subsampled_data,\
          \ chunk_df], ignore_index=True)\n                        if subsampled_data\
          \ is not None\n                        else chunk_df\n                 \
          \   )\n                    combined_memory = combined_data.memory_usage(deep=True).sum()\n\
          \n                    if combined_memory <= max_size_bytes:\n          \
          \              subsampled_data = combined_data\n                    else:\n\
          \                        sampling_frac = max_size_bytes / combined_memory\n\
          \                        subsampled_data = (\n                         \
          \   combined_data.groupby(label_column, group_keys=False)\n            \
          \                .apply(lambda x: x.sample(frac=sampling_frac, random_state=DEFAULT_RANDOM_STATE))\n\
          \                            .reset_index(drop=True)\n                 \
          \       )\n\n            except Exception as e:\n                logger.debug(\"\
          Error reading CSV and stratified sampling: %s\", e, exc_info=True)\n   \
          \             if subsampled_data is None or subsampled_data.empty:\n   \
          \                 raise ValueError(f\"Error reading CSV from S3: {str(e)}\"\
          ) from e\n\n            if subsampled_data is None:\n                return\
          \ pd.DataFrame()\n            return subsampled_data.sample(frac=1, random_state=DEFAULT_RANDOM_STATE).reset_index(drop=True)\n\
          \n        def _sample_random(text_stream, chunk_size, max_size_bytes):\n\
          \            \"\"\"Iterate all batches, merge with accumulated data, randomly\
          \ subsample when over the limit.\"\"\"\n            subsampled_data = None\n\
          \n            try:\n                for chunk_df in pd.read_csv(text_stream,\
          \ chunksize=chunk_size):\n                    data = (\n               \
          \         pd.concat([subsampled_data, chunk_df], ignore_index=True)\n  \
          \                      if subsampled_data is not None\n                \
          \        else chunk_df\n                    )\n                    combined_memory\
          \ = data.memory_usage(deep=True).sum()\n\n                    if combined_memory\
          \ <= max_size_bytes:\n                        subsampled_data = data\n \
          \                   else:\n                        sampling_frac = max_size_bytes\
          \ / combined_memory\n                        subsampled_data = data.sample(\n\
          \                            frac=sampling_frac, random_state=DEFAULT_RANDOM_STATE\n\
          \                        ).reset_index(drop=True)\n\n                return\
          \ subsampled_data if subsampled_data is not None else pd.DataFrame()\n\n\
          \            except Exception as e:\n                if subsampled_data\
          \ is None or subsampled_data.empty:\n                    raise ValueError(f\"\
          Error reading CSV from S3: {str(e)}\") from e\n                return subsampled_data\n\
          \n        def load_data_in_batches(\n            s3_client,\n          \
          \  bucket_name,\n            file_key,\n            max_size_bytes,\n  \
          \          sampling_method,\n            label_column,\n            truncation_report=None,\n\
          \            fail_on_partial_read: bool = False,\n        ):\n         \
          \   \"\"\"Load CSV from S3 in batches and return a sampled dataframe using\
          \ the chosen strategy.\n\n            ``truncation_report`` is only honoured\
          \ by the ``first_n_rows`` strategy; the\n            subsampling strategies\
          \ keep a representative sample of the whole stream.\n\n            ``fail_on_partial_read``\
          \ makes a mid-stream read error fatal instead of returning\n           \
          \ a partial dataframe.\n            \"\"\"\n            from botocore.exceptions\
          \ import SSLError\n\n            if sampling_method == \"stratified\" and\
          \ label_column is None:\n                raise ValueError(\"label_column\
          \ must be provided when sampling_method='stratified'\")\n\n            try:\n\
          \                response = s3_client.get_object(Bucket=bucket_name, Key=file_key)\n\
          \            except SSLError:\n                logger.warning(\n       \
          \             \"SSL error when downloading s3://%s/%s, retrying with verify=False\"\
          ,\n                    bucket_name,\n                    file_key,\n   \
          \             )\n                no_verify_client = get_s3_client(verify=False)\n\
          \                response = no_verify_client.get_object(Bucket=bucket_name,\
          \ Key=file_key)\n            text_stream = io.TextIOWrapper(response[\"\
          Body\"], encoding=\"utf-8\")\n\n            if sampling_method == \"stratified\"\
          :\n                return _sample_stratified(text_stream, PANDAS_CHUNK_SIZE,\
          \ max_size_bytes, label_column)\n            if sampling_method == \"random\"\
          :\n                return _sample_random(text_stream, PANDAS_CHUNK_SIZE,\
          \ max_size_bytes)\n            return _sample_first_n_rows(\n          \
          \      text_stream,\n                PANDAS_CHUNK_SIZE,\n              \
          \  max_size_bytes,\n                truncation_report=truncation_report,\n\
          \                fail_on_partial_read=fail_on_partial_read,\n          \
          \  )\n\n        status.record(\n            \"prepare_data\",\n        \
          \    \"running\",\n            metrics={\"sampling_method\": sampling_method,\
          \ \"source\": f\"s3://{bucket_name}/{file_key}\"},\n        )\n        s3_client\
          \ = get_s3_client()\n        sampled_dataframe = load_data_in_batches(\n\
          \            s3_client,\n            bucket_name,\n            file_key,\n\
          \            max_size_bytes=MAX_SIZE_BYTES,\n            sampling_method=sampling_method,\n\
          \            label_column=label_column,\n        )\n\n        if label_column\
          \ not in sampled_dataframe.columns:\n            raise ValueError(\n   \
          \             f\"Label column {label_column!r} not found in the dataset.\
          \ \"\n                f\"Available columns: {list(sampled_dataframe.columns)}\"\
          \n            )\n\n        sampled_dataframe.replace([math.inf, -math.inf],\
          \ float(\"nan\"), inplace=True)\n\n        n_before_dedup = len(sampled_dataframe)\n\
          \        sampled_dataframe.drop_duplicates(inplace=True)\n        n_dup_dropped\
          \ = n_before_dedup - len(sampled_dataframe)\n        if n_dup_dropped:\n\
          \            logger.info(\"Dropped %s full-row duplicate(s) (%s rows remaining).\"\
          , n_dup_dropped, len(sampled_dataframe))\n\n        if sampled_dataframe.empty:\n\
          \            raise ValueError(\n                \"No valid data rows remain\
          \ after replacing infinite values and dropping duplicates. \"\n        \
          \        \"The source CSV may contain only infinite/NaN values or duplicate\
          \ rows.\"\n            )\n\n        n_before_drop = len(sampled_dataframe)\n\
          \        sampled_dataframe = sampled_dataframe.dropna(subset=[label_column])\n\
          \        n_dropped = n_before_drop - len(sampled_dataframe)\n        if\
          \ n_dropped:\n            logger.info(\n                \"Dropped %s row(s)\
          \ with missing label in column %r before splitting (loaded %s rows, %s remaining).\"\
          ,\n                n_dropped,\n                label_column,\n         \
          \       n_before_drop,\n                len(sampled_dataframe),\n      \
          \      )\n        if sampled_dataframe.empty:\n            raise ValueError(\n\
          \                f\"No rows remain after removing missing values in label\
          \ column {label_column!r}. \"\n                \"Ensure the dataset has\
          \ at least one row with a non-null label (e.g. empty cells in the target\
          \ column).\"\n            )\n\n        n_valid = len(sampled_dataframe)\n\
          \        if n_valid < MIN_VALID_RECORDS_AFTER_CLEANSING:\n            raise\
          \ ValueError(\n                f\"After data cleansing, only {n_valid} valid\
          \ record(s) remain; \"\n                f\"at least {MIN_VALID_RECORDS_AFTER_CLEANSING}\
          \ are required for AutoML training. \"\n                \"Provide a larger\
          \ dataset or reduce missing labels, duplicates, and invalid values.\"\n\
          \            )\n\n        n_samples = n_valid\n        logger.info(\n  \
          \          \"Read %d rows from s3://%s/%s (sampling_method=%s)\",\n    \
          \        n_samples,\n            bucket_name,\n            file_key,\n \
          \           sampling_method,\n        )\n        _log_dataset_stats(\"loaded\
          \ (after cleansing)\", sampled_dataframe)\n        status.record(\n    \
          \        \"prepare_data\",\n            \"completed\",\n            metrics={\"\
          rows\": n_samples, \"duplicates_dropped\": n_dup_dropped, \"labels_dropped\"\
          : n_dropped},\n        )\n\n        status.record(\"split_and_export\",\
          \ \"started\")\n\n        # --- Train/test split ---\n        from pathlib\
          \ import Path\n\n        from sklearn.model_selection import train_test_split\n\
          \n        DEFAULT_TEST_SIZE = 0.2\n        DEFAULT_SPLIT_RANDOM_STATE =\
          \ 42\n\n        split_config = split_config or {}\n        test_size = split_config.get(\"\
          test_size\", DEFAULT_TEST_SIZE)\n        random_state = split_config.get(\"\
          random_state\", DEFAULT_SPLIT_RANDOM_STATE)\n\n        if not sampled_test_dataset.uri\
          \ or not sampled_test_dataset.uri.endswith(\".csv\"):\n            sampled_test_dataset.uri\
          \ = (sampled_test_dataset.uri or \"sampled_test_dataset\") + \".csv\"\n\n\
          \        # Common setup: workspace directory and stratification flag\n \
          \       datasets_dir = Path(workspace_path) / \"datasets\"\n        datasets_dir.mkdir(parents=True,\
          \ exist_ok=True)\n        stratify_effective = task_type != \"regression\"\
          \ and split_config.get(\"stratify\", True)\n\n        has_user_test_data\
          \ = bool(test_data_file_key)\n\n        if has_user_test_data:\n       \
          \     test_data_source = test_data_source_uri(test_data_bucket_name, test_data_file_key)\n\
          \n            # Download user test data from S3 (AC5: distinguishable error\
          \ message)\n            truncation_report = {}\n            test_s3_client\
          \ = get_s3_client()\n            try:\n                user_test_df = load_data_in_batches(\n\
          \                    test_s3_client,\n                    test_data_bucket_name,\n\
          \                    test_data_file_key,\n                    max_size_bytes=TEST_DATA_MAX_SIZE_BYTES,\n\
          \                    sampling_method=\"first_n_rows\",\n               \
          \     label_column=label_column,\n                    truncation_report=truncation_report,\n\
          \                    fail_on_partial_read=True,\n                )\n   \
          \         except Exception as e:\n                raise test_data_load_error(test_data_source,\
          \ e) from e\n\n            # Validate test data is non-empty (AC4)\n   \
          \         raise_if_test_data_empty(len(user_test_df), test_data_source)\n\
          \n            if truncation_report.get(\"truncated\"):\n               \
          \ report_test_data_truncation(\n                    status, logger, test_data_source,\
          \ len(user_test_df), TEST_DATA_MAX_SIZE_BYTES\n                )\n\n   \
          \         # Validate label column exists in test data\n            if label_column\
          \ not in user_test_df.columns:\n                raise ValueError(\n    \
          \                f\"Label column {label_column!r} not found in test dataset.\
          \ \"\n                    f\"Available columns: {list(user_test_df.columns)}\"\
          \n                )\n\n            # Fail fast on a train/test schema mismatch:\
          \ AutoGluon would otherwise only\n            # surface it inside predict/evaluate,\
          \ after the full fit has already run.\n            train_feature_columns\
          \ = [c for c in sampled_dataframe.columns if c != label_column]\n      \
          \      test_columns = set(user_test_df.columns)\n            missing_features\
          \ = [c for c in train_feature_columns if c not in test_columns]\n      \
          \      if missing_features:\n                raise ValueError(\n       \
          \             f\"Test dataset is missing feature column(s) present in the\
          \ training data: \"\n                    f\"{missing_features}. Test data\
          \ columns: {list(user_test_df.columns)}. \"\n                    \"Provide\
          \ a test dataset with the same feature columns as the training data.\"\n\
          \                )\n            extra_features = [c for c in user_test_df.columns\
          \ if c != label_column and c not in train_feature_columns]\n           \
          \ if extra_features:\n                logger.warning(\n                \
          \    \"Test dataset has column(s) not present in the training data: %s.\
          \ \"\n                    \"They are dropped before evaluation.\",\n   \
          \                 extra_features,\n                )\n                #\
          \ Drop rather than carry: these columns would otherwise reach the\n    \
          \            # sampled_test_dataset artifact and the notebook sample payload\
          \ built from\n                # user_test_df.head(1), advertising features\
          \ the predictor cannot accept.\n                user_test_df = user_test_df.drop(columns=extra_features)\n\
          \n            # Apply same cleansing as training data\n            user_test_df.replace([math.inf,\
          \ -math.inf], float(\"nan\"), inplace=True)\n            user_test_df.drop_duplicates(inplace=True)\n\
          \            user_test_df = user_test_df.dropna(subset=[label_column])\n\
          \n            if user_test_df.empty:\n                raise ValueError(\n\
          \                    \"Test dataset has no valid rows after cleansing \"\
          \n                    \"(infinite value replacement, duplicate removal,\
          \ label NaN drop). \"\n                    f\"Source: {test_data_source}.\"\
          \n                )\n\n            # Write user test data to the sampled_test_dataset\
          \ artifact\n            user_test_df.to_csv(sampled_test_dataset.path, index=False)\n\
          \n            # Skip primary holdout -- use all sampled training rows for\
          \ the secondary split.\n            selection_X = sampled_dataframe.drop(columns=[label_column],\
          \ inplace=False)\n            selection_y = sampled_dataframe[label_column]\n\
          \            test_sample_df = user_test_df\n            effective_test_size\
          \ = 0.0\n\n        else:\n            X = sampled_dataframe.drop(columns=[label_column],\
          \ inplace=False)\n            y = sampled_dataframe[label_column]\n\n  \
          \          X_train, X_test, y_train, y_test = train_test_split(\n      \
          \          X,\n                y,\n                test_size=test_size,\n\
          \                stratify=(y if stratify_effective else None),\n       \
          \         random_state=random_state,\n            )\n\n            selection_X\
          \ = X_train\n            selection_y = y_train\n            test_sample_df\
          \ = pd.concat([X_test, y_test], axis=1)\n            test_sample_df.to_csv(sampled_test_dataset.path,\
          \ index=False)\n            effective_test_size = test_size\n\n        X_sel,\
          \ X_extra, y_sel, y_extra = train_test_split(\n            selection_X,\n\
          \            selection_y,\n            test_size=(1 - selection_train_size),\n\
          \            stratify=(selection_y if stratify_effective else None),\n \
          \           random_state=random_state,\n        )\n\n        X_y_sel = pd.concat([X_sel,\
          \ y_sel], axis=1)\n        X_y_extra = pd.concat([X_extra, y_extra], axis=1)\n\
          \n        _log_dataset_stats(\"split: selection_train\", X_y_sel)\n    \
          \    _log_dataset_stats(\"split: extra_train\", X_y_extra)\n        _log_dataset_stats(\n\
          \            \"split: test (user-provided)\" if has_user_test_data else\
          \ \"split: test\",\n            test_sample_df,\n        )\n\n        if\
          \ len(X_y_sel) == 0:\n            raise ValueError(\n                \"\
          Secondary split produced an empty selection-train dataset; \"\n        \
          \        \"models_selection_train_dataset.csv would be empty and downstream\
          \ training would fail. \"\n                \"Increase training data size\
          \ and/or selection_train_size.\"\n            )\n\n        sample_row =\
          \ test_sample_df.head(1).to_json(orient=\"records\")\n\n        split_config_out\
          \ = {\n            \"test_size\": effective_test_size,\n            \"random_state\"\
          : random_state,\n            \"stratify\": stratify_effective,\n       \
          \ }\n\n        # Common post-split: write selection-train and extra-train\
          \ CSVs to workspace\n        models_selection_train_data_path = str(datasets_dir\
          \ / \"models_selection_train_dataset.csv\")\n        extra_train_data_path\
          \ = str(datasets_dir / \"extra_train_dataset.csv\")\n        X_y_sel.to_csv(models_selection_train_data_path,\
          \ index=False)\n        X_y_extra.to_csv(extra_train_data_path, index=False)\n\
          \n        split_export_metrics = {\n            \"test_size\": split_config_out[\"\
          test_size\"],\n            \"selection_train_size\": selection_train_size,\n\
          \            \"stratify\": stratify_effective,\n        }\n        if has_user_test_data:\n\
          \            split_export_metrics[\"user_test_source\"] = test_data_source\n\
          \            split_export_metrics[\"test_rows\"] = len(user_test_df)\n \
          \           split_export_metrics[\"truncated\"] = bool(truncation_report.get(\"\
          truncated\"))\n\n        status.record(\"split_and_export\", \"completed\"\
          , metrics=split_export_metrics)\n\n        return NamedTuple(\n        \
          \    \"outputs\",\n            sample_config=dict,\n            split_config=dict,\n\
          \            sample_row=str,\n            models_selection_train_data_path=str,\n\
          \            extra_train_data_path=str,\n        )(\n            sample_config={\"\
          n_samples\": n_samples},\n            split_config=split_config_out,\n \
          \           sample_row=sample_row,\n            models_selection_train_data_path=models_selection_train_data_path,\n\
          \            extra_train_data_path=extra_train_data_path,\n        )\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
    exec-publish-component-stage-map:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - publish_component_stage_map
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef publish_component_stage_map(\n    pipeline_id: str,\n    run_id:\
          \ str,\n    component_stage_map: dsl.Output[dsl.Artifact],\n) -> None:\n\
          \    \"\"\"Publish the component-to-stage-to-step map for dashboard consumption.\n\
          \n    Reads the static JSON template from the package (``run_status_templates/pipelines/``)\n\
          \    and publishes it as a KFP artifact. Dashboards use this map to show\
          \ expected\n    components, stages, and steps before pipeline execution\
          \ begins.\n\n    Args:\n        pipeline_id: Pipeline identifier matching\
          \ the template filename\n            (e.g. ``autogluon-tabular-training-pipeline``).\n\
          \        run_id: KFP run ID for tracking (from ``dsl.PIPELINE_JOB_ID_PLACEHOLDER``).\n\
          \        component_stage_map: Output artifact containing the component-to-stage-to-step\
          \ map.\n\n    Raises:\n        FileNotFoundError: If the template for ``pipeline_id``\
          \ is missing or empty.\n        ValueError: If ``pipeline_id`` or ``run_id``\
          \ is empty.\n\n    Example:\n        map_task = publish_component_stage_map(\n\
          \            pipeline_id=\"autogluon-tabular-training-pipeline\",\n    \
          \        run_id=dsl.PIPELINE_JOB_ID_PLACEHOLDER,\n        )\n    \"\"\"\n\
          \    import json\n    import os\n    from datetime import UTC, datetime\n\
          \    from pathlib import Path\n\n    from kfp_components.components.training.automl.shared.run_status\
          \ import (\n        load_pipeline_run_status_manifest,\n    )\n\n    def\
          \ _build_mlflow_stage_map_block() -> dict:\n        \"\"\"Build the ``mlflow``\
          \ block from the platform-injected ``KFP_MLFLOW_CONFIG`` blob.\n\n     \
          \   Inlined so the publisher does not depend on ``shared/mlflow_tracking.py``\
          \ being\n        installed in the runtime image (mirrors ``build_mlflow_stage_map_block``\
          \ there).\n        \"\"\"\n        raw = os.getenv(\"KFP_MLFLOW_CONFIG\"\
          , \"\").strip()\n        if not raw:\n            return {\"tracking_enabled\"\
          : False}\n        try:\n            data = json.loads(raw)\n        except\
          \ json.JSONDecodeError:\n            return {\"tracking_enabled\": False}\n\
          \        if not isinstance(data, dict):\n            return {\"tracking_enabled\"\
          : False}\n\n        tracking_uri = str(data.get(\"endpoint\", \"\")).strip()\n\
          \        if not tracking_uri:\n            return {\"tracking_enabled\"\
          : False}\n\n        block: dict = {\"tracking_enabled\": True, \"tracking_uri\"\
          : tracking_uri}\n        experiment_id = str(data.get(\"experimentId\",\
          \ \"\")).strip()\n        if experiment_id:\n            block[\"experiment_id\"\
          ] = experiment_id\n        parent_run_id = str(data.get(\"parentRunId\"\
          , \"\")).strip()\n        if parent_run_id:\n            block[\"run_id\"\
          ] = parent_run_id\n        workspace = str(data.get(\"workspace\", \"\"\
          )).strip() if data.get(\"workspacesEnabled\") else \"\"\n        if workspace:\n\
          \            block[\"workspace\"] = workspace\n        if experiment_id\
          \ and parent_run_id:\n            base = tracking_uri.rstrip(\"/\")\n  \
          \          block[\"run_url\"] = f\"{base}/#/experiments/{experiment_id}/runs/{parent_run_id}\"\
          \n        return block\n\n    if not isinstance(pipeline_id, str) or not\
          \ pipeline_id.strip():\n        raise ValueError(\"pipeline_id must be a\
          \ non-empty string\")\n    if not isinstance(run_id, str) or not run_id.strip():\n\
          \        raise ValueError(\"run_id must be a non-empty string\")\n\n   \
          \ stage_map = load_pipeline_run_status_manifest(pipeline_id)\n    # Legacy\
          \ templates may include an empty initial_document shell; not part of the\
          \ stage map.\n    stage_map.pop(\"initial_document\", None)\n    if not\
          \ stage_map.get(\"components\"):\n        raise FileNotFoundError(\n   \
          \         f\"Component stage map not found or empty for pipeline_id='{pipeline_id}'.\
          \ \"\n            \"Ensure run_status_templates/pipelines/<pipeline_id>.json\
          \ is packaged in the AutoML image.\"\n        )\n\n    stage_map[\"kfp_run_id\"\
          ] = run_id\n    stage_map[\"published_at\"] = datetime.now(UTC).isoformat().replace(\"\
          +00:00\", \"Z\")\n    stage_map[\"mlflow\"] = _build_mlflow_stage_map_block()\n\
          \n    output_path = Path(component_stage_map.path)\n    output_path.mkdir(parents=True,\
          \ exist_ok=True)\n\n    output_file = output_path / \"component_stage_map.json\"\
          \n    with output_file.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump(stage_map,\
          \ f, indent=2)\n\n    component_stage_map.metadata[\"display_name\"] = \"\
          Component Stage Map\"\n    component_stage_map.metadata[\"pipeline_id\"\
          ] = pipeline_id\n    component_stage_map.metadata[\"component_count\"] =\
          \ len(stage_map.get(\"components\", []))\n    mlflow_block = stage_map[\"\
          mlflow\"]\n    component_stage_map.metadata[\"mlflow_tracking_enabled\"\
          ] = str(mlflow_block.get(\"tracking_enabled\", False))\n\n    component_count\
          \ = len(stage_map.get(\"components\", []))\n    stage_count = sum(len(c.get(\"\
          stages\", [])) for c in stage_map.get(\"components\", []))\n    print(f\"\
          Published component stage map for pipeline_id='{pipeline_id}':\")\n    print(f\"\
          \  - Components: {component_count}\")\n    print(f\"  - Total stages: {stage_count}\"\
          )\n    print(f\"  - Published to: {output_file}\")\n    print(f\"  - MLflow\
          \ tracking enabled: {mlflow_block.get('tracking_enabled', False)}\")\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.5
          memoryLimit: 1.073741824
          memoryRequest: 0.536870912
          resourceCpuLimit: '1'
          resourceCpuRequest: '0.5'
          resourceMemoryLimit: 1Gi
          resourceMemoryRequest: 512Mi
pipelineInfo:
  description: AutoML tabular training pipeline for building high-quality models on
    structured data with minimal effort. Powered by AutoGluon, it automates discovery,
    ensembling, and selection, then refits top candidates for maximum accuracy. Delivers
    production-ready predictors, clear metrics, and a ranked leaderboard to choose
    the best deployment option.
  name: autogluon-tabular-training-pipeline
root:
  dag:
    tasks:
      automl-data-loader:
        cachingOptions: {}
        componentRef:
          name: comp-automl-data-loader
        dependentTasks:
        - publish-component-stage-map
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: train_data_bucket_name
            file_key:
              componentInputParameter: train_data_file_key
            label_column:
              componentInputParameter: label_column
            preset:
              componentInputParameter: preset
            task_type:
              componentInputParameter: task_type
            test_data_bucket_name:
              componentInputParameter: test_data_bucket_name
            test_data_file_key:
              componentInputParameter: test_data_file_key
            workspace_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
        taskInfo:
          name: automl-data-loader
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - automl-data-loader
        inputs:
          artifacts:
            pipelinechannel--automl-data-loader-sampled_test_dataset:
              taskOutputArtifact:
                outputArtifactKey: sampled_test_dataset
                producerTask: automl-data-loader
          parameters:
            pipelinechannel--automl-data-loader-extra_train_data_path:
              taskOutputParameter:
                outputParameterKey: extra_train_data_path
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-models_selection_train_data_path:
              taskOutputParameter:
                outputParameterKey: models_selection_train_data_path
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-sample_config:
              taskOutputParameter:
                outputParameterKey: sample_config
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-sample_row:
              taskOutputParameter:
                outputParameterKey: sample_row
                producerTask: automl-data-loader
            pipelinechannel--automl-data-loader-split_config:
              taskOutputParameter:
                outputParameterKey: split_config
                producerTask: automl-data-loader
            pipelinechannel--eval_metric:
              componentInputParameter: eval_metric
            pipelinechannel--label_column:
              componentInputParameter: label_column
            pipelinechannel--positive_class:
              componentInputParameter: positive_class
            pipelinechannel--preset:
              componentInputParameter: preset
            pipelinechannel--task_type:
              componentInputParameter: task_type
            pipelinechannel--test_data_bucket_name:
              componentInputParameter: test_data_bucket_name
            pipelinechannel--test_data_file_key:
              componentInputParameter: test_data_file_key
            pipelinechannel--top_n:
              componentInputParameter: top_n
            pipelinechannel--train_data_bucket_name:
              componentInputParameter: train_data_bucket_name
            pipelinechannel--train_data_file_key:
              componentInputParameter: train_data_file_key
            pipelinechannel--train_data_secret_name:
              componentInputParameter: train_data_secret_name
        taskInfo:
          name: condition-branches-1
      publish-component-stage-map:
        cachingOptions: {}
        componentRef:
          name: comp-publish-component-stage-map
        inputs:
          parameters:
            pipeline_id:
              runtimeValue:
                constant: autogluon-tabular-training-pipeline
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: publish-component-stage-map
  inputDefinitions:
    parameters:
      eval_metric:
        defaultValue: ''
        description: Metric used for model ranking. Empty string (default) is resolved
          by the component to "r2" for regression and "accuracy" for binary and multiclass
          classification.
        isOptional: true
        parameterType: STRING
      label_column:
        description: Name of the target/label column in the dataset.
        parameterType: STRING
      positive_class:
        defaultValue: ''
        description: Optional label value for the positive class in binary classification.
          Defaults to the second unique class after sorting label values.
        isOptional: true
        parameterType: STRING
      preset:
        defaultValue: speed
        description: Training quality tier. "speed" (default, 4 vCPU / 16 GiB) or
          "balanced" (may run more than 2x longer, 8 vCPU / 32 GiB).
        isOptional: true
        parameterType: STRING
      task_type:
        description: '"binary", "multiclass", or "regression"; drives metrics and
          model types.'
        parameterType: STRING
      test_data_bucket_name:
        defaultValue: ''
        description: 'Optional S3-compatible bucket name for a user-provided test
          dataset.

          Default: empty string (use the holdout split from training data).'
        isOptional: true
        parameterType: STRING
      test_data_file_key:
        defaultValue: ''
        description: 'Optional S3 object key for a user-provided test CSV file.

          Default: empty string (use the holdout split from training data).'
        isOptional: true
        parameterType: STRING
      top_n:
        defaultValue: 3.0
        description: 'Number of top models to select and refit (default: 3); positive
          integer from range [1, 10].'
        isOptional: true
        parameterType: NUMBER_INTEGER
      train_data_bucket_name:
        description: S3-compatible bucket name containing the tabular data file.
        parameterType: STRING
      train_data_file_key:
        description: S3 object key of the CSV file (features and target column).
        parameterType: STRING
      train_data_secret_name:
        description: 'Kubernetes secret name with S3 credentials (AWS_ACCESS_KEY_ID,

          AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_DEFAULT_REGION). Used for training
          data

          and optional user-provided external test data.'
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-automl-data-loader:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: true
            secretNameParameter:
              componentInputParameter: train_data_secret_name
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteOnce
        size: 12Gi
