          \ = str(leaderboard_df.iloc[0][\"model\"])\n        leaderboard_df.index\
          \ = pd.RangeIndex(start=1, stop=n + 1, name=\"rank\")\n        _metric_cols\
          \ = [c for c in leaderboard_df.columns if c not in (\"model\", \"notebook\"\
