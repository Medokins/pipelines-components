            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Combined models artifact from training with ``metadata["model_names"]``.
      parameters:
        eval_metric:
          description: Metric used for ranking (e.g. ``accuracy``, ``MASE``).
          parameterType: STRING
        log_model_artifacts:
          defaultValue: true
          description: When True, upload each model's predictor (model.pkl) and notebook.
          isOptional: true
          parameterType: BOOLEAN
        model_registry_name:
          defaultValue: ''
          description: Registered-model name to use when ``register_best_model`` is
            True.
          isOptional: true
          parameterType: STRING
        pipeline_name:
          description: 'Stable pipeline name used as the MLflow experiment name (and
            tags) when

            the connection does not set ``MLFLOW_EXPERIMENT_NAME``. Pass the pipeline''s
            logical

            name (e.g. ``PIPELINE_NAME``) so runs aggregate under one experiment.'
          parameterType: STRING
        preset:
          defaultValue: speed
          description: Training quality preset logged on the parent run.
          isOptional: true
          parameterType: STRING
        register_best_model:
          defaultValue: false
          description: When True, register the best model in the MLflow Model Registry.
          isOptional: true
          parameterType: BOOLEAN
        run_id:
          description: KFP run ID (from ``dsl.PIPELINE_JOB_ID_PLACEHOLDER``).
          parameterType: STRING
        run_name:
          defaultValue: ''
          description: 'Per-execution MLflow parent run name. Pass the run''s display
            name (from

            ``dsl.PIPELINE_JOB_NAME_PLACEHOLDER``) so the MLflow run matches the OpenShift
            run

            name. Falls back to ``pipeline_name`` when empty.'
          isOptional: true
          parameterType: STRING
        target_stage:
          defaultValue: ''
          description: 'Optional deployment-stage value set as a ``target_stage``
            tag on the

            registered best-model version.'
          isOptional: true
          parameterType: STRING
        task_type:
          description: ML task type (``binary``, ``multiclass``, ``regression``, or
            ``time_series``).
          parameterType: STRING
        top_n:
          defaultValue: 3.0
          description: Number of top models logged on the parent run.
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
