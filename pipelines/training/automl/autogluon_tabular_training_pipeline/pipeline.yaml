          \            models_metadata.append(model_metadata)\n            with (Path(models_artifact.path)\
          \ / model_name_full / \"model.json\").open(\"w\", encoding=\"utf-8\") as\
          \ f:\n                json.dump(model_metadata, f, indent=2)\n\n       \
          \ status.record(\n            \"refit_and_evaluate\",\n            \"completed\"\
          ,\n            model_count=len(model_names_full),\n            eval_metric=str(predictor.eval_metric),\n\
