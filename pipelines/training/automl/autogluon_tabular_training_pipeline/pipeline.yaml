# PIPELINE DEFINITION
# Name: autogluon-tabular-training-pipeline
# Description: AutoML tabular training pipeline for building high-quality models on structured data with minimal effort. Powered by AutoGluon, it automates discovery, ensembling, and selection, then refits top candidates for maximum accuracy. Delivers production-ready predictors, clear metrics, and a ranked leaderboard to choose the best deployment option.
# Inputs:
#    eval_metric: str [Default: '']
#    label_column: str
#    positive_class: str [Default: '']
#    preset: str [Default: 'speed']
#    task_type: str
#    test_data_bucket_name: str [Default: '']
#    test_data_file_key: str [Default: '']
#    top_n: int [Default: 3.0]
#    train_data_bucket_name: str
#    train_data_file_key: str
#    train_data_secret_name: str
components:
  comp-autogluon-models-training:
    executorLabel: exec-autogluon-models-training
    inputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
          description: Dataset artifact (CSV) used for leaderboard ranking and evaluation.
      parameters:
        eval_metric:
          defaultValue: ''
          description: 'Metric for model ranking (e.g. ``"r2"``, ``"accuracy"``).
            Defaults

            to ``"r2"`` for regression and ``"accuracy"`` otherwise.'
          isOptional: true
          parameterType: STRING
        extra_train_data_path:
          defaultValue: ''
          description: Optional path to extra training CSV passed to ``refit_full``.
          isOptional: true
          parameterType: STRING
        label_column:
          description: Target/label column name in train and test datasets.
          parameterType: STRING
        log_model_artifacts:
          defaultValue: true
          description: 'When True, upload each model''s predictor (model.pkl) and

            notebook to its MLflow child run.'
          isOptional: true
          parameterType: BOOLEAN
        pipeline_name:
          description: Pipeline run name; last dash-segment stripped for the notebook.
          parameterType: STRING
        positive_class:
          defaultValue: ''
          description: 'Label value for the positive class in **binary** classification

            (e.g. ``"1"`` or ``"yes"``). Passed to ``TabularPredictor`` when set.

            Empty string (default) lets AutoGluon infer the positive class when ``fit``
            runs.

            Ignored for ``multiclass`` and ``regression``.'
          isOptional: true
          parameterType: STRING
        preset:
          defaultValue: speed
          description: 'Training quality tier. ``"speed"`` (default) or ``"balanced"``

            (may run more than 2x longer).'
          isOptional: true
          parameterType: STRING
        run_id:
          description: Pipeline run ID written into the generated notebook.
          parameterType: STRING
        run_name:
          defaultValue: ''
          description: 'Per-execution MLflow run name recorded as a tag on child runs.
            Falls

            back to ``pipeline_name`` when empty.'
          isOptional: true
          parameterType: STRING
        sample_row:
          description: JSON array of row dicts for the notebook example input; label
            column is stripped.
          parameterType: STRING
        sampling_config:
          description: Data sampling config stored in artifact metadata.
          isOptional: true
          parameterType: STRUCT
        split_config:
          description: Data split config stored in artifact metadata.
          isOptional: true
          parameterType: STRUCT
        task_type:
          description: 'ML task type: ``"binary"``, ``"multiclass"``, or ``"regression"``.'
          parameterType: STRING
        test_data_bucket_name:
          defaultValue: ''
          description: Optional S3 bucket for user-provided external test data.
          isOptional: true
          parameterType: STRING
        test_data_file_key:
          defaultValue: ''
          description: Optional S3 object key for user-provided external test data.
          isOptional: true
          parameterType: STRING
        top_n:
          description: Number of top models to select and refit (1-10).
          parameterType: NUMBER_INTEGER
        train_data_bucket_name:
          defaultValue: ''
          description: S3 bucket containing the training dataset.
          isOptional: true
          parameterType: STRING
        train_data_file_key:
          defaultValue: ''
          description: S3 object key for the training dataset.
          isOptional: true
          parameterType: STRING
        train_data_path:
          description: Path to the selection-train CSV on the PVC workspace.
          parameterType: STRING
        train_data_secret_name:
          defaultValue: ''
          description: Kubernetes secret name for S3 credentials used by the pipeline.
          isOptional: true
          parameterType: STRING
        workspace_path:
          description: PVC workspace directory; predictor saved at ``workspace_path/autogluon_predictor``.
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        experiment_notebook:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        html_artifact:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        models_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        best_model_name:
          parameterType: STRING
        eval_metric:
          parameterType: STRING
