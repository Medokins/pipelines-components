          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef publish_component_stage_map(\n    pipeline_id: str,\n    run_id:\
          \ str,\n    component_stage_map: dsl.Output[dsl.Artifact],\n) -> None:\n\
          \    \"\"\"Publish the component-to-stage-to-step map for dashboard consumption.\n\
          \n    Reads the static JSON template from the package (``run_status_templates/pipelines/``)\n\
          \    and publishes it as a KFP artifact. Dashboards use this map to show\
          \ expected\n    components, stages, and steps before pipeline execution\
          \ begins.\n\n    Args:\n        pipeline_id: Pipeline identifier matching\
          \ the template filename\n            (e.g. ``autogluon-tabular-training-pipeline``).\n\
          \        run_id: KFP run ID for tracking (from ``dsl.PIPELINE_JOB_ID_PLACEHOLDER``).\n\
          \        component_stage_map: Output artifact containing the component-to-stage-to-step\
          \ map.\n\n    Raises:\n        FileNotFoundError: If the template for ``pipeline_id``\
          \ is missing or empty.\n        ValueError: If ``pipeline_id`` or ``run_id``\
          \ is empty.\n\n    Example:\n        map_task = publish_component_stage_map(\n\
          \            pipeline_id=\"autogluon-tabular-training-pipeline\",\n    \
          \        run_id=dsl.PIPELINE_JOB_ID_PLACEHOLDER,\n        )\n    \"\"\"\n\
          \    import json\n    import os\n    from datetime import UTC, datetime\n\
          \    from pathlib import Path\n\n    from kfp_components.components.training.automl.shared.run_status\
          \ import (\n        load_pipeline_run_status_manifest,\n    )\n\n    def\
          \ _build_mlflow_stage_map_block() -> dict:\n        \"\"\"Build the ``mlflow``\
          \ block from the platform-injected ``KFP_MLFLOW_CONFIG`` blob.\n\n     \
          \   Inlined so the publisher does not depend on ``shared/mlflow_tracking.py``\
          \ being\n        installed in the runtime image (mirrors ``build_mlflow_stage_map_block``\
          \ there).\n        \"\"\"\n        raw = os.getenv(\"KFP_MLFLOW_CONFIG\"\
          , \"\").strip()\n        if not raw:\n            return {\"tracking_enabled\"\
          : False}\n        try:\n            data = json.loads(raw)\n        except\
          \ json.JSONDecodeError:\n            return {\"tracking_enabled\": False}\n\
          \        if not isinstance(data, dict):\n            return {\"tracking_enabled\"\
          : False}\n\n        tracking_uri = str(data.get(\"endpoint\", \"\")).strip()\n\
          \        if not tracking_uri:\n            return {\"tracking_enabled\"\
          : False}\n\n        block: dict = {\"tracking_enabled\": True, \"tracking_uri\"\
          : tracking_uri}\n        experiment_id = str(data.get(\"experimentId\",\
          \ \"\")).strip()\n        if experiment_id:\n            block[\"experiment_id\"\
          ] = experiment_id\n        parent_run_id = str(data.get(\"parentRunId\"\
          , \"\")).strip()\n        if parent_run_id:\n            block[\"run_id\"\
          ] = parent_run_id\n        workspace = str(data.get(\"workspace\", \"\"\
          )).strip() if data.get(\"workspacesEnabled\") else \"\"\n        if workspace:\n\
          \            block[\"workspace\"] = workspace\n        if experiment_id\
          \ and parent_run_id:\n            base = tracking_uri.rstrip(\"/\")\n  \
          \          block[\"run_url\"] = f\"{base}/#/experiments/{experiment_id}/runs/{parent_run_id}\"\
          \n        return block\n\n    if not isinstance(pipeline_id, str) or not\
          \ pipeline_id.strip():\n        raise ValueError(\"pipeline_id must be a\
          \ non-empty string\")\n    if not isinstance(run_id, str) or not run_id.strip():\n\
          \        raise ValueError(\"run_id must be a non-empty string\")\n\n   \
          \ stage_map = load_pipeline_run_status_manifest(pipeline_id)\n    # Legacy\
          \ templates may include an empty initial_document shell; not part of the\
          \ stage map.\n    stage_map.pop(\"initial_document\", None)\n    if not\
          \ stage_map.get(\"components\"):\n        raise FileNotFoundError(\n   \
          \         f\"Component stage map not found or empty for pipeline_id='{pipeline_id}'.\
          \ \"\n            \"Ensure run_status_templates/pipelines/<pipeline_id>.json\
          \ is packaged in the AutoML image.\"\n        )\n\n    stage_map[\"kfp_run_id\"\
          ] = run_id\n    stage_map[\"published_at\"] = datetime.now(UTC).isoformat().replace(\"\
          +00:00\", \"Z\")\n    stage_map[\"mlflow\"] = _build_mlflow_stage_map_block()\n\
          \n    output_path = Path(component_stage_map.path)\n    output_path.mkdir(parents=True,\
          \ exist_ok=True)\n\n    output_file = output_path / \"component_stage_map.json\"\
          \n    with output_file.open(\"w\", encoding=\"utf-8\") as f:\n        json.dump(stage_map,\
          \ f, indent=2)\n\n    component_stage_map.metadata[\"display_name\"] = \"\
          Component Stage Map\"\n    component_stage_map.metadata[\"pipeline_id\"\
          ] = pipeline_id\n    component_stage_map.metadata[\"component_count\"] =\
          \ len(stage_map.get(\"components\", []))\n    mlflow_block = stage_map[\"\
          mlflow\"]\n    component_stage_map.metadata[\"mlflow_tracking_enabled\"\
          ] = str(mlflow_block.get(\"tracking_enabled\", False))\n\n    component_count\
          \ = len(stage_map.get(\"components\", []))\n    stage_count = sum(len(c.get(\"\
          stages\", [])) for c in stage_map.get(\"components\", []))\n    print(f\"\
          Published component stage map for pipeline_id='{pipeline_id}':\")\n    print(f\"\
          \  - Components: {component_count}\")\n    print(f\"  - Total stages: {stage_count}\"\
          )\n    print(f\"  - Published to: {output_file}\")\n    print(f\"  - MLflow\
          \ tracking enabled: {mlflow_block.get('tracking_enabled', False)}\")\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
