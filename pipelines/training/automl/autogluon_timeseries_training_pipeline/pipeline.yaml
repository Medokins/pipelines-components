          \ = required_columns - set(user_test_df.columns)\n            if missing_columns:\n\
          \                raise ValueError(\n                    f\"Missing required\
          \ columns in test dataset: {missing_columns}. \"\n                    f\"\
          Available columns: {list(user_test_df.columns)}\"\n                )\n \
          \           if uses_synthetic_id:\n                user_test_df[SYNTHETIC_ITEM_ID_COLUMN]\
          \ = SYNTHETIC_ITEM_ID_VALUE\n\n            if truncation_report.get(\"truncated\"\
          ):\n                report_test_data_truncation(\n                    status,\
          \ logger, test_data_source, len(user_test_df), TEST_DATA_MAX_SIZE_BYTES\n\
          \                )\n\n            # Fail fast on covariates AutoGluon will\
          \ demand at predict time, hours into the run.\n            missing_covariates\
          \ = [c for c in (known_covariates_names or []) if c not in set(user_test_df.columns)]\n\
          \            if missing_covariates:\n                raise ValueError(\n\
          \                    f\"Missing known covariate column(s) in test dataset:\
          \ {missing_covariates}. \"\n                    f\"Available columns: {list(user_test_df.columns)}\"\
          \n                )\n\n            # Apply same cleansing\n            user_test_df\
          \ = _clean_timeseries_dataframe(user_test_df, id_column, timestamp_column,\
          \ logger)\n\n            if not user_test_df[target].notna().any():\n  \
          \              raise ValueError(\n                    f\"Test dataset has\
          \ no observed values in target column {target!r}. \"\n                 \
          \   f\"Source: {test_data_source}. Provide at least one non-null target\
          \ for evaluation.\"\n                )\n\n            # A test set that\
          \ shares no series with the training data cannot be scored:\n          \
          \  # every forecast would be for an item the predictor never saw.\n    \
          \        # Compare as strings: pandas infers dtypes per file, so a training\
          \ frame with\n            # mixed ids (object) and a numeric-only test frame\
          \ (int64) would otherwise\n            # look disjoint and reject a perfectly\
          \ valid test set.\n            train_item_ids = {str(item_id) for item_id,\
          \ _ in df.groupby(id_column, sort=False)}\n            test_series_lengths\
          \ = {\n                str(item_id): len(series_df) for item_id, series_df\
          \ in user_test_df.groupby(id_column, sort=False)\n            }\n      \
          \      unknown_item_ids = sorted(i for i in test_series_lengths if i not\
          \ in train_item_ids)\n            if len(unknown_item_ids) == len(test_series_lengths):\n\
          \                raise ValueError(\n                    f\"Test dataset\
          \ shares no {id_column!r} values with the training data \"\n           \
          \         f\"(test ids: {unknown_item_ids[:10]}). Provide a test dataset\
          \ for the same time series.\"\n                )\n            if unknown_item_ids:\n\
          \                # Counts only: a series id can be an email address or a\
          \ customer number.\n                logger.warning(\n                  \
          \  \"Test dataset contains %s %r value(s) absent from the training data.\
          \ \"\n                    \"Those series cannot be forecast and are expected\
          \ to be skipped downstream.\",\n                    len(unknown_item_ids),\n\
          \                    id_column,\n                )\n\n            # AutoGluon\
          \ reserves the last prediction_length steps of each series as ground\n \
          \           # truth and needs at least one historical step before them,\
          \ so a series of\n            # exactly prediction_length rows fails in\
          \ leaderboard()/evaluate() -- hours\n            # into the run -- rather\
          \ than here.\n            short_series = sorted(\n                item_id\
          \ for item_id, length in test_series_lengths.items() if length <= prediction_length\n\
          \            )\n            if short_series:\n                raise ValueError(\n\
          \                    f\"Test dataset series too short for prediction_length\
          \ ({prediction_length}): \"\n                    f\"{short_series[:10]}.\
          \ Each series needs more than {prediction_length} row(s) -- the \"\n   \
          \                 \"forecast horizon plus at least one historical step --\
          \ to be evaluated.\"\n                )\n\n            # Write user test\
          \ data to artifact\n            user_test_df.to_csv(sampled_test_dataset.path,\
          \ index=False)\n\n            # Skip primary temporal split -- use ALL data\
          \ for secondary split\n            selection_parts = []\n            extra_parts\
          \ = []\n            for _, series_df in df.groupby(id_column, sort=False):\n\
          \                sel, ext = _early_late_split(series_df, selection_train_size)\n\
          \                selection_parts.append(sel)\n                extra_parts.append(ext)\n\
          \n            selection_train_df = _concat_sorted(selection_parts, [id_column,\
          \ timestamp_column])\n            extra_train_df = _concat_sorted(extra_parts,\
          \ [id_column, timestamp_column])\n\n            if len(selection_train_df)\
          \ == 0:\n                raise ValueError(\n                    \"Secondary\
          \ split produced an empty selection-train dataset. \"\n                \
          \    \"Increase rows per time series and/or selection_train_size.\"\n  \
          \              )\n\n            # Extract tail rows from test data for preview\n\
          \            test_data_for_sample = user_test_df\n\n            split_config_out\
          \ = {\n                \"test_size\": 0.0,\n                \"selection_train_size\"\
          : selection_train_size,\n            }\n\n        else:\n            test_size\
          \ = DEFAULT_TEST_SIZE\n\n            train_parts: list = []\n          \
          \  test_parts: list = []\n            for _, series_df in df.groupby(id_column,\
          \ sort=False):\n                tr, te = _early_late_split(series_df, 1.0\
          \ - test_size)\n                train_parts.append(tr)\n               \
          \ test_parts.append(te)\n\n            train_df = _concat_sorted(train_parts,\
          \ [id_column, timestamp_column])\n            test_df = _concat_sorted(test_parts,\
          \ [id_column, timestamp_column])\n\n            selection_parts: list =\
          \ []\n            extra_parts: list = []\n            for _, series_train\
          \ in train_df.groupby(id_column, sort=False):\n                sel, ext\
          \ = _early_late_split(series_train, selection_train_size)\n            \
          \    selection_parts.append(sel)\n                extra_parts.append(ext)\n\
          \n            selection_train_df = _concat_sorted(selection_parts, [id_column,\
          \ timestamp_column])\n            extra_train_df = _concat_sorted(extra_parts,\
          \ [id_column, timestamp_column])\n\n            # Validate split outputs:\n\
          \            if len(train_df) == 0:\n                raise ValueError(\n\
          \                    \"Primary temporal split produced no train rows. The\
          \ dataset may be too small for \"\n                    \"the configured\
          \ splits. Add more rows per time series, or reduce test_size \"\n      \
          \              f\"(default is {DEFAULT_TEST_SIZE}).\"\n                )\n\
          \            if len(selection_train_df) == 0:\n                raise ValueError(\n\
          \                    \"Secondary split produced an empty selection-train\
          \ dataset; \"\n                    \"models_selection_train_dataset.csv\
          \ would be empty and downstream training would fail. \"\n              \
          \      \"Increase rows per time series and/or selection_train_size, or reduce\
          \ test_size so \"\n                    \"each series has enough train rows\
          \ for the selection segment.\"\n                )\n\n            # Save\
          \ test dataset to artifact\n            test_df.to_csv(sampled_test_dataset.path,\
          \ index=False)\n\n            test_data_for_sample = test_df\n\n       \
          \     split_config_out = {\n                \"test_size\": test_size,\n\
          \                \"selection_train_size\": selection_train_size,\n     \
          \       }\n\n        _log_dataset_stats(\"split: selection_train\", selection_train_df)\n\
          \        _log_dataset_stats(\"split: extra_train\", extra_train_df)\n  \
          \      _log_dataset_stats(\n            \"split: test (user-provided)\"\
          \ if has_user_test_data else \"split: test\",\n            test_data_for_sample,\n\
          \        )\n\n        # Common post-split: write selection-train and extra-train\
          \ CSVs to workspace\n        selection_path = datasets_dir / \"models_selection_train_dataset.csv\"\
          \n        extra_path = datasets_dir / \"extra_train_dataset.csv\"\n    \
          \    selection_train_df.to_csv(selection_path, index=False)\n        extra_train_df.to_csv(extra_path,\
          \ index=False)\n\n        split_export_metrics = {\n            \"test_size\"\
          : split_config_out[\"test_size\"],\n            \"selection_train_size\"\
          : selection_train_size,\n        }\n        if has_user_test_data:\n   \
          \         split_export_metrics[\"user_test_source\"] = test_data_source\n\
          \            split_export_metrics[\"test_rows\"] = len(user_test_df)\n \
          \           split_export_metrics[\"truncated\"] = bool(truncation_report.get(\"\
          truncated\"))\n\n        status.record(\"split_and_export\", \"completed\"\
          , metrics=split_export_metrics)\n\n        # Extract tail rows for downstream\
          \ preview (ISO timestamps when supported; JSON to avoid NaN issues)\n  \
          \      sample_tail = test_data_for_sample.tail(min(5, len(test_data_for_sample)))\n\
          \        if hasattr(sample_tail, \"to_dict\"):\n            from kfp_components.components.training.automl.shared.timeseries_notebook_utils\
          \ import (\n                _json_records,\n            )\n\n          \
          \  sample_rows = json.dumps(_json_records(sample_tail))\n        else:\n\
          \            sample_rows = sample_tail.to_json(orient=\"records\")\n\n \
          \       sample_config = {\"sampling_method\": \"first_n_rows\", \"total_rows_loaded\"\
          : len(df), \"sampled_rows\": len(df)}\n\n        logger.info(\n        \
          \    \"Timeseries loader: %s rows from s3://%s/%s; split selection=%s extra=%s\
          \ test=%s\",\n            len(df),\n            bucket_name,\n         \
          \   file_key,\n            len(selection_train_df),\n            len(extra_train_df),\n\
          \            len(test_data_for_sample),\n        )\n\n        return NamedTuple(\n\
          \            \"outputs\",\n            sample_config=dict,\n           \
          \ split_config=dict,\n            sample_rows=str,\n            models_selection_train_data_path=str,\n\
          \            extra_train_data_path=str,\n            effective_id_column=str,\n\
          \            uses_synthetic_id=bool,\n        )(\n            sample_config=sample_config,\n\
          \            split_config=split_config_out,\n            sample_rows=sample_rows,\n\
          \            models_selection_train_data_path=str(selection_path),\n   \
          \         extra_train_data_path=str(extra_path),\n            effective_id_column=id_column,\n\
          \            uses_synthetic_id=uses_synthetic_id,\n        )\n\n"
        image: quay.io/opendatahub/odh-automl:odh-stable
        resources:
          cpuLimit: 32.0
          cpuRequest: 2.0
          memoryLimit: 68.719476736
          memoryRequest: 8.589934592
          resourceCpuLimit: '32'
          resourceCpuRequest: '2'
          resourceMemoryLimit: 64Gi
          resourceMemoryRequest: 8Gi
pipelineInfo:
  description: AutoML time series forecasting pipeline for building accurate, deployment-ready
    forecasters with minimal tuning. Powered by AutoGluon TimeSeries, it compares
    statistical and deep learning approaches, refits the best models, and delivers
    top predictors, back-testing insights, and a ranked leaderboard for model selection.
  name: autogluon-timeseries-training-pipeline
root:
  dag:
    tasks:
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - timeseries-data-loader
        inputs:
          artifacts:
            pipelinechannel--timeseries-data-loader-sampled_test_dataset:
              taskOutputArtifact:
                outputArtifactKey: sampled_test_dataset
                producerTask: timeseries-data-loader
          parameters:
            pipelinechannel--eval_metric:
              componentInputParameter: eval_metric
            pipelinechannel--known_covariates_names:
              componentInputParameter: known_covariates_names
            pipelinechannel--prediction_length:
              componentInputParameter: prediction_length
            pipelinechannel--preset:
              componentInputParameter: preset
            pipelinechannel--target:
              componentInputParameter: target
            pipelinechannel--test_data_bucket_name:
              componentInputParameter: test_data_bucket_name
            pipelinechannel--test_data_file_key:
              componentInputParameter: test_data_file_key
            pipelinechannel--timeseries-data-loader-effective_id_column:
              taskOutputParameter:
                outputParameterKey: effective_id_column
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-extra_train_data_path:
              taskOutputParameter:
                outputParameterKey: extra_train_data_path
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-models_selection_train_data_path:
              taskOutputParameter:
                outputParameterKey: models_selection_train_data_path
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-sample_config:
              taskOutputParameter:
                outputParameterKey: sample_config
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-sample_rows:
              taskOutputParameter:
                outputParameterKey: sample_rows
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-split_config:
              taskOutputParameter:
                outputParameterKey: split_config
                producerTask: timeseries-data-loader
            pipelinechannel--timeseries-data-loader-uses_synthetic_id:
              taskOutputParameter:
                outputParameterKey: uses_synthetic_id
                producerTask: timeseries-data-loader
            pipelinechannel--timestamp_column:
              componentInputParameter: timestamp_column
            pipelinechannel--top_n:
              componentInputParameter: top_n
            pipelinechannel--train_data_bucket_name:
              componentInputParameter: train_data_bucket_name
            pipelinechannel--train_data_file_key:
              componentInputParameter: train_data_file_key
            pipelinechannel--train_data_secret_name:
              componentInputParameter: train_data_secret_name
        taskInfo:
          name: condition-branches-1
      publish-component-stage-map:
        cachingOptions: {}
        componentRef:
          name: comp-publish-component-stage-map
        inputs:
          parameters:
            pipeline_id:
              runtimeValue:
                constant: autogluon-timeseries-training-pipeline
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: publish-component-stage-map
      timeseries-data-loader:
        cachingOptions: {}
        componentRef:
          name: comp-timeseries-data-loader
        dependentTasks:
        - publish-component-stage-map
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: train_data_bucket_name
            file_key:
              componentInputParameter: train_data_file_key
            id_column:
              componentInputParameter: id_column
            known_covariates_names:
              componentInputParameter: known_covariates_names
            prediction_length:
              componentInputParameter: prediction_length
            preset:
              componentInputParameter: preset
            target:
              componentInputParameter: target
            test_data_bucket_name:
              componentInputParameter: test_data_bucket_name
            test_data_file_key:
              componentInputParameter: test_data_file_key
            timestamp_column:
              componentInputParameter: timestamp_column
            workspace_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
        taskInfo:
          name: timeseries-data-loader
  inputDefinitions:
    parameters:
      eval_metric:
        defaultValue: mean_absolute_scaled_error
        description: 'Metric for model ranking in snake_case (e.g. ``"mean_absolute_scaled_error"``,

          ``"weighted_quantile_loss"``) or legacy uppercase acronym form. Defaults
          to

          ``"mean_absolute_scaled_error"``.'
        isOptional: true
        parameterType: STRING
      id_column:
        defaultValue: ''
        description: 'Name of the column that identifies each time series (e.g. product_id,
          store_id).

          Pass an empty string ("") for single-series two-column datasets (timestamp
          + target only);

          the loader will inject a synthetic ID column. Passed as ``id_column`` when
          constructing

          TimeSeriesDataFrame; result uses ``item_id``.'
        isOptional: true
        parameterType: STRING
      known_covariates_names:
        defaultValue: []
        description: 'Column names known in advance for the forecast horizon

          (e.g. holidays, promotions). Defaults to ``[]`` (no known covariates). See

          :attr:`~autogluon.timeseries.TimeSeriesPredictor.known_covariates_names`.'
        isOptional: true
        parameterType: LIST
      prediction_length:
        defaultValue: 1.0
        description: 'Number of time steps to forecast (horizon length). Positive
          integer

          (default: 1).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      preset:
        defaultValue: speed
        description: 'Training quality tier. ``"speed"`` (default, 4 vCPU / 16 GiB)
          or

          ``"balanced"`` (may run more than 2x longer, 8 vCPU / 32 GiB).'
        isOptional: true
        parameterType: STRING
      target:
        description: 'Name of the column containing the numeric values to forecast.
          Corresponds to

          :attr:`~autogluon.timeseries.TimeSeriesDataFrame` target column.'
        parameterType: STRING
      test_data_bucket_name:
        defaultValue: ''
        description: 'Optional S3-compatible bucket name for a user-provided test
          dataset.

          Default: empty string (use the per-series holdout split from training data).'
        isOptional: true
        parameterType: STRING
      test_data_file_key:
        defaultValue: ''
        description: 'Optional S3 object key for a user-provided test CSV file.

          Default: empty string (use the per-series holdout split from training data).'
        isOptional: true
        parameterType: STRING
      timestamp_column:
        description: 'Name of the column containing the timestamp/datetime for each
          observation.

          Passed as ``timestamp_column`` when constructing TimeSeriesDataFrame; result
          uses

          ``timestamp`` as the second index level.'
        parameterType: STRING
      top_n:
        defaultValue: 3.0
        description: 'Number of top models to select for the leaderboard and output
          (default: 3).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      train_data_bucket_name:
        description: S3-compatible bucket name containing the time series data file.
        parameterType: STRING
      train_data_file_key:
        description: 'S3 object key of the data file (CSV or Parquet). When ``id_column``
          is

          provided, file must include columns for id, timestamp, and target. When
          ``id_column=""``

          (single-series mode), file must have exactly timestamp and target columns
          (the loader injects

          ``__synthetic_item_id``). Optional columns for known covariates.'
        parameterType: STRING
      train_data_secret_name:
        description: 'Kubernetes secret name containing S3 credentials

          (e.g. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT, AWS_DEFAULT_REGION).

          Used for training data and optional user-provided external test data.'
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-timeseries-data-loader:
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            optional: true
            secretNameParameter:
              componentInputParameter: train_data_secret_name
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteOnce
        size: 12Gi
