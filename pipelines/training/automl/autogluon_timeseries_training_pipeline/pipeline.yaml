          parameterType: NUMBER_DOUBLE
        target:
          description: Name of the target column to forecast.
          parameterType: STRING
        test_data_bucket_name:
          defaultValue: ''
          description: 'S3 bucket name for user-provided test dataset (default: empty
            string).'
          isOptional: true
          parameterType: STRING
        test_data_file_key:
          defaultValue: ''
          description: 'S3 object key of the user-provided test CSV (default: empty
            string).'
          isOptional: true
          parameterType: STRING
        timestamp_column:
          description: Name of the timestamp/datetime column.
          parameterType: STRING
        workspace_path:
          description: PVC workspace directory where train CSVs will be written.
          parameterType: STRING
    outputDefinitions:
