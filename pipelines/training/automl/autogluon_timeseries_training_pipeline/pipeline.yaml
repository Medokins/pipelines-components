          \ dsl.Output[dsl.HTML],\n    experiment_notebook: dsl.Output[dsl.Artifact],\n\
          \    component_status: dsl.Output[dsl.Artifact],\n    uses_synthetic_id:\
          \ bool = False,\n    sample_rows: str = \"[]\",\n    sampling_config: Optional[dict]\
          \ = None,\n    split_config: Optional[dict] = None,\n    prediction_length:\
          \ int = 1,\n    known_covariates_names: Optional[List[str]] = None,\n  \
          \  preset: str = \"speed\",\n    eval_metric: str = \"mean_absolute_scaled_error\"\
