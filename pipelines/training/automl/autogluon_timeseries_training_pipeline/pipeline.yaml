          ,\n    train_data_secret_name: str = \"\",\n    train_data_bucket_name:\
          \ str = \"\",\n    train_data_file_key: str = \"\",\n) -> NamedTuple(\n\
          \    \"outputs\",\n    top_models=List[str],\n    predictor_path=str,\n\
          \    eval_metric=str,\n    model_config=dict,\n    best_model_name=str,\n\
          ):\n    \"\"\"Train, select, and full-refit top N AutoGluon timeseries models.\n\
          \n    This component combines model generation and full-refit into one step\
          \ to avoid\n    pipeline-level ``ParallelFor``. It trains multiple AutoGluon\
          \ TimeSeries models on\n    the selection training data, ranks them on the\
          \ test set, then sequentially refits\n    the top N models on full train\
          \ data (selection split + extra split).\n\n    Refit outputs for all selected\
          \ models are written under one ``models_artifact``,\n    and a ranked HTML\
          \ leaderboard is written to ``html_artifact``.\n\n    Args:\n        target:\
          \ Name of the target column to forecast.\n        id_column: Name of the\
          \ column identifying each time series (item_id).\n        timestamp_column:\
          \ Name of the timestamp/datetime column.\n        train_data_path: Path\
          \ to the selection training CSV file.\n        test_data: Test dataset artifact\
          \ for evaluation.\n        top_n: Number of top models to select for full\
          \ refit.\n        workspace_path: Workspace directory where predictor will\
          \ be saved.\n        pipeline_name: Pipeline name used in generated notebook\
          \ placeholders.\n        run_id: Pipeline run id used in generated notebook\
          \ placeholders.\n        train_data_secret_name: Kubernetes secret name\
          \ for S3 credentials used by the pipeline.\n        train_data_bucket_name:\
          \ S3 bucket containing the training dataset.\n        train_data_file_key:\
          \ S3 object key for the training dataset.\n        models_artifact: Combined\
          \ output artifact containing all refitted models.\n        extra_train_data_path:\
          \ Path to extra train split for full refit.\n        html_artifact: Output\
          \ HTML artifact containing the ranked leaderboard page.\n        experiment_notebook:\
          \ Output artifact containing the run-level experiment launcher notebook.\n\
          \        component_status: Output artifact containing stage-level progress\
          \ tracking for this component.\n        uses_synthetic_id: True if the loader\
          \ injected a synthetic ID column for two-column datasets.\n        sample_rows:\
          \ Sample rows JSON string used in generated notebook placeholders.\n   \
          \     sampling_config: Optional sampling config stored in artifact metadata.\n\
          \        split_config: Optional split config stored in artifact metadata.\n\
          \        prediction_length: Forecast horizon (number of timesteps).\n  \
          \      known_covariates_names: Optional list of known covariate column names.\n\
          \        preset: Training quality tier. ``\"speed\"`` (default) or ``\"\
          balanced\"``\n            (may run more than 2x longer).\n        eval_metric:\
          \ Metric for model ranking (e.g. ``\"mean_absolute_scaled_error\"``,\n \
          \           ``\"weighted_quantile_loss\"``). Defaults to ``\"mean_absolute_scaled_error\"\
          ``.\n            Legacy uppercase acronyms (e.g. ``\"MASE\"``) are accepted\
          \ and normalized to snake_case.\n        run_name: Per-execution MLflow\
          \ run name recorded as a tag on child runs. Falls\n            back to ``pipeline_name``\
          \ when empty.\n        log_model_artifacts: When True, upload each model's\
          \ predictor and notebook to its\n            MLflow child run.\n       \
          \ test_data_bucket_name: Optional S3 bucket for user-provided external test\
          \ data.\n        test_data_file_key: Optional S3 object key for user-provided\
          \ external test data.\n\n    MLflow logging:\n        When the platform\
          \ injects ``KFP_MLFLOW_CONFIG``, results are logged to MLflow\n        incrementally:\
          \ the parent run is opened before the refit loop and each refitted\n   \
          \     model becomes a nested child run as it finishes, with parent aggregates\
          \ plus\n        best-model registration finalized at the end. ``TimeSeriesPredictor``\
          \ has no\n        callback API, so there is no live per-candidate streaming\
          \ during ``fit()``. All\n        MLflow work is best-effort and never fails\
          \ training.\n\n    Returns:\n        NamedTuple: top_models list, predictor_path,\
          \ eval_metric, model_config.\n    \"\"\"\n    import json\n    import logging\n\
          \    import math\n    import shutil\n    import tempfile\n    import time\n\
          \    from pathlib import Path\n\n    import pandas as pd\n    from autogluon.timeseries\
          \ import TimeSeriesDataFrame, TimeSeriesPredictor\n    from autogluon.timeseries.metrics\
          \ import AVAILABLE_METRICS, METRIC_ALIASES\n    from kfp_components.components.training.automl.shared.component_status\
          \ import ComponentStatusTracker\n    from kfp_components.components.training.automl.shared.run_status\
          \ import shared_automl_dir\n\n    logger = logging.getLogger(__name__)\n\
          \n    from kfp_components.components.training.automl.shared.back_testing\
          \ import build_back_testing_json\n    from kfp_components.components.training.automl.shared.back_testing_charts\
          \ import (\n        notebook_backtest_charts_source,\n    )\n    from kfp_components.components.training.automl.shared.timeseries_notebook_utils\
          \ import (\n        build_predict_sample_artifact,\n        notebook_timeseries_sample_helpers_source,\n\
          \    )\n\n    status = ComponentStatusTracker(component_status.path, \"\
          autogluon_timeseries_models_training\")\n    with status:\n        status.set_metadata(display_name=\"\
          Timeseries Models Training Status\")\n        component_status.metadata[\"\
          display_name\"] = \"Timeseries Models Training Status\"\n        TOP_N_MAX\
          \ = 7\n        VALID_PRESETS = {\"speed\", \"balanced\"}\n        PRESET_AG_NAMES\
          \ = {\"speed\": \"fast_training\", \"balanced\": \"medium_quality\"}\n \
          \       PRESET_TIME_LIMITS = {\"speed\": 10 * 60, \"balanced\": 60 * 60}\n\
          \n        # Normalize eval_metric to snake_case; accept legacy uppercase\
          \ acronyms (e.g. \"MASE\") for back-compat.\n        _acronym_to_snake =\
          \ {acronym: snake for snake, acronym in METRIC_ALIASES.items()}\n      \
          \  eval_metric = _acronym_to_snake.get(eval_metric, eval_metric)\n\n   \
          \     # Input validation\n        if preset not in VALID_PRESETS:\n    \
          \        raise ValueError(f\"preset must be one of {VALID_PRESETS}; got\
          \ {preset!r}.\")\n        for param, value in (\n            (\"target\"\
          , target),\n            (\"id_column\", id_column),\n            (\"timestamp_column\"\
          , timestamp_column),\n            (\"train_data_path\", train_data_path),\n\
          \            (\"workspace_path\", workspace_path),\n            (\"eval_metric\"\
          , eval_metric),\n        ):\n            if not isinstance(value, str) or\
          \ not value.strip():\n                raise TypeError(f\"{param} must be\
          \ a non-empty string.\")\n        if eval_metric not in METRIC_ALIASES:\n\
          \            raise ValueError(f\"eval_metric must be one of {sorted(METRIC_ALIASES)};\
          \ got {eval_metric!r}.\")\n        if not isinstance(top_n, int):\n    \
          \        raise TypeError(\"top_n must be an integer.\")\n        if top_n\
          \ <= 0 or top_n > TOP_N_MAX:\n            raise ValueError(f\"top_n must\
          \ be an integer in the range (0, {TOP_N_MAX}]; got {top_n}.\")\n       \
          \ if not isinstance(prediction_length, int):\n            raise TypeError(\"\
          prediction_length must be an integer.\")\n        if prediction_length <=\
          \ 0:\n            raise ValueError(\"prediction_length must be greater than\
          \ 0.\")\n        if known_covariates_names is not None:\n            if\
          \ not isinstance(known_covariates_names, list) or any(\n               \
          \ (not isinstance(v, str) or not v.strip()) for v in known_covariates_names\n\
          \            ):\n                raise TypeError(\"known_covariates_names\
          \ must be a list of non-empty strings or None.\")\n        for param, value\
          \ in (\n            (\"pipeline_name\", pipeline_name),\n            (\"\
          run_id\", run_id),\n            (\"extra_train_data_path\", extra_train_data_path),\n\
          \        ):\n            if not isinstance(value, str) or not value.strip():\n\
          \                raise TypeError(f\"{param} must be a non-empty string.\"\
          )\n        if not isinstance(sample_rows, str):\n            raise TypeError(\"\
          sample_rows must be a string.\")\n        if models_artifact is not None\
          \ and not hasattr(models_artifact, \"path\"):\n            raise TypeError(\"\
          models_artifact must be a KFP output artifact or None.\")\n        if not\
          \ hasattr(component_status, \"path\"):\n            raise TypeError(\"component_status\
          \ must be a KFP output artifact.\")\n        if not hasattr(models_artifact,\
          \ \"path\"):\n            raise TypeError(\"models_artifact must be a KFP\
          \ output artifact.\")\n        if sampling_config is not None and not isinstance(sampling_config,\
          \ dict):\n            raise TypeError(\"sampling_config must be a dictionary\
          \ or None.\")\n        if split_config is not None and not isinstance(split_config,\
          \ dict):\n            raise TypeError(\"split_config must be a dictionary\
          \ or None.\")\n        sampling_config = sampling_config or {}\n       \
          \ split_config = split_config or {}\n        time_limit = PRESET_TIME_LIMITS[preset]\n\
          \n        train_df = pd.read_csv(train_data_path)\n        test_df = pd.read_csv(test_data.path)\n\
          \        logger.info(\"Loaded train=%s test=%s rows\", len(train_df), len(test_df))\n\
          \        # pd.read_csv returns the timestamp column as object (string) dtype.\n\
          \        # TimeSeriesDataFrame.from_data_frame requires datetime64; convert\
          \ explicitly.\n        # utc=True handles both tz-naive and tz-aware (e.g.\
          \ ISO 8601 with Z suffix) strings;\n        # tz_localize(None) then strips\
          \ tz info to produce tz-naive datetime64[ns].\n        train_df[timestamp_column]\
          \ = pd.to_datetime(train_df[timestamp_column], utc=True).dt.tz_localize(None)\n\
          \        test_df[timestamp_column] = pd.to_datetime(test_df[timestamp_column],\
          \ utc=True).dt.tz_localize(None)\n\n        train_ts = TimeSeriesDataFrame.from_data_frame(\n\
          \            train_df,\n            id_column=id_column,\n            timestamp_column=timestamp_column,\n\
          \        )\n        test_ts = TimeSeriesDataFrame.from_data_frame(\n   \
          \         test_df,\n            id_column=id_column,\n            timestamp_column=timestamp_column,\n\
          \        )\n        logger.info(\n            \"Train TimeSeriesDataFrame:\
          \ %s rows, %s items; test: %s rows, %s items\",\n            len(train_ts),\n\
          \            train_ts.num_items,\n            len(test_ts),\n          \
          \  test_ts.num_items,\n        )\n\n        # Create predictor path in workspace\n\
          \        predictor_path = Path(workspace_path) / \"timeseries_predictor\"\
          \n\n        # Create TimeSeriesPredictor\n        predictor = TimeSeriesPredictor(\n\
          \            prediction_length=prediction_length,\n            target=target,\n\
          \            eval_metric=eval_metric,\n            path=str(predictor_path),\n\
          \            verbosity=2,\n            known_covariates_names=known_covariates_names,\n\
          \        )\n\n        logger.info(\n            \"Timeseries selection:\
          \ training (preset=%s, time_limit=%ss, prediction_length=%s)...\",\n   \
          \         preset,\n            time_limit,\n            prediction_length,\n\
          \        )\n        status.record(\"model_selection\", \"started\")\n  \
          \      # Accumulates only the model-fitting call durations (selection fit\
          \ + refit loop) for the\n        # parent metric, excluding leaderboard,\
          \ evaluation, notebook and logging overhead.\n        total_fit_time_seconds\
          \ = 0.0\n        fit_start_time = time.perf_counter()\n        try:\n  \
          \          predictor.fit(\n                train_data=train_ts,\n      \
          \          presets=PRESET_AG_NAMES[preset],\n                time_limit=time_limit,\n\
          \                # exclude deep learning models pretrained on large time\
          \ series datasets\n                excluded_model_types=[\"Chronos\", \"\
          Toto\", \"Chronos2\"],\n            )\n        except Exception as e:\n\
          \            logger.error(f\"Training failed: {str(e)}\")\n            raise\
          \ ValueError(f\"TimeSeriesPredictor training failed: {str(e)}\") from e\n\
          \        total_fit_time_seconds += time.perf_counter() - fit_start_time\n\
          \n        try:\n            leaderboard = predictor.leaderboard(test_ts)\n\
          \        except Exception as e:\n            logger.error(f\"Leaderboard\
          \ generation failed: {str(e)}\")\n            raise ValueError(f\"Failed\
          \ to generate leaderboard: {str(e)}\") from e\n\n        if top_n > len(leaderboard):\n\
          \            raise ValueError(\n                f\"top_n must be less than\
          \ or equal to number_of_models_trained ({len(leaderboard)}); got {top_n}.\"\
          \n            )\n\n        top_models = leaderboard.head(top_n)[\"model\"\
          ].values.tolist()\n        status.record(\n            \"model_selection\"\
          ,\n            \"completed\",\n            metrics={\"top_n\": top_n, \"\
          selected_models\": top_models},\n        )\n        logger.info(\n     \
          \       \"Timeseries selection done: top_%s=%s best_score_test=%s\",\n \
          \           top_n,\n            top_models,\n            leaderboard.iloc[0][\"\
          score_test\"],\n        )\n\n        # Create model config\n        model_config\
          \ = {\n            \"prediction_length\": prediction_length,\n         \
          \   \"eval_metric\": eval_metric,\n            \"target\": target,\n   \
          \         \"id_column\": id_column,\n            \"timestamp_column\": timestamp_column,\n\
          \            \"presets\": preset,\n            \"time_limit\": time_limit,\n\
          \            \"known_covariates_names\": known_covariates_names or [],\n\
          \            \"num_models_trained\": len(leaderboard),\n        }\n\n  \
          \      # Stage 2: Full refit of selected models on full train data (selection\
          \ + extra).\n        from autogluon.timeseries.models.ensemble import AbstractTimeSeriesEnsembleModel\n\
          \n        selection_ts_df = train_ts\n        extra_train_ts_df = TimeSeriesDataFrame.from_path(\n\
          \            path=extra_train_data_path,\n            id_column=id_column,\n\
          \            timestamp_column=timestamp_column,\n        )\n        full_train_ts_df\
          \ = TimeSeriesDataFrame(pd.concat([selection_ts_df, extra_train_ts_df],\
          \ axis=0))\n        model_hyperparams = predictor.fit_summary()[\"model_hyperparams\"\
          ]\n\n        sample_row_list = json.loads(sample_rows or \"[]\")\n     \
          \   if not isinstance(sample_row_list, list):\n            raise ValueError(\"\
          sample_rows must be a JSON list.\")\n\n        def retrieve_pipeline_name(name:\
          \ str) -> str:\n            if not name:\n                return name\n\
          \            trimmed_name = name.rstrip(\"-\")\n            if \"-\" not\
          \ in trimmed_name:\n                return trimmed_name\n            tokens\
          \ = trimmed_name.split(\"-\")\n            return \"-\".join(tokens[:-1])\
          \ if len(tokens) > 1 else tokens[0]\n\n        pipeline_name_trimmed = retrieve_pipeline_name(pipeline_name)\n\
          \        model_names_full = []\n        models_metadata = []\n        failed_models\
          \ = []\n\n        status.record(\"refit_and_evaluate\", \"started\")\n\n\
          \        def replace_placeholder_in_notebook(notebook, replacements):\n\
          \            for cell in notebook.get(\"cells\", []):\n                if\
          \ cell.get(\"cell_type\") != \"code\":\n                    continue\n \
          \               new_source = []\n                src = cell.get(\"source\"\
          , [])\n                if isinstance(src, str):\n                    src\
          \ = [src]\n                for line in src:\n                    for placeholder,\
          \ value in replacements.items():\n                        line = line.replace(placeholder,\
          \ value)\n                    new_source.append(line)\n                cell[\"\
          source\"] = new_source\n            return notebook\n\n        def _dtype_to_datatype(dtype)\
          \ -> str:\n            name = str(dtype).lower()\n            match name:\n\
          \                case _ if \"bool\" in name:\n                    return\
          \ \"boolean\"\n                case _ if \"int\" in name:\n            \
          \        return \"integer\"\n                case _ if \"float\" in name:\n\
          \                    return \"number\"\n                case _:\n      \
          \              return \"string\"\n\n        def _build_timeseries_inference_block():\n\
          \            try:\n                covariates = known_covariates_names or\
          \ []\n\n                def _cov_datatype(col):\n                    return\
          \ (\n                        _dtype_to_datatype(full_train_ts_df[col].dtype)\
          \ if col in full_train_ts_df.columns else \"string\"\n                 \
          \   )\n\n                instance_fields = []\n                sample_instance\
          \ = {}\n                if not uses_synthetic_id:\n                    instance_fields.append({\"\
          name\": id_column, \"datatype\": \"string\", \"role\": \"id\", \"required\"\
          : True})\n                    sample_instance[id_column] = \"<string>\"\n\
          \                instance_fields.append(\n                    {\"name\"\
          : timestamp_column, \"datatype\": \"string\", \"role\": \"timestamp\", \"\
          required\": True}\n                )\n                sample_instance[timestamp_column]\
          \ = \"<string>\"\n                instance_fields.append({\"name\": target,\
          \ \"datatype\": \"number\", \"role\": \"target\", \"required\": True})\n\
          \                sample_instance[target] = \"<number>\"\n              \
          \  for col in covariates:\n                    dt = _cov_datatype(col)\n\
          \                    instance_fields.append({\"name\": col, \"datatype\"\
          : dt, \"role\": \"known_covariate\", \"required\": True})\n            \
          \        sample_instance[col] = f\"<{dt}>\"\n\n                schema =\
          \ {\n                    \"protocol\": \"v1_json\",\n                  \
          \  \"prediction_length\": prediction_length,\n                    \"instances\"\
          : {\"required\": True, \"fields\": instance_fields},\n                }\n\
          \                payload = {\"instances\": [sample_instance]}\n\n      \
          \          if covariates:\n                    cov_fields = []\n       \
          \             sample_cov = {}\n                    if not uses_synthetic_id:\n\
          \                        cov_fields.append({\"name\": id_column, \"datatype\"\
          : \"string\", \"role\": \"id\", \"required\": True})\n                 \
          \       sample_cov[id_column] = \"<string>\"\n                    cov_fields.append(\n\
          \                        {\"name\": timestamp_column, \"datatype\": \"string\"\
          , \"role\": \"timestamp\", \"required\": True}\n                    )\n\
          \                    sample_cov[timestamp_column] = \"<string>\"\n     \
          \               for col in covariates:\n                        dt = _cov_datatype(col)\n\
          \                        cov_fields.append({\"name\": col, \"datatype\"\
          : dt, \"role\": \"known_covariate\", \"required\": True})\n            \
          \            sample_cov[col] = f\"<{dt}>\"\n                    schema[\"\
          known_covariates\"] = {\"required\": True, \"fields\": cov_fields}\n   \
          \                 payload[\"known_covariates\"] = [sample_cov]\n\n     \
          \           return {\"input_data_schema\": schema, \"sample_payload\": payload}\n\
          \            except Exception as e:\n                logger.warning(\"Could\
          \ not build inference block; skipping: %s\", e)\n                return\
          \ None\n\n        ts_inference_block = _build_timeseries_inference_block()\n\
          \n        # The notebook rendered into models_artifact embeds real historical\
          \ sample rows, so\n        # it must never reach the MLflow tracking server.\
          \ Build a sanitized predict sample\n        # (typed placeholders instead\
          \ of real values) for a separate MLflow-only notebook.\n        # Reuses\
