# PIPELINE DEFINITION
# Name: autogluon-timeseries-training-pipeline
# Description: AutoML time series forecasting pipeline for building accurate, deployment-ready forecasters with minimal tuning. Powered by AutoGluon TimeSeries, it compares statistical and deep learning approaches, refits the best models, and delivers top predictors, back-testing insights, and a ranked leaderboard for model selection.
# Inputs:
#    eval_metric: str [Default: 'mean_absolute_scaled_error']
#    id_column: str [Default: '']
#    known_covariates_names: list [Default: []]
#    prediction_length: int [Default: 1.0]
#    preset: str [Default: 'speed']
#    target: str
#    test_data_bucket_name: str [Default: '']
#    test_data_file_key: str [Default: '']
#    timestamp_column: str
#    top_n: int [Default: 3.0]
#    train_data_bucket_name: str
#    train_data_file_key: str
#    train_data_secret_name: str
components:
  comp-autogluon-timeseries-models-training:
    executorLabel: exec-autogluon-timeseries-models-training
    inputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
          description: Test dataset artifact for evaluation.
      parameters:
        eval_metric:
          defaultValue: mean_absolute_scaled_error
          description: 'Metric for model ranking (e.g. ``"mean_absolute_scaled_error"``,

            ``"weighted_quantile_loss"``). Defaults to ``"mean_absolute_scaled_error"``.

            Legacy uppercase acronyms (e.g. ``"MASE"``) are accepted and normalized
            to snake_case.'
          isOptional: true
          parameterType: STRING
        extra_train_data_path:
          description: Path to extra train split for full refit.
          parameterType: STRING
        id_column:
          description: Name of the column identifying each time series (item_id).
          parameterType: STRING
        known_covariates_names:
          description: Optional list of known covariate column names.
          isOptional: true
          parameterType: LIST
        log_model_artifacts:
          defaultValue: true
          description: 'When True, upload each model''s predictor and notebook to
            its

            MLflow child run.'
          isOptional: true
          parameterType: BOOLEAN
        pipeline_name:
          description: Pipeline name used in generated notebook placeholders.
          parameterType: STRING
        prediction_length:
          defaultValue: 1.0
          description: Forecast horizon (number of timesteps).
          isOptional: true
          parameterType: NUMBER_INTEGER
        preset:
          defaultValue: speed
          description: 'Training quality tier. ``"speed"`` (default) or ``"balanced"``

            (may run more than 2x longer).'
          isOptional: true
          parameterType: STRING
        run_id:
          description: Pipeline run id used in generated notebook placeholders.
          parameterType: STRING
        run_name:
          defaultValue: ''
          description: 'Per-execution MLflow run name recorded as a tag on child runs.
            Falls

            back to ``pipeline_name`` when empty.'
          isOptional: true
          parameterType: STRING
        sample_rows:
          defaultValue: '[]'
          description: Sample rows JSON string used in generated notebook placeholders.
          isOptional: true
          parameterType: STRING
        sampling_config:
          description: Optional sampling config stored in artifact metadata.
          isOptional: true
          parameterType: STRUCT
        split_config:
          description: Optional split config stored in artifact metadata.
          isOptional: true
          parameterType: STRUCT
        target:
          description: Name of the target column to forecast.
          parameterType: STRING
        test_data_bucket_name:
          defaultValue: ''
          description: Optional S3 bucket for user-provided external test data.
          isOptional: true
          parameterType: STRING
        test_data_file_key:
          defaultValue: ''
          description: Optional S3 object key for user-provided external test data.
          isOptional: true
          parameterType: STRING
        timestamp_column:
          description: Name of the timestamp/datetime column.
          parameterType: STRING
        top_n:
          description: Number of top models to select for full refit.
          parameterType: NUMBER_INTEGER
        train_data_bucket_name:
          defaultValue: ''
          description: S3 bucket containing the training dataset.
          isOptional: true
          parameterType: STRING
        train_data_file_key:
          defaultValue: ''
          description: S3 object key for the training dataset.
          isOptional: true
          parameterType: STRING
        train_data_path:
          description: Path to the selection training CSV file.
          parameterType: STRING
        train_data_secret_name:
          defaultValue: ''
          description: Kubernetes secret name for S3 credentials used by the pipeline.
          isOptional: true
          parameterType: STRING
        uses_synthetic_id:
          defaultValue: false
          description: True if the loader injected a synthetic ID column for two-column
            datasets.
          isOptional: true
          parameterType: BOOLEAN
        workspace_path:
          description: Workspace directory where predictor will be saved.
          parameterType: STRING
    outputDefinitions:
      artifacts:
        component_status:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        experiment_notebook:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        html_artifact:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        models_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        best_model_name:
          parameterType: STRING
        eval_metric:
          parameterType: STRING
        model_config:
          parameterType: STRUCT
        predictor_path:
          parameterType: STRING
        top_models:
