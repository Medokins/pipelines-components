        known_covariates_names:
          description: 'Covariate columns known in advance downstream (default: none).

            Only used to fail fast when a user-provided test dataset omits one of
            them.'
          isOptional: true
          parameterType: LIST
        prediction_length:
          defaultValue: 1.0
          description: 'Forecast horizon used downstream (default: 1). Only used to

